    allow_empty_parents: true
    allow_additional: false
    disposition: governance exception

  archive:
    required:
      [
        status,
        artifact_id,
        artifact_type,
        parent_ids,
        archived_from,
        archived_at,
        archive_reason,
        archive_disposition,
        archived_commit,
        archived_blob,
        preservation_class,
      ]
    optional:
      [layer, supersedes, current_replacement, snapshot_path, content_sha256, snapshot_reason]
    forbidden:
      [reviewed_at, next_review_at, type, document_type, template_type, owner, links, generated_by]
    allowed_statuses: [archived]
    allowed_parent_types:
      [
        prd,
        architecture-description,
        adr,
        spec,
        plan,
        task,
        guide,
        policy,
        runbook,
        incident,
        postmortem,
        reference,
        audit,
      ]
    allow_empty_parents: true
    disposition: archive exception
    conditions:
      replacement:
        field: current_replacement
        required_for: [superseded, duplicate, conflict]
        forbidden_for: [withdrawn]
        optional_for: [evidence-preserve]
      snapshot:
        fields: [snapshot_path, content_sha256, snapshot_reason]
        required_for: [immutable-snapshot]
        forbidden_for: [git-history]

  unsupported:
    required: []
    optional: [status, layer, generated_by]
    forbidden:
      [
        artifact_id,
        artifact_type,
        parent_ids,
        supersedes,
        reviewed_at,
        next_review_at,
        type,
        document_type,
        template_type,
        owner,
        links,
      ]
    allowed_statuses: []
    allowed_parent_types: []
    allow_empty_parents: true
    allow_additional: true
    disposition: justified N/A
