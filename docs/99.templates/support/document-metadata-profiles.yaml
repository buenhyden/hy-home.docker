schema_version: 2

common:
  allowed_statuses: [draft, active, completed, superseded, archived]
  terminal_statuses: [superseded, archived]
  transitions:
    draft: [active]
    active: [completed, superseded]
    completed: [superseded]
    superseded: []
    archived: []
  globally_forbidden: [type, document_type, template_type, owner, links]
  typed_keys:
    [
      status,
      artifact_id,
      artifact_type,
      parent_ids,
      created,
      updated,
      observed_at,
      supersedes,
      completed_at,
      reviewed_at,
      next_review_at,
      occurred_at,
      resolved_at,
      archived_at,
    ]
  frontmatter_order:
    - status
    - artifact_id
    - artifact_type
    - parent_ids
    - created
    - updated
    - observed_at
    - supersedes
    - completed_at
    - reviewed_at
    - next_review_at
    - occurred_at
    - resolved_at
    - generated_by
    - archived_from
    - archived_at
    - archive_reason
    - archive_disposition
    - archived_commit
    - archived_blob
    - preservation_class
    - current_replacement
    - snapshot_path
    - content_sha256
    - snapshot_reason
  inventory_excludes:
    - docs/90.references/audits/ref-0023-frontmatter-semantic-inventory.md
  archive_source_prefixes:
    - docs/
    - archive/
  generated_outputs:
    docs/90.references/data/governance/document-corpus-lifecycle/ref-0066-foundation-summary.md: scripts/validation/check-document-corpus-lifecycle.py
    docs/90.references/data/governance/document-corpus-lifecycle/ref-0068-target-surface-convergence-summary.md: scripts/validation/check-document-corpus-lifecycle.py
    docs/90.references/data/governance/ref-0074-target-surface-delta-summary.md: scripts/validation/check-target-surface-delta-contract.py
  template_placeholders:
    artifact_id: <artifact-id>
    parent_id: <parent-artifact-id>
    created: <created-at>
    updated: <updated-at>
    reviewed_at: <reviewed-at>
    next_review_at: <next-review-at>
    completed_at: <completed-at>
    occurred_at: <occurred-at>
    resolved_at: <resolved-at>
    archived_from: docs/<original-path>.md
    archived_at: <archived-at>
    archive_reason: <archive-reason>
    archive_disposition: <archive-disposition>
    archived_commit: <archived-commit>
    archived_blob: <archived-blob>
    preservation_class: <preservation-class>
    current_replacement: docs/<replacement-path>.md
    snapshot_path: docs/98.archive/evidence/<content-sha256>.md.snapshot
    content_sha256: <content-sha256>
    snapshot_reason: <snapshot-reason>
  root_exceptions:
    docs/03.specs/0123-agentic-engineering-audit-remediation/spec.md: Cross-cutting umbrella spec approved without a manufactured PRD, Architecture Description, or ADR parent.

document_families:
  sdlc:
    [
      prd,
      srs,
      interface-requirement,
      architecture-description,
      adr,
      spec,
      plan,
      task,
      guide,
      policy,
      runbook,
      incident,
      postmortem,
    ]
  common:
    [
      reference,
      audit,
      archive,
      readme,
      governance,
      generated,
      template-source,
      repo-support,
      unsupported,
    ]

archive_profiles:
  change-plan:
    path_globs: [docs/98.archive/changes/chg-*/plan.md]
    template: docs/99.templates/templates/common/archive.template.md
    artifact_type: archive
    id_pattern: 'plan-(?P<identity>[0-9]{4})'
    path_identity: inherited
    parent_id_pattern: 'chg-(?P<identity>[0-9]{4})-[a-z0-9][a-z0-9-]*'
    artifact_id_identity_pattern: 'plan-(?P<identity>[0-9]{4})'
    identity_capture: identity
    required:
      [
        status,
        artifact_id,
        artifact_type,
        parent_ids,
        archived_from,
        archived_at,
        archive_reason,
        archive_disposition,
        archived_commit,
        archived_blob,
        preservation_class,
      ]
    optional:
      [layer, supersedes, current_replacement, snapshot_path, content_sha256, snapshot_reason]
    forbidden:
      [reviewed_at, next_review_at, type, document_type, template_type, owner, links, generated_by]
    allowed_statuses: [archived]
    allowed_parent_types:
      [
        prd,
        srs,
        interface-requirement,
        architecture-description,
        adr,
        spec,
        plan,
        task,
        guide,
        policy,
        runbook,
        incident,
        postmortem,
        reference,
        audit,
        archive,
      ]
    allow_empty_parents: true
    disposition: archive exception
    conditions:
      replacement:
        field: current_replacement
        required_for: [superseded, duplicate, conflict]
        forbidden_for: [withdrawn]
        optional_for: [evidence-preserve]
      snapshot:
        fields: [snapshot_path, content_sha256, snapshot_reason]
        required_for: [immutable-snapshot]
        forbidden_for: [git-history]

  change-task:
    path_globs: [docs/98.archive/changes/chg-*/task.md]
    template: docs/99.templates/templates/common/archive.template.md
    artifact_type: archive
    id_pattern: 'task-(?P<identity>[0-9]{4})-[0-9]{2}'
