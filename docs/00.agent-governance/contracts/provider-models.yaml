workflow_states:
  - state_id: discover
    owner_agent: workflow-supervisor
    required_inputs:
      - approved-objective
      - repository-state
    mutation_authority: read-only
    entry_condition: objective-and-boundary-known
    exit_gate: scope-and-canonical-owners-identified
    max_attempts: 1
    failure_return: stop
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: design/plan
  - state_id: design/plan
    owner_agent: workflow-supervisor
    required_inputs:
      - discovery-evidence
      - governing-specification
    mutation_authority: workspace-write
    entry_condition: discovery-evidence-complete
    exit_gate: implementation-ready-plan
    max_attempts: 2
    failure_return: design/plan
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: approval
  - state_id: approval
    owner_agent: rules-engineer
    required_inputs:
      - proposed-plan
      - protected-boundary
    mutation_authority: read-only
    entry_condition: plan-and-protected-boundaries-explicit
    exit_gate: authority-confirmed
    max_attempts: 1
    failure_return: approval
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: implement
  - state_id: implement
    owner_agent: workflow-supervisor
    required_inputs:
      - approved-plan
      - scoped-ownership
    mutation_authority: workspace-write
    entry_condition: required-approval-recorded
    exit_gate: scoped-change-complete
    max_attempts: 2
    failure_return: stop
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: validate
  - state_id: validate
    owner_agent: qa-engineer
    required_inputs:
      - changed-path-inventory
      - verification-contract
    mutation_authority: workspace-write
    entry_condition: implementation-attempt-complete
    exit_gate: focused-and-aggregate-gates-pass
    max_attempts: 1
    failure_return: implement
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: independent-review
  - state_id: independent-review
    owner_agent: code-reviewer
    required_inputs:
      - exact-diff
      - verification-evidence
    mutation_authority: read-only
    entry_condition: validation-gates-pass
    exit_gate: critical-and-important-zero
    max_attempts: 2
    failure_return: implement
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: evidence
  - state_id: evidence
    owner_agent: eval-engineer
    required_inputs:
      - independent-review-verdict
      - validation-results
    mutation_authority: workspace-write
    entry_condition: independent-review-approved
    exit_gate: task-evidence-complete
    max_attempts: 1
    failure_return: independent-review
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: handoff
  - state_id: handoff
    owner_agent: workflow-supervisor
    required_inputs:
      - bounded-evidence
      - next-owner
    mutation_authority: read-only
    entry_condition: evidence-record-sanitized
    exit_gate: next-owner-accepts-handoff
    max_attempts: 1
    failure_return: evidence
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    handoff_target: complete
harness_loops:
  - event_id: approved-all-files-gate
    owner_agent: qa-engineer
    reviewer_agent: code-reviewer
    permission_profile: workspace-write
    allowed_tools:
      - controlled-qa-wrapper
      - read
    workflow_states:
      - validate
      - evidence
    max_attempts: 1
    stop_condition: controlled-wrapper-pass
    on_failure: record_and_stop
    evidence_fields:
      - command
      - result
      - rollback
      - skipped_checks
    prohibited_evidence:
      - auth_files
      - credentials
      - raw_logs
      - secret_values
      - shell_history
      - tokens
    capability_status: supported
    adoption_status: adopted
    runtime_depth: repository-enforced
  - event_id: bounded-implementation-loop
    owner_agent: qa-engineer
    reviewer_agent: code-reviewer
    permission_profile: workspace-write
    allowed_tools:
      - focused-validation
      - read
      - search
      - workspace-edit
    workflow_states:
      - implement
      - validate
    max_attempts: 2
    stop_condition: focused-checks-pass
    on_failure: narrow_then_escalate
    evidence_fields:
      - command
      - result
      - rollback
