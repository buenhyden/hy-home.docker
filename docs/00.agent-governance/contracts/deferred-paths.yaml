checked_at: '2026-08-18T00:00:00+09:00'

# Paths that an active, reviewed unit requires to stay dirty in the working
# tree. The logical-commit Stop gate skips exactly these paths and keeps
# blocking every other uncommitted path.
#
# Each entry must carry a non-empty `path`, a non-empty `reason`, and an
# `owning_task` that resolves to an existing file. The gate fails closed: a
# missing, untracked, unreadable, or malformed registry grants no exemption.
# Registering a path is itself a committed, reviewable act. Remove the entry as
# soon as its owning unit adopts the path.

# Absorbed 2026-08-18 as a mechanism only. The two entries this registry
# carried on its origin branch belonged to a direct-deletion controller design
# that was never adopted, so they are deliberately not imported. An empty
# registry grants no exemption and the Stop gate behaves exactly as it did
# before this contract existed.

deferrals: []
