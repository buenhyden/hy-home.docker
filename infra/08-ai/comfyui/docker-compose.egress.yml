# 이 오버레이는 선언된 base의 common-optimizations.yml 설정을 상속합니다.
x-hyhome-overlay:
  version: 1
  base: infra/08-ai/comfyui/docker-compose.yml

# SPEC-0268: maintenance only. Attaches ComfyUI's outbound network and its
# loopback port for model and custom-node installs; recreate ComfyUI without
# this file when the window ends.
services:
  comfyui:
    networks:
      comfyui_egress_net: {}
    ports:
      - "127.0.0.1:8188:${COMFYUI_PORT:-8188}"
