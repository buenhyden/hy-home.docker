x-tier-label: &tier-label
  hy-home.tier: ai

volumes:
  comfyui-models:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/models
  comfyui-custom-nodes:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/custom_nodes
  comfyui-output:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/output
  comfyui-input:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/input
  comfyui-user:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/user
  comfyui-hf-cache:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/cache/huggingface

  comfyui-torch-cache:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/comfyui/cache/torch

services:
  comfyui:
    profiles:
      - ai
      - ai-image
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     COMFYUI_REF: ${COMFYUI_REF:-v0.36.0}
    #     PUID: ${COMFYUI_UID:-1000}
    #     PGID: ${COMFYUI_GID:-1000}
    # image: hy-home/comfyui:${COMFYUI_IMAGE_TAG:-v0.36.0-cu126}
    image: yanwk/comfyui-boot:cu126-slim
    container_name: comfyui
    hostname: comfyui
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.00"
    gpus: all
    environment:
      TZ: ${DEFAULT_TIMEZONE}
      CLI_ARGS: ${COMFYUI_ARGS:---listen 0.0.0.0 --port ${COMFYUI_PORT:-8188}}
      HF_HOME: /home/comfyui/.cache/huggingface
      TORCH_HOME: /home/comfyui/.cache/torch
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    networks:
      # openclaw_default:
      infra_net:
        ipv4_address: 172.19.0.203
    volumes:
      - comfyui-models:/opt/comfyui/models:rw
      - comfyui-custom-nodes:/opt/comfyui/custom_nodes:rw
      - comfyui-output:/opt/comfyui/output:rw
      - comfyui-input:/opt/comfyui/input:rw
      - comfyui-user:/opt/comfyui/user:rw
      - comfyui-hf-cache:/home/comfyui/.cache/huggingface:rw
      - comfyui-torch-cache:/home/comfyui/.cache/torch:rw
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.comfyui.rule: Host(`comfyui.${DEFAULT_URL}`)
      traefik.http.routers.comfyui.entrypoints: websecure
      traefik.http.routers.comfyui.tls: 'true'
      traefik.http.services.comfyui.loadbalancer.server.port: ${COMFYUI_PORT:-8188}
      traefik.http.routers.comfyui.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
    ports:
      - "127.0.0.1:${COMFYUI_HOST_PORT:-8188}:${COMFYUI_PORT:-8188}"
    shm_size: "2gb"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:${COMFYUI_PORT:-8188}/system_stats >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
