x-tier-label: &tier-label
  hy-home.tier: ai

# Crawl4AI fetches arbitrary URLs, so it is an SSRF-capable service
# (SPEC-0220). It joins internal networks only: consumers reach its API on
# crawl4ai_net, and its only way out is crawl4ai-egress, which resolves names,
# refuses every non-global or IPv6 address and every port but 80/443, and
# dials the address it checked. A consumer joins crawl4ai_net only through a
# reviewed admission change (POL-0091).
networks:
  crawl4ai_net:
    name: crawl4ai_net
    driver: bridge
    internal: true
  crawl4ai_egress_net:
    name: crawl4ai_egress_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.200.0/29
  crawl4ai_outbound_net:
    name: crawl4ai_outbound_net
    driver: bridge

services:
  crawl4ai:
    profiles:
      - crawl4ai
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-high
    image: unclecode/crawl4ai:0.9.4@sha256:9021b3cb5c6f12570bbcd5395638495e0a06969b3148e377b953d174af2ebc9b
    container_name: crawl4ai
    hostname: crawl4ai
    group_add:
      - '${SECRETS_GID:-1000}'
    user: appuser
    # Chromium needs more memory and processes than the high template allows.
    mem_limit: 4g
    pids_limit: 512
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    secrets:
      - crawl4ai_api_token
    # Since 0.9.0 the server binds beyond loopback only with a token, and then
    # requires `Authorization: Bearer` on every endpoint except GET /health.
    command:
      - /bin/bash
      - -ec
      - |
        CRAWL4AI_API_TOKEN="$$(tr -d '\r\n' </run/secrets/crawl4ai_api_token)"
        [ "$${#CRAWL4AI_API_TOKEN}" -ge 16 ] || { echo 'crawl4ai: crawl4ai_api_token must be at least 16 characters' >&2; exit 64; }
        export CRAWL4AI_API_TOKEN
        exec bash entrypoint.sh
    environment:
      # The in-image broker pins and checks each target, then CONNECTs the
      # pinned address through the gateway.
      CRAWL4AI_UPSTREAM_PROXY: http://10.250.200.2:3128
    dns:
      - 10.250.200.2
    depends_on:
      crawl4ai-egress:
        condition: service_healthy
    expose:
      - '11235'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:11235/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crawl4ai_net
      - crawl4ai_egress_net
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  crawl4ai-egress:
    profiles:
      - crawl4ai
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-low
    image: python:3.13.15-alpine
    container_name: crawl4ai-egress
    hostname: crawl4ai-egress
    user: '65534:65534'
    command: ['python', '/app/egress_gateway.py']
    volumes:
      - ./egress_gateway.py:/app/egress_gateway.py:ro
    sysctls:
      # DNS on :53 without a capability.
      net.ipv4.ip_unprivileged_port_start: 53
    healthcheck:
      test: ['CMD', 'python', '-c', 'import socket; socket.create_connection(("127.0.0.1", 3128), 2).close()']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      crawl4ai_egress_net:
        ipv4_address: 10.250.200.2
      crawl4ai_outbound_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'
