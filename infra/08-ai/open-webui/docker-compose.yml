x-tier-label: &tier-label
  hy-home.tier: ai

volumes:
  open-webui:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_AI_MODEL_DIR}/open-webui

services:
  open-webui:
    profiles:
      - ai
      - ai-llm
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    image: ghcr.io/open-webui/open-webui:v0.12.0-cuda@sha256:3a4f953b604bf8b4df9eaa765278f75180911f180cbdf984b2e7b593891e1c25
    container_name: open-webui
    hostname: open-webui
    group_add:
      - '${SECRETS_GID:-1000}'
    mem_limit: 2g
    # Reservation (measured; SPEC-0263-TSK-0002 Measurements).
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 800M
    cpus: "2.00"
    entrypoint:
      - /usr/local/bin/open-webui-oidc-entrypoint.sh
    environment:
      PORT: ${OLLAMA_WEBUI_PORT:-8080}
      OLLAMA_BASE_URL: http://ollama:${OLLAMA_PORT:-11434}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:${QDRANT_PORT:-6333}
      # Read by the entrypoint; Open WebUI itself accepts the key only from the environment.
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      RAG_EMBEDDING_ENGINE: ollama
      # The image leaves WEBUI_SECRET_KEY empty, so start.sh keeps a generated key
      # in this file; in the volume it survives recreation and is backed up.
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      # Installed in Ollama (768 dims); qwen3-embedding:4b left the model set.
      # Open WebUI keeps saved values in webui.db, which override these on restart.
      RAG_EMBEDDING_MODEL: embeddinggemma-2:740m
      # Local Ollama only: no direct OpenAI cloud path without an approved contract.
      ENABLE_OPENAI_API: 'false'
      WEBUI_URL: https://chat.${DEFAULT_URL}
      OAUTH_CLIENT_ID: home-openwebui
      # P06: read by the entrypoint; unset keeps /run/secrets.
      OPENWEBUI_OIDC_CLIENT_SECRET_FILE: ${OPENWEBUI_OIDC_CLIENT_SECRET_FILE:-/run/secrets/openwebui_oidc_client_secret}
      OAUTH_PROVIDER_NAME: Keycloak
      OAUTH_SCOPES: openid profile email
      OPENID_PROVIDER_URL: https://keycloak.${DEFAULT_URL}/realms/hy-home.realm/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://chat.${DEFAULT_URL}/oauth/oidc/callback
      OAUTH_CODE_CHALLENGE_METHOD: S256
      ENABLE_OAUTH_PERSISTENT_CONFIG: 'false'
      ENABLE_OAUTH_SIGNUP: 'false'
      # Existing admin linkage and persisted login-form disablement verified.
      ENABLE_LOGIN_FORM: 'false'
      ENABLE_PASSWORD_AUTH: 'false'
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: 'false'
      ENABLE_OAUTH_ROLE_MANAGEMENT: 'false'
      ENABLE_OAUTH_GROUP_MANAGEMENT: 'false'
      ENABLE_OAUTH_GROUP_CREATION: 'false'
      WEBUI_AUTH_COOKIE_SECURE: 'true'
      ENABLE_OAUTH_ID_TOKEN_COOKIE: 'false'
    volumes:
      - open-webui:/app/backend/data:rw
      - ./docker-entrypoint.sh:/usr/local/bin/open-webui-oidc-entrypoint.sh:ro
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/hy-home-rootCA.pem:ro
      # P06: the OpenBao Agent's open-webui output, read when the client secret file
      # variable points under /run/openbao/open-webui. A missing directory stops it.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/out/open-webui
        target: /run/openbao/open-webui
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - openwebui_oidc_client_secret
      - qdrant_api_key
    networks:
      edge_net: {}
      ai_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.open-webui.rule: Host(`chat.${DEFAULT_URL}`)
      traefik.http.routers.open-webui.entrypoints: websecure
      traefik.http.routers.open-webui.tls: 'true'
      traefik.http.services.open-webui.loadbalancer.server.port: ${OLLAMA_WEBUI_PORT:-8080}
      traefik.http.routers.open-webui.middlewares: gateway-standard-chain@file
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -f "http://localhost:$${PORT}/health" || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
