x-tier-label: &tier-label
  hy-home.tier: ai

# networks:
#   openclaw_default:
#     external: true
#     name: openclaw_default

volumes:
  ollama-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${OLLAMA_MODEL_DIR:-${DEFAULT_AI_MODEL_DIR}/ollama}

services:
  ollama:
    profiles:
      - ai
      - ai-llm
      - ollama
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-ai-high
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    container_name: ollama
    hostname: ollama
    read_only: false
    # GPU discovery allows 30 s per library; reading the 1.3 GB CUDA 12
    # libraries cold from the busy HDD image store took longer, so the server
    # fell back to the CPU (SPEC-0246). Warm them first; the path follows the
    # image's library layout and needs review on an Ollama upgrade. 0.40.12
    # also probes the unwarmed cuda_v13 and vulkan libraries, so
    # OLLAMA_LLM_LIBRARY below limits discovery to the warmed cuda_v12.
    entrypoint:
      - /bin/sh
      - -c
      - cat /usr/lib/ollama/cuda_v12/* > /dev/null; exec /bin/ollama serve
    environment:
      - OLLAMA_HOST=0.0.0.0:${OLLAMA_PORT:-11434} # 컨테이너 인터페이스에서 수신
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-16}
      # Stall limit for a model load. Models load from a busy HDD, where loads
      # took 12-574 s and two stalled past the 5 m default (SPEC-0226).
      - OLLAMA_LOAD_TIMEOUT=15m
      # Keep prompts on this host: no ollama.com cloud models or sign-in.
      - OLLAMA_NO_CLOUD=1
      # GTX 1060 (compute 6.1) runs on CUDA 12; probe only the warmed library.
      - OLLAMA_LLM_LIBRARY=cuda_v12
    volumes:
      - ollama-data:/root/.ollama:rw
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
          pids: 1024
        # cpus is measured (SPEC-0263-TSK-0002 Measurements); the 4G memory
        # reservation is kept as authored for model loading.
        reservations:
          cpus: '0.05'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - 127.0.0.1:${OLLAMA_HOST_PORT}:${OLLAMA_PORT}
      # - ${OPENCLAW_GATEWAY_HOST_PORT}:${OPENCLAW_GATEWAY_PORT}
    labels:
      <<: *tier-label
      traefik.docker.network: ollama_ingress_net
      traefik.enable: 'true'
      traefik.http.routers.ollama.rule: Host(`ollama.${DEFAULT_URL}`)
      traefik.http.routers.ollama.entrypoints: websecure
      traefik.http.routers.ollama.tls: 'true'
      traefik.http.services.ollama.loadbalancer.server.port: ${OLLAMA_PORT:-11434}
      traefik.http.routers.ollama.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
    networks:
      ollama_ingress_net: {}
      ai_net: {}
      # openclaw_default:
    healthcheck:
      test: [ 'CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-exporter:
    profiles:
      - ai
      - ai-llm
      - ollama
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-low
    image: lucabecker42/ollama-exporter:1.0.3@sha256:9fb1f4c5bc4ff819eb13e148debeb7fd474a4c8956d83d39928ea22d95d3de5c
    container_name: ollama-exporter
    hostname: ollama-exporter
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - OLLAMA_HOST=ollama:${OLLAMA_PORT:-11434}
    expose:
      - '${OLLAMA_EXPORTER_PORT:-8000}'
    networks:
      ai_net: {}
      obs_net: {}
    labels:
      <<: *tier-label
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q -O- http://localhost:${OLLAMA_EXPORTER_PORT:-8000}/metrics >/dev/null 2>&1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
