x-tier-label: &tier-label
  hy-home.tier: quality

x-wiremock: &wiremock
  extends:
    file: ../../common-optimizations.yml
    service: template-infra-readonly-med
  image: wiremock/wiremock:3.13.2-alpine
  user: '1000:1000'
  volumes:
    - ./mappings:/home/wiremock/mappings:ro
    - ./__files:/home/wiremock/__files:ro
  healthcheck:
    test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/__admin/health || exit 1']
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  labels:
    <<: *tier-label
    traefik.enable: 'false'

services:
  wiremock:
    container_name: wiremock
    hostname: wiremock
    <<: *wiremock
    # Function mode keeps a bounded journal for assertions. Reset it through
    # DELETE /__admin/requests before each approved run.
    profiles:
      - api-mock
    ports:
      - '127.0.0.1:${WIREMOCK_HOST_PORT:-18088}:8080'
    command:
      - --disable-banner
      - --max-request-journal-entries
      - '1000'
