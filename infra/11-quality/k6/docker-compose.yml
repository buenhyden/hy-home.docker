x-tier-label: &tier-label
  hy-home.tier: quality


volumes:
  k6-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_TOOLING_DIR}/k6
services:
  k6:
    # This inventory job reports the pinned k6 version and sends no traffic.
    # The isolated executor owns any future approved synthetic run.
    profiles:
      - testing
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    build: .
    # Keep this one-shot inventory command from being replayed.
    restart: 'no'
    read_only: true
    labels:
      <<: *tier-label
    volumes:
      - k6-data:/scripts:ro
    networks:
      obs_net: {}
    # The root profile is inventory/render only. Approved traffic must use
    # quality_run.py, which verifies the dedicated internal network and limits.
    command:
      - version
