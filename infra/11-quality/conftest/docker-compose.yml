x-tier-label: &tier-label
  hy-home.tier: quality

services:
  # Policy tests over the infrastructure source (POL-0095). It reads infra/
  # and the LAB entrypoints in labs/ only, never secrets/ or .env, and has no
  # network.
  conftest:
    profiles:
      - policy-check
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    image: openpolicyagent/conftest:v0.71.1@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0
    container_name: conftest
    hostname: conftest
    user: '1000:1000'
    network_mode: none
    entrypoint:
      - /bin/sh
      - /project/infra/11-quality/conftest/run.sh
    volumes:
      - ../..:/project/infra:ro
      - ../../../labs:/project/labs:ro
    labels:
      <<: *tier-label
