# 이 오버레이는 선언된 base의 common-optimizations.yml 설정을 상속합니다.
x-hyhome-overlay:
  version: 1
  base: infra/02-auth/oauth2-proxy/docker-compose.yml

# Explicit leaf overlay; application/default authority stays unchanged.
services:
  oauth2-proxy-valkey:
    secrets:
      - oauth2_valkey_monitor_password
    command:
      - /bin/sh
      - /usr/local/lib/hy-home/valkey/start-dedicated.sh
      - /run/secrets/oauth2_valkey_password
      - /run/valkey/users.acl
      - /run/secrets/oauth2_valkey_monitor_password
  oauth2-proxy-valkey-exporter:
    secrets: !override
      - oauth2_valkey_monitor_password
    environment:
      VALKEY_PORT: '${VALKEY_PORT:-6379}'
    command:
      - |
        set -eu
        port=$${VALKEY_PORT}
        case "$$port" in ''|*[!0-9]*) exit 1 ;; esac
        [ "$${#port}" -le 5 ] && [ "$$port" -ge 1 ] && [ "$$port" -le 65535 ] || exit 1
        REDIS_PASSWORD=$$(cat /run/secrets/oauth2_valkey_monitor_password)
        [ -n "$$REDIS_PASSWORD" ] || exit 1
        export REDIS_PASSWORD
        exec /redis_exporter \
          -redis.addr="redis://oauth2-proxy-valkey:$$port" \
          -redis.user=monitor \
          -config-command=- \
          -set-client-name=false \
          -exclude-latency-histogram-metrics \
          -disable-scrape-endpoint \
          -web.listen-address=:${VALKEY_EXPORTER_PORT:-9121}
