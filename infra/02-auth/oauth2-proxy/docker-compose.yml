x-tier-label: &tier-label
  hy-home.tier: auth

services:
  oauth2-proxy:
    profiles:
      - core
      - auth
      - dev
      - local
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-med
    build:
      context: .
      dockerfile: ${OAUTH2_PROXY_DOCKERFILE:-dev.Dockerfile}
    container_name: oauth2-proxy
    hostname: oauth2-proxy
    group_add:
      - '${CERT_GROUP_GID:-1000}'
      - '${SECRETS_GID:-1000}'
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/rootCA.pem
      - OAUTH2_PROXY_SESSION_STORE_TYPE=redis
      - OAUTH2_PROXY_REDIS_CONNECTION_URL=redis://${OAUTH2_PROXY_VALKEY_HOST:-mng-valkey}:${VALKEY_PORT:-6379}
      - OAUTH2_PROXY_PORT=${OAUTH2_PROXY_PORT:-4180}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:${OAUTH2_PROXY_PORT:-4180}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      # P06: overrides client_secret_file in oauth2-proxy.cfg; unset rolls back.
      - OAUTH2_PROXY_CLIENT_SECRET_FILE=${OAUTH2_PROXY_CLIENT_SECRET_FILE:-/run/secrets/oauth2_proxy_client_secret}
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://keycloak.${DEFAULT_URL}/realms/hy-home.realm
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.${DEFAULT_URL}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_DOMAINS=.${DEFAULT_URL}
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${DEFAULT_URL}
      # Prometheus metrics for job oauth2-proxy (SPEC-0193); not routed.
      - OAUTH2_PROXY_METRICS_ADDRESS=10.250.43.2:44180
    volumes:
      - ./config/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/rootCA.pem:ro
      # P06: the OpenBao Agent's oauth2-proxy output, read when the client secret file
      # variable points under /run/openbao/oauth2-proxy. A missing directory stops it.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/out/oauth2-proxy
        target: /run/openbao/oauth2-proxy
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - mng_valkey_password
      - oauth2_proxy_client_secret
      - oauth2_proxy_cookie_secret
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.oauth2-proxy.rule: Host(`auth.${DEFAULT_URL}`) && PathPrefix(`/oauth2`)
      traefik.docker.network: edge_net
      traefik.http.routers.oauth2-proxy.entrypoints: websecure
      traefik.http.routers.oauth2-proxy.service: oauth2-proxy-svc
      traefik.http.routers.oauth2-proxy.tls: 'true'
      traefik.http.routers.oauth2-proxy.middlewares: gateway-standard-chain@file
      traefik.http.services.oauth2-proxy-svc.loadbalancer.server.port: ${OAUTH2_PROXY_PORT:-4180}
    networks:
      edge_net: {}
      obs_net: {}
      mng_data_net: {}
      # The metrics listener binds here only (SPEC-0267).
      oauth2_proxy_metrics_net:
        ipv4_address: 10.250.43.2
        aliases:
          - oauth2-proxy-metrics
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- "http://127.0.0.1:$${OAUTH2_PROXY_PORT}/ping" >/dev/null 2>&1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
