x-tier-label: &tier-label
  hy-home.tier: messaging

volumes:
  kafka-1-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_MESSAGE_BROKER_DIR}/kafka/dev-data

services:
  kafka-1:
    image: confluentinc/cp-kafka:8.3.2
    profiles:
      - messaging
      - messaging-broker
      - messaging-admin
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    read_only: false
    restart: unless-stopped
    container_name: kafka-1
    hostname: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data:rw
      - ./jmx-exporter:/usr/share/jmx_exporter:ro
    ports:
      - '127.0.0.1:${KAFKA_EXTERNAL_1_HOST_PORT:-9092}:${KAFKA_EXTERNAL_PORT:-9092}'
      - '127.0.0.1:${KAFKA_JMX_EXPORTER_1_HOST_PORT:-19404}:${KAFKA_JMX_EXPORTER_PORT:-9404}'
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 자동 토픽 생성 방지 (권장: kafka-init에서 통제)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:${KAFKA_CONTROLLER_PORT:-9093}'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT:-19092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-9092}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_HEAP_OPTS: '${KAFKA_HEAP_OPTS:--Xms512M -Xmx512M}'
      # No JMX remote: the unauthenticated RMI port had no consumer; the
      # jmx_exporter agent below serves the metrics.
      KAFKA_OPTS: >-
        -javaagent:/usr/share/jmx_exporter/jmx_prometheus_javaagent-1.5.0.jar=${KAFKA_JMX_EXPORTER_PORT:-9404}:/usr/share/jmx_exporter/kafka_broker.yml
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:${KAFKA_INTERNAL_PORT:-19092},EXTERNAL://${KAFKA_EXTERNAL_HOSTNAME:-localhost}:${KAFKA_EXTERNAL_1_HOST_PORT:-9092}'
    healthcheck:
      # Each run starts a JVM (about 2.5 CPU-seconds), so check once a minute
      # and every 5 s only while starting.
      test: [ 'CMD-SHELL', 'unset KAFKA_OPTS; kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_INTERNAL_PORT:-19092} >/dev/null || exit 1' ]
      interval: 60s
      start_interval: 5s
      timeout: 30s
      retries: 10
      start_period: 45s
    networks:
      kafka_net: {}
      obs_net: {}
    labels:
      <<: *tier-label

  kafbat-ui:
    profiles:
      - messaging
      - messaging-admin
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui
    hostname: kafbat-ui
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: true
    tmpfs:
      - /tmp
      - /etc/kafkaui:uid=100,gid=101,mode=0775
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_ID}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: '${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092}'
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFBAT_OAUTH_CLIENT_ID: ${KAFBAT_OAUTH_CLIENT_ID}
      # P06: the OIDC client secret file; unset keeps /run/secrets.
      KAFBAT_CLIENT_SECRET_FILE: ${KAFBAT_CLIENT_SECRET_FILE:-/run/secrets/kafbat_client_secret}
    volumes:
      - ./kafbat-ui/dynamic_config.template.yaml:/tmp/dynamic_config.template.yaml:ro
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/hy-home-rootCA.pem:ro
      # P06: the OpenBao Agent's kafbat output, read when the client secret file
      # variable points under /run/openbao/kafbat. A missing directory stops it.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/out/kafbat
        target: /run/openbao/kafbat
        read_only: true
        bind: {create_host_path: false}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        JAVA_HOME_DIR="$$(dirname "$$(dirname "$$(readlink -f "$$(command -v java)")")")"
        DEFAULT_CACERTS="$${JAVA_HOME_DIR}/lib/security/cacerts"
        CUSTOM_CACERTS="/tmp/hy-home-cacerts"

        echo "Java home: $${JAVA_HOME_DIR}"
        echo "Default truststore: $${DEFAULT_CACERTS}"

        test -r "$${DEFAULT_CACERTS}"
        test -r /etc/ssl/certs/hy-home-rootCA.pem

        cp "$${DEFAULT_CACERTS}" "$${CUSTOM_CACERTS}"
        chmod u+w "$${CUSTOM_CACERTS}"

        keytool -importcert \
          -noprompt \
          -trustcacerts \
          -alias hy-home-mkcert-root \
          -file /etc/ssl/certs/hy-home-rootCA.pem \
          -keystore "$${CUSTOM_CACERTS}" \
          -storepass changeit

        echo "Verifying local CA..."
        keytool -list \
          -keystore "$${CUSTOM_CACERTS}" \
          -storepass changeit \
          -alias hy-home-mkcert-root

        cat /tmp/dynamic_config.template.yaml \
          > /etc/kafkaui/dynamic_config.yaml

        sed -i \
          "s|PLACEHOLDER_CLIENT_ID|$${KAFBAT_OAUTH_CLIENT_ID}|g" \
          /etc/kafkaui/dynamic_config.yaml

        sed -i \
          "s|PLACEHOLDER_CLIENT_SECRET|$$(tr -d '\r\n' <"$${KAFBAT_CLIENT_SECRET_FILE}")|g" \
          /etc/kafkaui/dynamic_config.yaml

        exec java \
          -Djavax.net.ssl.trustStore="$${CUSTOM_CACERTS}" \
          -Djavax.net.ssl.trustStorePassword=changeit \
          --add-opens java.rmi/javax.rmi.ssl=ALL-UNNAMED \
          $${JAVA_OPTS:-} \
          -jar /api.jar
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.kafka-ui.rule: Host(`kafbat-ui.${DEFAULT_URL}`)
      traefik.http.routers.kafka-ui.entrypoints: websecure
      traefik.http.routers.kafka-ui.tls: 'true'
      traefik.http.services.kafka-ui.loadbalancer.server.port: ${KAFKA_UI_PORT:-8080}
      traefik.http.routers.kafka-ui.middlewares: gateway-standard-chain@file
    depends_on:
      kafka-1:
        condition: service_healthy
    secrets:
      - kafbat_client_secret
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:${KAFKA_UI_PORT:-8080}/actuator/health' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    networks:
      edge_net: {}
      kafka_net: {}

  kafka-exporter:
    profiles:
      - messaging
      - messaging-broker
      - messaging-admin
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-low
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --kafka.server=kafka-1:19092
      - --web.listen-address=:${KAFKA_EXPORTER_PORT:-9308}
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:${KAFKA_EXPORTER_PORT:-9308}/metrics || exit 1' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    networks:
      kafka_net: {}
      obs_net: {}

  kafka-init:
    profiles:
      - messaging
      - messaging-broker
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    restart: 'no'
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka-init
    hostname: kafka-init
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      kafka-1:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-ec' ]
    command:
      - |
        echo "Creating internal topics..."
        kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic infra-events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic application-logs --partitions 6 --replication-factor 1
        echo "Kafka initialization complete."
    labels:
      <<: *tier-label
    networks:
      kafka_net: {}
