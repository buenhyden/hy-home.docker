x-tier-label: &tier-label
  hy-home.tier: platform-ops

services:
  opentofu:
    profiles:
      - iac
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/opentofu/opentofu:1.13.1-minimal@sha256:dfbc3f0a8bed0adfa2cf49ff418f158afe24080eea6d6e748db8799fc4553db6 AS tofu
        FROM alpine:3.24
        RUN apk add --no-cache \
            bash \
            ca-certificates \
            curl \
            git \
            openssh-client
        COPY --from=tofu /usr/local/bin/tofu /usr/local/bin/tofu
        ENTRYPOINT ["tofu"]
    image: hy-home/opentofu:1.13.1-local
    pull_policy: build
    container_name: opentofu
    hostname: opentofu
    restart: 'no'
    read_only: false
    tmpfs:
      - /tmp
    volumes:
      - ./workspace:/workspace:rw
      - $HOME/.aws:/root/.aws:ro
      - $HOME/.azure:/root/.azure:ro
    working_dir: /workspace
    entrypoint: ['tofu']
    labels:
      <<: *tier-label
