x-tier-label: &tier-label
  hy-home.tier: platform-ops


services:
  terrakube-api:
    profiles:
      - iac
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    image: azbuilder/api-server:2.33.3@sha256:af7df0a72dda42bd5dbfead352f401b32fd6d1f46024b6b6e00c965bd764b4e8
    container_name: terrakube-api
    hostname: terrakube-api
    group_add:
      - '${SECRETS_GID:-1000}'
    secrets:
      - terrakube_db_password
      - seaweedfs_s3_terrakube_secret_key
      - terrakube_valkey_password
      - terrakube_pat_secret
      - terrakube_internal_secret
    environment:
      ApiDataSourceType: POSTGRESQL
      DatasourceHostname: ${POSTGRES_MNG_HOSTNAME}
      # Terrakube 2.33.2 application.properties maps this supported property
      # to io.terrakube.api.plugin.datasource.databasePort.
      DatasourcePort: ${POSTGRES_PORT:-5432}
      DatasourceDatabase: terrakube
      DatasourceUser: ${TERRAKUBE_DB_USERNAME}
      DatasourcePassword_FILE: /run/secrets/terrakube_db_password
      GroupValidationType: 'DEX'
      UserValidationType: 'DEX'
      AuthenticationValidationType: 'DEX'
      TerrakubeHostname: terrakube-api.${DEFAULT_URL}
      AzBuilderExecutorUrl: http://terrakube-executor:8090/api/v1/terraform-rs
      PatSecret_FILE: /run/secrets/terrakube_pat_secret
      InternalSecret_FILE: /run/secrets/terrakube_internal_secret
      DexClientId: ${OAUTH2_PROXY_CLIENT_ID}
      StorageType: AWS
      AwsStorageAccessKey: terrakube
      AwsStorageSecretKey_FILE: /run/secrets/seaweedfs_s3_terrakube_secret_key
      AwsStorageBucketName: tfstate
      AwsStorageRegion: us-east-1
      AwsEndpoint: http://seaweedfs-s3:8333
      TerrakubeUiURL: https://terrakube-ui.${DEFAULT_URL}
      DexIssuerUri: 'https://keycloak.${DEFAULT_URL}/realms/hy-home.realm'
      TerrakubeRedisHostname: ${VALKEY_MNG_HOSTNAME}
      TerrakubeRedisPassword_FILE: /run/secrets/terrakube_valkey_password
      TerrakubeRedisPort: ${VALKEY_PORT:-6379}
    # tfstate comes from seaweedfs-buckets; run Terrakube with --profile storage.
    depends_on:
      seaweedfs-buckets:
        condition: service_completed_successfully
        required: false
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.terrakube-api.rule: Host(`terrakube-api.${DEFAULT_URL}`)
      traefik.http.routers.terrakube-api.entrypoints: websecure
      traefik.http.routers.terrakube-api.tls: 'true'
      # ForwardAuth needs the SSO cookie, so Terraform CLI, API-token calls and
      # terrakube-executor (it calls the API by its public URL) cannot pass. At `iac` activation (owner decision 2026-09-24): dedicated
      # public client home-terrakube, drop this ForwardAuth, verify audience/RBAC.
      traefik.http.routers.terrakube-api.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.terrakube-api.loadbalancer.server.port: 8080
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/actuator/health || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 1m
    networks:
      edge_net: {}
      terrakube_net: {}
      mng_data_net: {}
      object_net: {}

  terrakube-ui:
    profiles:
      - iac
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    image: azbuilder/terrakube-ui:2.33.3@sha256:77302b2f8488ab1990519e0dc7d8e8231081d28b7a77ab81f585c928943bd82d
    container_name: terrakube-ui
    hostname: terrakube-ui
    environment:
      REACT_APP_TERRAKUBE_API_URL: https://terrakube-api.${DEFAULT_URL}/api/v1/
      REACT_APP_AUTHORITY: https://keycloak.${DEFAULT_URL}/realms/hy-home.realm
      REACT_APP_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      REACT_APP_REDIRECT_URI: https://terrakube-ui.${DEFAULT_URL}
      REACT_APP_SCOPE: openid profile email offline_access groups
      JAVA_TOOL_OPTIONS: -Dcom.sun.security.enableAIAcaIssuers=true
    labels:
      <<: *tier-label
      traefik.docker.network: terrakube_ui_ingress_net
      traefik.enable: 'true'
      traefik.http.routers.terrakube-ui.rule: Host(`terrakube-ui.${DEFAULT_URL}`)
      traefik.http.routers.terrakube-ui.entrypoints: websecure
      traefik.http.routers.terrakube-ui.tls: 'true'
      traefik.http.routers.terrakube-ui.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.terrakube-ui.loadbalancer.server.port: ${TERRAKUBE_UI_PORT:-3000}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:${TERRAKUBE_UI_PORT:-3000} || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 15s
    depends_on:
      terrakube-api:
        condition: service_healthy
    networks:
      terrakube_ui_ingress_net: {}
      terrakube_net: {}

  terrakube-executor:
    profiles:
      - iac
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-high
    image: azbuilder/executor:2.33.3@sha256:bb1721889d94fcdda2bf93afaf9e517ab97a11fca08fcd73172257b4212a8be8
    container_name: terrakube-executor
    hostname: terrakube-executor
    group_add:
      - '${SECRETS_GID:-1000}'
    secrets:
      - terrakube_internal_secret
      - seaweedfs_s3_terrakube_secret_key
      - terrakube_valkey_password
    environment:
      TerrakubeEnableSecurity: 'true'
      InternalSecret_FILE: /run/secrets/terrakube_internal_secret
      TerraformStateType: AwsTerraformStateImpl
      AwsTerraformStateAccessKey: terrakube
      AwsTerraformStateSecretKey_FILE: /run/secrets/seaweedfs_s3_terrakube_secret_key
      AwsTerraformStateBucketName: tfstate
      AwsTerraformStateRegion: us-east-1
      AwsEndpoint: http://seaweedfs-s3:8333
      TerraformOutputType: AwsTerraformOutputImpl
      AwsTerraformOutputAccessKey: terrakube
      AwsTerraformOutputSecretKey_FILE: /run/secrets/seaweedfs_s3_terrakube_secret_key
      AwsTerraformOutputBucketName: tfstate
      AwsTerraformOutputRegion: us-east-1
      AzBuilderApiUrl: https://terrakube-api.${DEFAULT_URL}
      ExecutorFlagBatch: 'false'
      ExecutorFlagDisableAcknowledge: 'false'
      TerrakubeToolsRepository: https://github.com/terrakube-io/terrakube-extensions.git
      TerrakubeToolsBranch: main
      TerrakubeRegistryDomain: terrakube-api.${DEFAULT_URL}
      TerrakubeApiUrl: https://terrakube-api.${DEFAULT_URL}
      CustomTerraformReleasesUrl: 'https://releases.hashicorp.com/terraform/index.json'
      TERRAKUBE_API_URL: https://terrakube-api.${DEFAULT_URL}
      EXECUTOR_NAME: local-executor
      TerrakubeRedisHostname: ${VALKEY_MNG_HOSTNAME}
      TerrakubeRedisPassword_FILE: /run/secrets/terrakube_valkey_password
      TerrakubeRedisPort: ${VALKEY_PORT:-6379}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8090/actuator/health || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 1m
    depends_on:
      terrakube-api:
        condition: service_healthy
      seaweedfs-buckets:
        condition: service_completed_successfully
        required: false
    networks:
      edge_net: {}
      terrakube_net: {}
      mng_data_net: {}
      object_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.terrakube-executor.rule: Host(`terrakube-executor.${DEFAULT_URL}`)
      traefik.http.routers.terrakube-executor.entrypoints: websecure
      traefik.http.routers.terrakube-executor.tls: 'true'
      traefik.http.routers.terrakube-executor.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.terrakube-executor.loadbalancer.server.port: ${TERRAKUBE_EXECUTOR_PORT:-8090}
