x-tier-label: &tier-label
  hy-home.tier: platform-ops

volumes:
  renovate-cache:

services:
  renovate:
    profiles:
      - dependency-update

    extends:
      file: ../../common-optimizations.yml
      service: template-job-med

    image: renovate/renovate:44.224.2-full@sha256:fae94f9c837d671221a4bbf046373a511149ec28187e808c051028d064cf27c4
    container_name: renovate
    hostname: renovate

    group_add:
      - '${SECRETS_GID:-1000}'
    restart: 'no'
    read_only: false

    cpus: '1.00'
    mem_limit: 2g
    # Reservation (not running when measured: equals the limit; SPEC-0263-TSK-0002 Measurements).
    deploy:
      resources:
        reservations:
          cpus: "1.00"
          memory: 2048M

    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_CONFIG_FILE: /usr/src/app/config.js
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
      RENOVATE_BASE_DIR: /tmp/renovate
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
      LOG_LEVEL: info

    volumes:
      - ./config/config.js:/usr/src/app/config.js:ro
      - renovate-cache:/tmp/renovate:rw

    # Docker Secret 기간의 bootstrap 형태.
    # Vault/OpenBao 이전 후 같은 파일 path를 Agent가 공급하게 만들면 됨.
    secrets:
      - renovate_token
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -eu
        if ! test -s /run/secrets/renovate_token; then
          echo "ERROR: /run/secrets/renovate_token is missing or empty" >&2
          exit 1
        fi

        RENOVATE_TOKEN="$$(cat /run/secrets/renovate_token)"
        export RENOVATE_TOKEN

        if ! test -w /tmp/renovate; then
          echo "ERROR: /tmp/renovate is not writable" >&2
          id >&2
          ls -ld /tmp/renovate >&2
          exit 1
        fi

        exec renovate
    labels:
      <<: *tier-label
