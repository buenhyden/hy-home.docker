x-tier-label: &tier-label
  hy-home.tier: data

volumes:
  opensearch-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/opensearch/opensearch1-data
  opensearch-dashboards-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/opensearch/opensearch-dashboards-data
  opensearch-data1:
  opensearch-data2:
  opensearch-data3:

services:
  opensearch:
    profiles:
      - 'data'
    extends:
      file: ../../../common-optimizations.yml
      service: template-infra-high
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensearch
    environment:
      OPENSEARCH_JAVA_OPTS: '${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}'
      bootstrap.memory_lock: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    entrypoint:
      - /usr/local/bin/opensearch-entrypoint.sh
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: '1g'
    secrets:
      - opensearch_admin_password
      - opensearch_dashboard_password
      - opensearch_exporter_password
      - opensearch_security_cookie
    volumes:
      - opensearch-data:/usr/share/opensearch/data:rw
      - ../../../../secrets/certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/config/opensearch-security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
      - ./opensearch/config/opensearch-security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/config/opensearch-security/internal_users.template.yml:/usr/share/opensearch/config/opensearch-security/internal_users.template.yml:ro
      - ./opensearch/config/opensearch-security/action_groups.yml:/usr/share/opensearch/config/opensearch-security/action_groups.yml:ro
      - ./opensearch/config/opensearch-security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./opensearch/config/opensearch-security/tenants.yml:/usr/share/opensearch/config/opensearch-security/tenants.yml:ro
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/config/userdict_ko.txt:/usr/share/opensearch/config/userdict_ko.txt:ro
    networks:
      infra_net:
        ipv4_address: 172.19.0.70
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "AUTH=\"admin:$$(tr -d '\\r\\n' < /run/secrets/opensearch_admin_password)\"; curl -fsSk -u \"$$AUTH\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.opensearch.rule: Host(`opensearch.${DEFAULT_URL}`)
      traefik.http.routers.opensearch.entrypoints: websecure
      traefik.http.routers.opensearch.tls: 'true'
      traefik.http.routers.opensearch.middlewares: opensearch-auth@file,gateway-standard-chain@file
      traefik.http.services.opensearch.loadbalancer.serversTransport: opensearch-transport@file
      traefik.http.services.opensearch.loadbalancer.server.port: 9200
      traefik.http.services.opensearch.loadbalancer.server.scheme: https

  opensearch-dashboards:
    profiles:
      - 'data'
      - data-cluster
    extends:
      file: ../../../common-optimizations.yml
      service: template-infra-med
    image: opensearchproject/opensearch-dashboards:3.7.0
    networks:
      infra_net:
        ipv4_address: 172.19.0.71
    expose:
      - '${KIBANA_PORT:-5601}'
    volumes:
      - ../../../../secrets/certs:/usr/share/opensearch-dashboards/config/certs:ro
      - ./opensearch-dashboards/config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
    environment:
      - OPENSEARCH_USERNAME=${OPENSEARCH_DASHBOARD_USERNAME:-kibanaserver}
      - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS:-["https://opensearch:9200"]}
    command:
      - bash
      - -c
      - |
        export OPENSEARCH_PASSWORD="$(cat /run/secrets/opensearch_dashboard_password)"
        export OPENSEARCH_SECURITY_COOKIE="$(tr -d '\r\n' < /run/secrets/opensearch_security_cookie)"
        export OPENSEARCH_CLIENT_SECRET="$(tr -d '\r\n' < /run/secrets/oauth2_proxy_client_secret)"

        exec /usr/share/opensearch-dashboards/bin/opensearch-dashboards
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.opensearch-dashboards.rule: Host(`opensearch-dashboard.${DEFAULT_URL}`)
      traefik.http.routers.opensearch-dashboards.entrypoints: websecure
      traefik.http.routers.opensearch-dashboards.tls: 'true'
      traefik.http.services.opensearch-dashboards.loadbalancer.server.port: ${KIBANA_PORT:-5601}
      traefik.http.services.opensearch-dashboards.loadbalancer.server.scheme: https
      traefik.http.routers.opensearch-dashboards.middlewares: gateway-standard-chain@file
      traefik.http.services.opensearch-dashboards.loadbalancer.serversTransport: opensearch-dashboards-transport@file
    depends_on:
      opensearch: { condition: service_healthy, required: false }
      opensearch-node1: { condition: service_healthy, required: false }
      opensearch-node2: { condition: service_healthy, required: false }
      opensearch-node3: { condition: service_healthy, required: false }
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - |
          code=$$(curl -ks -o /dev/null -w "%{http_code}" https://localhost:${KIBANA_PORT:-5601}/api/status); \
          [ "$$code" = "200" ] || [ "$$code" = "401" ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 60s
    secrets:
      - oauth2_proxy_client_secret
      - opensearch_dashboard_password
      - opensearch_security_cookie

  opensearch-node1:
    profiles:
      - data-cluster
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-db-high
    build:
      context: . ## build Docker file location
      dockerfile: Dockerfile ## build file name
    container_name: opensearch-node1
    # 비밀번호, 클러스터 이름, JVM 옵션 등은 env 파일에서 주입
    environment:
      # 노드/클러스터 기본 설정
      - node.name=opensearch-node1
      - cluster.name=${OPENSEARCH_CLUSTER_NAME}
      # 클러스터 디스커버리 설정 (3노드 모두 동일하게 설정)
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      # JVM Heap 설정 (env에서 값 가져옴)
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # 메모리 관련 bootstrap 체크 통과용
      - bootstrap.memory_lock=true
      # 노드 역할: 클러스터 매니저 + 데이터 + 인제스트 + 원격 클러스터 클라이언트
      - node.roles=cluster_manager,data,ingest,remote_cluster_client
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=/usr/share/opensearch/config/certs/cert.pem
      - plugins.security.ssl.http.pemkey_filepath=/usr/share/opensearch/config/certs/key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/opensearch/config/certs/rootCA.pem
    command: >
      bash -c "
      export OPENSEARCH_INITIAL_ADMIN_PASSWORD=$$(cat /run/secrets/opensearch_admin_password) &&
      exec /usr/share/opensearch/opensearch-docker-entrypoint.sh
      "
    ulimits:
      # 스왑 방지를 위해 memlock 무제한
      memlock:
        soft: -1
        hard: -1
      # OpenSearch 권장 파일 디스크립터 수
      nofile:
        soft: 65536
        hard: 65536
    # Performance Analyzer가 /dev/shm 를 많이 쓰므로 크기를 넉넉히
    shm_size: 1g
    volumes:
      # 데이터 영속화 볼륨
      - opensearch-data1:/usr/share/opensearch/data
      - ../../../../secrets/certs:/usr/share/opensearch/config/certs:ro
      - ./config/userdict_ko.txt:/usr/share/opensearch/config/userdict_ko.txt:ro
    secrets:
      - opensearch_admin_password
    ports:
      # REST API (TLS on 기본) – Loki/Alloy에서 로그/메트릭 수집, 앱 연결
      # - "${ES_HOST_PORT}:${ES_PORT}"
      # Performance Analyzer / 메트릭 포트
      - '${ES_PERFORMANCE_ANALYZER_HOST_PORT:-9600}:${ES_PERFORMANCE_ANALYZER_PORT:-9600}'
    labels:
      - 'traefik.enable=true'
      # 1. OpenSearch API 라우터 (https://opensearch.${DEFAULT_URL})
      - 'traefik.http.routers.opensearch.rule=Host(`opensearch.${DEFAULT_URL}`)'
      - 'traefik.http.routers.opensearch.entrypoints=websecure'
      - 'traefik.http.routers.opensearch.tls=true'
      - 'traefik.http.services.opensearch.loadbalancer.serversTransport=opensearch-transport@file'

      # [중요] OpenSearch는 기본적으로 HTTPS(Self-signed)를 사용하므로
      # Traefik이 백엔드(OpenSearch)와 통신할 때도 HTTPS를 써야 함.
      # serversTransport 설정을 통해 인증서 검증을 스킵해야 할 수 있음.
      - 'traefik.http.services.opensearch.loadbalancer.server.port=9200'
      - 'traefik.http.services.opensearch.loadbalancer.server.scheme=https' # 백엔드 통신 스킴 지정
    networks:
      - infra_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "AUTH=\"admin:$$(tr -d '\\r\\n' < /run/secrets/opensearch_admin_password)\"; curl -fsSk -u \"$$AUTH\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # memlock 사용을 위해 IPC_LOCK만 허용
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK

  # #######################################################
  # # OpenSearch 노드 2
  # #######################################################
  opensearch-node2:
    profiles:
      - data-cluster
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-db-high
    # image: opensearchproject/opensearch:3.4.0  # 2025-11 기준 최신 3.x 안정 버전
    build:
      context: . ## build Docker file location
      dockerfile: Dockerfile ## build file name
    container_name: opensearch-node2
    environment:
      - node.name=opensearch-node2
      - cluster.name=${OPENSEARCH_CLUSTER_NAME}
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - bootstrap.memory_lock=true
      - node.roles=cluster_manager,data,ingest,remote_cluster_client
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    command: >
      bash -c "
      export OPENSEARCH_INITIAL_ADMIN_PASSWORD=$$(cat /run/secrets/opensearch_admin_password) &&
      exec /usr/share/opensearch/opensearch-docker-entrypoint.sh
      "
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: 1g
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
      - ./config/userdict_ko.txt:/usr/share/opensearch/config/userdict_ko.txt:ro
    secrets:
      - opensearch_admin_password
    expose:
      - '9200'
      - '9600'
    networks:
      - infra_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "AUTH=\"admin:$$(tr -d '\\r\\n' < /run/secrets/opensearch_admin_password)\"; curl -fsSk -u \"$$AUTH\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # memlock 사용을 위해 IPC_LOCK만 허용
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK

  # #######################################################
  # # OpenSearch 노드 3
  # #######################################################
  opensearch-node3:
    profiles:
      - data-cluster
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-db-high
    # image: opensearchproject/opensearch:3.4.0  # 2025-11 기준 최신 3.x 안정 버전
    build:
      context: . ## build Docker file location
      dockerfile: Dockerfile ## build file name
    container_name: opensearch-node3
    environment:
      - node.name=opensearch-node3
      - cluster.name=${OPENSEARCH_CLUSTER_NAME}
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - bootstrap.memory_lock=true
      - node.roles=cluster_manager,data,ingest,remote_cluster_client
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    command: >
      bash -c "
      export OPENSEARCH_INITIAL_ADMIN_PASSWORD=$$(cat /run/secrets/opensearch_admin_password) &&
      exec /usr/share/opensearch/opensearch-docker-entrypoint.sh
      "
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: 1g
    volumes:
      - opensearch-data3:/usr/share/opensearch/data
      - ./config/userdict_ko.txt:/usr/share/opensearch/config/userdict_ko.txt:ro
    secrets:
      - opensearch_admin_password
    expose:
      - '9200'
      - '9600'
    networks:
      - infra_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "AUTH=\"admin:$$(tr -d '\\r\\n' < /run/secrets/opensearch_admin_password)\"; curl -fsSk -u \"$$AUTH\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # memlock 사용을 위해 IPC_LOCK만 허용
    cap_drop:
