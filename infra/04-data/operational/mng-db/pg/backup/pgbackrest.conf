# pgBackRest configuration for the management PostgreSQL server (stanza "mng").
# The repository cipher passphrase is not here: the entrypoint writes it from
# the pgbackrest_cipher_pass Docker secret into the include path at start.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-diff=6
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
spool-path=/var/spool/pgbackrest
# When archiving keeps failing, drop WAL past this size instead of filling the
# data disk; the dropped range is a point-in-time recovery gap (RUN-0021).
archive-push-queue-max=4GiB

[mng]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql
