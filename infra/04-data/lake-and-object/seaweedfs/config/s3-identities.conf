# S3 identities besides admin (POL-0024). One consumer per line:
#   <name> <Docker secret holding its secret key, or - for anonymous> <actions>
# The access key ID is the name. Actions are scoped to the consumer's bucket;
# the reserved name "anonymous" grants unauthenticated access.
loki       seaweedfs_s3_loki_secret_key       Read:loki-bucket,Write:loki-bucket,List:loki-bucket,Tagging:loki-bucket
tempo      seaweedfs_s3_tempo_secret_key      Read:tempo-bucket,Write:tempo-bucket,List:tempo-bucket,Tagging:tempo-bucket
mlflow     seaweedfs_s3_mlflow_secret_key     Read:mlflow-artifacts,Write:mlflow-artifacts,List:mlflow-artifacts
terrakube  seaweedfs_s3_terrakube_secret_key  Read:tfstate,Write:tfstate,List:tfstate
# Public CDN: object reads only; no listing, writes or deletes.
anonymous  -                                  Read:cdn-bucket
