x-tier-label: &tier-label
  hy-home.tier: data

# Every component starts through hyhome-seaweedfs.sh, which builds the JWT and
# gRPC mTLS configuration from secrets and certificates (RUN-0024). Master,
# volume and filer are only on the internal seaweed_internal network: the
# master hands out write JWTs on /dir/assign and deletes collections on
# /col/delete to any caller that reaches it. The image
# entrypoint is bypassed: it needs root to chown and drop privileges, and it
# adds -mdir/-dir only for an unflagged first argument.
x-seaweedfs: &seaweedfs
  image: chrislusf/seaweedfs:4.47
  user: '1000:1000'
  entrypoint: [ '/bin/sh', '/opt/hyhome/hyhome-seaweedfs.sh' ]
  # weed reads security.toml from the working directory first; keep that the
  # generated file's directory, never a data bind.
  working_dir: /etc/seaweedfs
  read_only: false
  secrets:
    - seaweedfs_jwt_volume_key
    - seaweedfs_jwt_filer_key

# State lives on the data disk; each directory must exist and be owned by
# UID 1000 before the first start (RUN-0024).
volumes:
  seaweedfs-master-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/seaweedfs/master
  seaweedfs-volume-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/seaweedfs/volume
  seaweedfs-filer-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/seaweedfs/filer

services:
  seaweedfs-master:
    <<: *seaweedfs
    profiles: &seaweedfs-profiles
      - seaweedfs
      - storage-seaweedfs
      # S3 store of every consumer's profile (SPEC-0180 S07).
      - storage
      - obs
      - logs
      - tracing
      - nginx
      - mlops
      - data-science
      - lakehouse
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-med
    container_name: seaweedfs-master
    expose:
      - ${SEAWEEDFS_MASTER_HTTP_PORT:-9333}
      - ${SEAWEEDFS_MASTER_GRPC_PORT:-19333}
    # -ip is the advertised name; listening on every attached network keeps the
    # server reachable whichever network a peer resolves the name on.
    command: [ 'master', '-mdir=/data', '-ip=seaweedfs-master', '-ip.bind=0.0.0.0', '-port=${SEAWEEDFS_MASTER_HTTP_PORT:-9333}', '-port.grpc=${SEAWEEDFS_MASTER_GRPC_PORT:-19333}', '-volumeSizeLimitMB=1024', '-defaultReplication=000' ]
    volumes:
      - ./config/hyhome-seaweedfs.sh:/opt/hyhome/hyhome-seaweedfs.sh:ro
      - type: bind
        source: ${DEFAULT_CERT_DIR}/seaweedfs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - seaweedfs-master-data:/data:rw
    networks:
      seaweed_internal: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${SEAWEEDFS_MASTER_HTTP_PORT:-9333}/cluster/status || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label

  seaweedfs-volume:
    <<: *seaweedfs
    profiles: *seaweedfs-profiles
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-high
    container_name: seaweedfs-volume
    expose:
      - ${SEAWEEDFS_VOLUME_HTTP_PORT:-8085}
      - ${SEAWEEDFS_VOLUME_GRPC_PORT:-18085}
    # -max=0 sizes the volume count from free space; -minFreeSpace stops writes
    # before the shared data disk fills (POL-0035).
    command: [ 'volume', '-dir=/data', '-max=0', '-minFreeSpace=20GiB', '-mserver=seaweedfs-master:${SEAWEEDFS_MASTER_HTTP_PORT:-9333}', '-port=${SEAWEEDFS_VOLUME_HTTP_PORT:-8085}', '-port.grpc=${SEAWEEDFS_VOLUME_GRPC_PORT:-18085}', '-ip=seaweedfs-volume', '-ip.bind=0.0.0.0', '-preStopSeconds=1' ]
    volumes:
      - ./config/hyhome-seaweedfs.sh:/opt/hyhome/hyhome-seaweedfs.sh:ro
      - type: bind
        source: ${DEFAULT_CERT_DIR}/seaweedfs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - seaweedfs-volume-data:/data:rw
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    networks:
      seaweed_internal: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${SEAWEEDFS_VOLUME_HTTP_PORT:-8085}/status || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label

  seaweedfs-filer:
    <<: *seaweedfs
    profiles: *seaweedfs-profiles
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-med
    container_name: seaweedfs-filer
    expose:
      - ${SEAWEEDFS_FILER_HTTP_PORT:-8888}
      - ${SEAWEEDFS_FILER_GRPC_PORT:-18888}
    # Embedded leveldb2 store (image filer.toml: /data/filerldb2). No route:
    # direct filer HTTP needs a filer JWT, so objects are reached only via S3.
    command: [ 'filer', '-ip=seaweedfs-filer', '-ip.bind=0.0.0.0', '-port=${SEAWEEDFS_FILER_HTTP_PORT:-8888}', '-port.grpc=${SEAWEEDFS_FILER_GRPC_PORT:-18888}', '-master=seaweedfs-master:${SEAWEEDFS_MASTER_HTTP_PORT:-9333}' ]
    volumes:
      - ./config/hyhome-seaweedfs.sh:/opt/hyhome/hyhome-seaweedfs.sh:ro
      - type: bind
        source: ${DEFAULT_CERT_DIR}/seaweedfs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - seaweedfs-filer-data:/data:rw
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    networks:
      seaweed_internal: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${SEAWEEDFS_FILER_HTTP_PORT:-8888}/healthz || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label

  seaweedfs-s3:
    <<: *seaweedfs
    profiles: *seaweedfs-profiles
    extends:
      file: ../../../common-optimizations.yml
      service: template-infra-med
    container_name: seaweedfs-s3
    environment:
      SEAWEEDFS_S3_ADMIN_ACCESS_KEY: ${SEAWEEDFS_S3_ADMIN_ACCESS_KEY:-}
    secrets:
      - seaweedfs_jwt_volume_key
      - seaweedfs_jwt_filer_key
      - seaweedfs_s3_admin_secret_key
      - seaweedfs_s3_loki_secret_key
      - seaweedfs_s3_tempo_secret_key
      - seaweedfs_s3_mlflow_secret_key
      - seaweedfs_s3_terrakube_secret_key
      - seaweedfs_s3_lakehouse_secret_key
    expose:
      - ${SEAWEEDFS_S3_HTTP_PORT:-8333}
      - ${SEAWEEDFS_ICEBERG_PORT:-8181}
    # The Iceberg REST catalog serves table buckets and signs with the same
    # S3 identities (SigV4); it has no route and stays on object_net. Lance
    # stays off, and the embedded IAM API is off because identities come from
    # the config file.
    command: [ 's3', '-filer=seaweedfs-filer:${SEAWEEDFS_FILER_HTTP_PORT:-8888}', '-ip.bind=0.0.0.0', '-port=${SEAWEEDFS_S3_HTTP_PORT:-8333}', '-port.iceberg=${SEAWEEDFS_ICEBERG_PORT:-8181}', '-port.lance=0', '-iam=false' ]
    volumes:
      - ./config/hyhome-seaweedfs.sh:/opt/hyhome/hyhome-seaweedfs.sh:ro
      - type: bind
        source: ${DEFAULT_CERT_DIR}/seaweedfs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - ./config/s3-identities.conf:/opt/hyhome/s3-identities.conf:ro
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.s3.rule: Host(`s3.${DEFAULT_URL}`)
      traefik.http.routers.s3.entrypoints: websecure
      traefik.http.routers.s3.tls: 'true'
      traefik.http.services.s3.loadbalancer.server.port: ${SEAWEEDFS_S3_HTTP_PORT:-8333}
      traefik.http.routers.s3.middlewares: gateway-standard-chain@file
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    networks:
      edge_net: {}
      seaweed_internal: {}
      object_net: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${SEAWEEDFS_S3_HTTP_PORT:-8333}/healthz || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s

  # Idempotent bucket creation with the admin identity; consumers wait for it.
  seaweedfs-buckets:
    profiles: *seaweedfs-profiles
    extends:
      file: ../../../common-optimizations.yml
      service: template-job-low
    image: amazon/aws-cli:2.36.50
    container_name: seaweedfs-buckets
    restart: 'no'
    entrypoint: [ '/bin/bash', '/opt/hyhome/seaweedfs-buckets.sh' ]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ADMIN_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://seaweedfs-s3:${SEAWEEDFS_S3_HTTP_PORT:-8333}
      BUCKETS: loki-bucket tempo-bucket mlflow-artifacts tfstate cdn-bucket
    volumes:
      - ./config/seaweedfs-buckets.sh:/opt/hyhome/seaweedfs-buckets.sh:ro
    secrets:
      - seaweedfs_s3_admin_secret_key
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    networks:
      object_net: {}
    labels:
      <<: *tier-label

  # Iceberg table bucket, its policy and namespaces; lakehouse only, so the
  # object-bucket job every S3 profile waits on never touches S3 Tables.
  seaweedfs-table-bucket:
    profiles:
      - lakehouse
    extends:
      file: ../../../common-optimizations.yml
      service: template-job-low
    image: amazon/aws-cli:2.36.50
    container_name: seaweedfs-table-bucket
    restart: 'no'
    entrypoint: [ '/bin/bash', '/opt/hyhome/seaweedfs-table-bucket.sh' ]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ADMIN_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://seaweedfs-s3:${SEAWEEDFS_S3_HTTP_PORT:-8333}
    volumes:
      - ./config/seaweedfs-table-bucket.sh:/opt/hyhome/seaweedfs-table-bucket.sh:ro
    secrets:
      - seaweedfs_s3_admin_secret_key
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    networks:
      object_net: {}
    labels:
      <<: *tier-label
