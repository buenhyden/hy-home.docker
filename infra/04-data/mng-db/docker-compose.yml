x-tier-label: &tier-label
  hy-home.tier: data

volumes:
  mng-pg-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_MANAGEMENT_DIR:?DEFAULT_MANAGEMENT_DIR is required}/pg
  mng-valkey-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_MANAGEMENT_DIR:?DEFAULT_MANAGEMENT_DIR is required}/valkey
services:
  mng-valkey:
    profiles:
      - mng
      - core
      - dev
      - local
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    image: valkey/valkey:9.1.2-alpine
    container_name: mng-valkey
    hostname: mng-valkey
    group_add:
      - '${SECRETS_GID:-1000}'
    user: '999:999'
    tmpfs:
      - /run/valkey:uid=999,gid=999,mode=0700
    entrypoint: [ '/bin/sh', '/usr/local/libexec/mng-valkey/start.sh' ]
    environment:
      MNG_VALKEY_PORT: ${VALKEY_PORT:-6379}
    volumes:
      - mng-valkey-data:/data:rw
      - ./valkey/scripts:/usr/local/libexec/mng-valkey:ro
    labels:
      <<: *tier-label
      traefik.enable: 'false'
    secrets:
      - mng_valkey_password
      - mng_valkey_monitor_password
      - mng_valkey_inspector_password
    ports:
      - ${HOST_LAN_BIND_IP:-192.168.0.13}:${VALKEY_MNG_HOST_PORT:-26379}:${VALKEY_PORT:-6379}
    expose:
      - '${VALKEY_PORT:-6379}'
    healthcheck:
      test: [ 'CMD-SHELL', 'REDISCLI_AUTH=$$(tr -d "\r\n" </run/secrets/mng_valkey_password) valkey-cli --no-auth-warning -h 127.0.0.1 -p ${VALKEY_PORT:-6379} ping | grep -qx PONG' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      mng_data_net: {}

  mng-valkey-exporter:
    profiles:
      - mng
      - dev
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-low
    image: oliver006/redis_exporter:v1.91.1-alpine
    container_name: mng-valkey-exporter
    hostname: mng-valkey-exporter
    group_add:
      - '${SECRETS_GID:-1000}'
    expose:
      - '${VALKEY_EXPORTER_PORT:-9121}'
    # mngmonitor reads INFO and log lengths only. The password reaches the
    # process environment, never argv; CONFIG, CLIENT SETNAME and the latency
    # histogram are switched off so no wider grant is needed (SPEC-0224).
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        export REDIS_PASSWORD="$$(tr -d '\n' < /run/secrets/mng_valkey_monitor_password)"
        exec /redis_exporter -redis.addr=redis://mng-valkey:${VALKEY_PORT:-6379} -redis.user=mngmonitor -web.listen-address=:${VALKEY_EXPORTER_PORT:-9121} -config-command=- -set-client-name=false -exclude-latency-histogram-metrics
    secrets:
      - mng_valkey_monitor_password
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:${VALKEY_EXPORTER_PORT:-9121}/metrics > /dev/null 2>&1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mng-valkey:
        condition: service_healthy
    labels:
      <<: *tier-label
      traefik.enable: 'false'
    networks:
      mng_data_net: {}
      obs_net: {}
  mng-pg:
    profiles:
      - mng
      - core
      - dev
      - local
      # Dependency closure for feature profiles; feature SQL and credentials
      # live in each feature job, not here.
      - mlops
      - data-science
      - contract-testing
      - bi
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-db-med
    # The plain PostgreSQL image plus pgBackRest (./pg/backup/Dockerfile), so
    # archive_command runs inside the server as the postgres user.
    image: hy-home/mng-pg:18.6-pgbackrest
    build:
      context: ./pg/backup
      dockerfile: Dockerfile
    container_name: mng-pg
    hostname: mng-pg
    group_add:
      - '${SECRETS_GID:-1000}'
    # Official entrypoint creates/chowns PGDATA and drops to postgres.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/mng_postgres_password
      POSTGRES_USER: ${POSTGRES_DEFAULT_USER}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      # pgBackRest connects through the local socket as the bootstrap superuser;
      # the repository passphrase arrives through the include path, not env.
      PGBACKREST_PG1_USER: ${POSTGRES_DEFAULT_USER}
      PGBACKREST_CONFIG_INCLUDE_PATH: /tmp/pgbackrest/conf.d
    command:
      - postgres
      - -c
      - wal_level=logical

      # Continuous WAL archiving to the pgBackRest repository (RPO bound by
      # archive_timeout). A failing archive keeps WAL in pg_wal; watch disk use.
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=mng archive-push %p
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}

      - -c
      - max_replication_slots=${POSTGRES_MAX_REPLICATION_SLOTS:-4}

      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-4}

      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-2048MB}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-25432}:${POSTGRES_PORT:-5432}'
    volumes:
      - mng-pg-data:/var/lib/postgresql/data:rw
      # pgBackRest repository (POL-0021). An unset key renders a path that does
      # not exist, so only mng-pg (re)creation fails instead of every command.
      - type: bind
        source: ${BACKUP_STATE_REPO_DIR:-/missing-BACKUP_STATE_REPO_DIR}/pgbackrest
        target: /var/lib/pgbackrest
        bind:
          create_host_path: false
    secrets:
      - mng_postgres_password
      - pgbackrest_cipher_pass
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      mng_data_net: {}

  mng-pg-init:
    profiles:
      - mng
      - core
      - dev
      - local
      # Dependency closure for feature profiles; feature SQL and credentials
      # live in each feature job, not here.
      - mlops
      - data-science
      - contract-testing
      - bi
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    restart: 'no'
    image: postgres:18.6-alpine
    container_name: mng-pg-init
    hostname: mng-pg-init
    group_add:
      - '${SECRETS_GID:-1000}'
    environment:
      POSTGRES_HOSTNAME: mng-pg
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_DEFAULT_USER}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(tr -d '\n' </run/secrets/mng_postgres_password)"

        until pg_isready -h "$$POSTGRES_HOSTNAME" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 2
        done

        N8N_DB_PASSWORD="$$(tr -d '\n' </run/secrets/n8n_db_password)"
        KEYCLOAK_DB_PASSWORD="$$(tr -d '\n' </run/secrets/keycloak_db_password)"
        AIRFLOW_DB_PASSWORD="$$(tr -d '\n' </run/secrets/airflow_db_password)"
        TERRAKUBE_DB_PASSWORD="$$(tr -d '\n' </run/secrets/terrakube_db_password)"
        SONARQUBE_DB_PASSWORD="$$(tr -d '\n' </run/secrets/sonarqube_db_password)"

        psql \
          -h "$$POSTGRES_HOSTNAME" \
          -p "$$POSTGRES_PORT" \
          -U "$$POSTGRES_USER" \
          -d "$$POSTGRES_DB" \
          -v ON_ERROR_STOP=1 \
          -v n8n_db_password="$$N8N_DB_PASSWORD" \
          -v keycloak_db_password="$$KEYCLOAK_DB_PASSWORD" \
          -v airflow_db_password="$$AIRFLOW_DB_PASSWORD" \
          -v terrakube_db_password="$$TERRAKUBE_DB_PASSWORD" \
          -v sonarqube_db_password="$$SONARQUBE_DB_PASSWORD" \
          -f /work/init_users_dbs.sql
    volumes:
      - ./pg/init-scripts/init_users_dbs.sql:/work/init_users_dbs.sql:ro
    depends_on:
      mng-pg:
        condition: service_healthy
    secrets:
      - mng_postgres_password
      - n8n_db_password
      - keycloak_db_password
      - airflow_db_password
      - terrakube_db_password
      - sonarqube_db_password
    networks:
      mng_data_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  # Creates or updates mng_pg_monitor, the exporter's read-only metrics role,
  # and sets its password from the secret on every run (SPEC-0224).
  mng-pg-monitor-provision:
    profiles:
      - mng
      - dev
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    image: postgres:18.6-alpine
    container_name: mng-pg-monitor-provision
    hostname: mng-pg-monitor-provision
    group_add:
      - '${SECRETS_GID:-1000}'
    entrypoint:
      - /bin/sh
      - /provision/run-feature-provision.sh
    environment:
      PGHOST: mng-pg
      PGPORT: '${POSTGRES_PORT:-5432}'
      PGUSER: '${POSTGRES_DEFAULT_USER}'
      PGDATABASE: '${POSTGRES_DEFAULT_DB}'
      PROVISION_ADMIN_PASSWORD_FILE: /run/secrets/mng_postgres_password
      PROVISION_SQL: /provision/monitor.sql
      PROVISION_SECRETS: MNG_PG_MONITOR_PASSWORD=/run/secrets/mng_pg_monitor_password
    volumes:
      - ./pg/provision/run-feature-provision.sh:/provision/run-feature-provision.sh:ro
      - ./pg/provision/monitor.sql:/provision/monitor.sql:ro
    secrets:
      - mng_postgres_password
      - mng_pg_monitor_password
    depends_on:
      mng-pg:
        condition: service_healthy
    labels:
      <<: *tier-label
      traefik.enable: 'false'
    networks:
      mng_data_net: {}

  mng-pg-exporter:
    profiles:
      - mng
      - dev
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-low
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: mng-pg-exporter
    hostname: mng-pg-exporter
    group_add:
      - '${SECRETS_GID:-1000}'
    # Reads through mng_pg_monitor; the exporter takes the password from the
    # file itself, so the administrator secret is never mounted (SPEC-0224).
    environment:
      DATA_SOURCE_URI: mng-pg:${POSTGRES_PORT:-5432}/${POSTGRES_DEFAULT_DB}?sslmode=disable
      DATA_SOURCE_USER: mng_pg_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/mng_pg_monitor_password
    command: ['--collector.postmaster']
    expose:
      - '${POSTGRES_EXPORTER_PORT:-9187}'
    depends_on:
      mng-pg-monitor-provision:
        condition: service_completed_successfully
    secrets:
      - mng_pg_monitor_password
    labels:
      <<: *tier-label
      traefik.enable: 'false'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:${POSTGRES_EXPORTER_PORT:-9187}/metrics > /dev/null 2>&1 || exit 1' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      mng_data_net: {}
      obs_net: {}
