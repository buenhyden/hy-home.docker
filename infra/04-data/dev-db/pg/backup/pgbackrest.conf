# pgBackRest configuration for the development PostgreSQL server (stanza "dev").
# The cipher passphrase is not here: the entrypoint writes it from the
# dev_pgbackrest_cipher_pass Docker secret into the include path at start.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-diff=6
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
spool-path=/var/spool/pgbackrest
# When archiving keeps failing, drop WAL past this size instead of filling the
# data disk; the dropped range is a point-in-time recovery gap (RUN-0021).
archive-push-queue-max=2GiB

[global:archive-push]
log-level-console=warn

[dev]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
