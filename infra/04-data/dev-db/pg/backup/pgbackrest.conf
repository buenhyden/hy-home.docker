# Proposed dev-pg recovery source. No backup/restore has run.
# Retention/expire is deliberately unset until separate owner approval.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
spool-path=/var/spool/pgbackrest

[global:archive-push]
log-level-console=warn

[dev]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
