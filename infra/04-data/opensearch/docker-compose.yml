x-tier-label: &tier-label
  hy-home.tier: data

volumes:
  opensearch-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/opensearch/opensearch1-data
  opensearch-dashboards-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/opensearch/opensearch-dashboards-data

services:
  opensearch:
    profiles:
      - opensearch
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-high
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENSEARCH_BASE_IMAGE: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
        OPENSEARCH_EXPORTER_VERSION: '3.9.0.0'
    container_name: opensearch
    hostname: opensearch
    group_add:
      - '${SECRETS_GID:-1000}'
    environment:
      OPENSEARCH_JAVA_OPTS: '${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}'
      bootstrap.memory_lock: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    entrypoint:
      - /usr/local/bin/opensearch-entrypoint.sh
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: '1g'
    secrets:
      - opensearch_admin_password
      - opensearch_dashboard_password
      - opensearch_exporter_password
      - opensearch_security_cookie
    volumes:
      - opensearch-data:/usr/share/opensearch/data:rw
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/cert.pem
        target: /usr/share/opensearch/config/certs/cert.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/key.pem
        target: /usr/share/opensearch/config/certs/key.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/rootCA.pem
        target: /usr/share/opensearch/config/certs/rootCA.pem
        read_only: true
        bind: {create_host_path: false}
      - ./opensearch/config/opensearch-security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
      - ./opensearch/config/opensearch-security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/config/opensearch-security/internal_users.template.yml:/usr/share/opensearch/config/opensearch-security/internal_users.template.yml:ro
      - ./opensearch/config/opensearch-security/action_groups.yml:/usr/share/opensearch/config/opensearch-security/action_groups.yml:ro
      - ./opensearch/config/opensearch-security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./opensearch/config/opensearch-security/tenants.yml:/usr/share/opensearch/config/opensearch-security/tenants.yml:ro
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/config/userdict_ko.txt:/usr/share/opensearch/config/userdict_ko.txt:ro
    networks:
      edge_net: {}
      obs_net: {}
    healthcheck:
      test:
        - CMD-SHELL
        - |
          password=$$(cat /run/secrets/opensearch_admin_password)
          [ -n "$$password" ] || exit 1
          [ "$$(printf '%s' "$$password" | LC_ALL=C tr -d '[:print:]' | wc -c)" -eq 0 ] || exit 1
          escaped=$$(printf '%s' "$$password" | sed 's/\\/\\\\/g; s/"/\\"/g')
          printf 'user = "admin:%s"\n' "$$escaped" | curl --config - -fsSk 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' >/dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.opensearch.rule: Host(`opensearch.${DEFAULT_URL}`)
      traefik.http.routers.opensearch.entrypoints: websecure
      traefik.http.routers.opensearch.tls: 'true'
      traefik.http.routers.opensearch.middlewares: opensearch-auth@file,gateway-standard-chain@file
      traefik.http.services.opensearch.loadbalancer.serversTransport: opensearch-transport@file
      traefik.http.services.opensearch.loadbalancer.server.port: 9200
      traefik.http.services.opensearch.loadbalancer.server.scheme: https

  opensearch-dashboards:
    profiles:
      - opensearch
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:4bdb8ded547ce7f4c379a10261f1b4aad58726900c215be570a7d1fe86f2a7d8
    container_name: opensearch-dashboards
    hostname: opensearch-dashboards
    group_add:
      - '${SECRETS_GID:-1000}'
    networks:
      edge_net: {}
    expose:
      - '${KIBANA_PORT:-5601}'
    volumes:
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/cert.pem
        target: /usr/share/opensearch-dashboards/config/certs/cert.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/key.pem
        target: /usr/share/opensearch-dashboards/config/certs/key.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_CERT_DIR:?DEFAULT_CERT_DIR is required}/rootCA.pem
        target: /usr/share/opensearch-dashboards/config/certs/rootCA.pem
        read_only: true
        bind: {create_host_path: false}
      - ./opensearch-dashboards/config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
      # P06: the OpenBao Agent's oauth2-proxy output, read when the client secret file
      # variable points under /run/openbao/oauth2-proxy. A missing directory stops it.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/out/oauth2-proxy
        target: /run/openbao/oauth2-proxy
        read_only: true
        bind: {create_host_path: false}
    environment:
      - OPENSEARCH_USERNAME=${OPENSEARCH_DASHBOARD_USERNAME:-kibanaserver}
      # P06: the OIDC client secret file; unset keeps /run/secrets.
      - OPENSEARCH_OIDC_CLIENT_SECRET_FILE=${OPENSEARCH_OIDC_CLIENT_SECRET_FILE:-/run/secrets/oauth2_proxy_client_secret}
      - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS:-["https://opensearch:9200"]}
    command:
      - bash
      - -c
      - |
        export OPENSEARCH_PASSWORD="$(cat /run/secrets/opensearch_dashboard_password)"
        export OPENSEARCH_SECURITY_COOKIE="$(tr -d '\r\n' < /run/secrets/opensearch_security_cookie)"
        export OPENSEARCH_CLIENT_SECRET="$(tr -d '\r\n' < "$${OPENSEARCH_OIDC_CLIENT_SECRET_FILE}")"

        exec /usr/share/opensearch-dashboards/bin/opensearch-dashboards
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.opensearch-dashboards.rule: Host(`opensearch-dashboard.${DEFAULT_URL}`)
      traefik.http.routers.opensearch-dashboards.entrypoints: websecure
      traefik.http.routers.opensearch-dashboards.tls: 'true'
      traefik.http.services.opensearch-dashboards.loadbalancer.server.port: ${KIBANA_PORT:-5601}
      traefik.http.services.opensearch-dashboards.loadbalancer.server.scheme: https
      traefik.http.routers.opensearch-dashboards.middlewares: gateway-standard-chain@file
      traefik.http.services.opensearch-dashboards.loadbalancer.serversTransport: opensearch-dashboards-transport@file
    depends_on:
      opensearch:
        condition: service_healthy
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - |
          code=$$(curl -ks -o /dev/null -w "%{http_code}" https://localhost:${KIBANA_PORT:-5601}/api/status); \
          [ "$$code" = "200" ] || [ "$$code" = "401" ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 60s
    secrets:
      - oauth2_proxy_client_secret
      - opensearch_dashboard_password
      - opensearch_security_cookie
