x-tier-label: &tier-label
  hy-home.tier: data

volumes:
  qdrant-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_DATA_DIR}/qdrant/data

services:
  qdrant:
    profiles:
      - ai
      - ai-llm
      - qdrant
    extends:
      file: ../../../common-optimizations.yml
      service: template-stateful-med
    user: '1000:1000'
    image: qdrant/qdrant:v1.19.1-unprivileged
    container_name: qdrant
    read_only: false
    tmpfs:
      - /tmp
    # Traefik 완전 통합형이면 host ports 제거
    expose:
      - '${QDRANT_PORT:-6333}'
      - '${QDRANT_GRPC_PORT:-6334}'
    environment:
      # 텔레메트리 활성화
      QDRANT__TELEMETRY_DISABLED: 'false'
      # 서비스 포트 명시
      QDRANT__SERVICE__HTTP_PORT: '${QDRANT_PORT:-6333}'
      QDRANT__SERVICE__GRPC_PORT: '${QDRANT_GRPC_PORT:-6334}'
      # 핵심: snapshots를 storage 내부로 이동
      QDRANT__STORAGE__SNAPSHOTS_PATH: '/qdrant/storage/snapshots'

      # 스냅샷 임시 파일은 tmpfs 사용
      QDRANT__STORAGE__TEMP_PATH: '/tmp'

    volumes:
      - qdrant-data:/qdrant/storage:rw
    secrets:
      - qdrant_api_key
      - qdrant_read_only_api_key
    # Qdrant reads the key only from the environment. With it set, every REST
    # and gRPC call needs `api-key` or `Authorization: Bearer`; /readyz,
    # /livez and /healthz stay open for the healthcheck. The read-only key
    # (Prometheus scrape) can read but not write.
    command:
      - /bin/bash
      - -ec
      - |
        QDRANT__SERVICE__API_KEY="$$(tr -d '\r\n' </run/secrets/qdrant_api_key)"
        [ "$${#QDRANT__SERVICE__API_KEY}" -ge 16 ] || { echo 'qdrant: qdrant_api_key must be at least 16 characters' >&2; exit 64; }
        export QDRANT__SERVICE__API_KEY
        QDRANT__SERVICE__READ_ONLY_API_KEY="$$(tr -d '\r\n' </run/secrets/qdrant_read_only_api_key)"
        [ "$${#QDRANT__SERVICE__READ_ONLY_API_KEY}" -ge 16 ] || { echo 'qdrant: qdrant_read_only_api_key must be at least 16 characters' >&2; exit 64; }
        [ "$$QDRANT__SERVICE__READ_ONLY_API_KEY" != "$$QDRANT__SERVICE__API_KEY" ] || { echo 'qdrant: qdrant_read_only_api_key must differ from qdrant_api_key' >&2; exit 64; }
        export QDRANT__SERVICE__READ_ONLY_API_KEY
        exec ./entrypoint.sh
    networks:
      edge_net: {}
      ai_net: {}
      obs_net: {}
    healthcheck:
      test: [ 'CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/${QDRANT_PORT:-6333} && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      # REST and dashboard for people, behind SSO; the API key is still needed
      # past it. Containers use qdrant:6333 on ai_net with the key.
      traefik.http.routers.qdrant.rule: Host(`qdrant.${DEFAULT_URL}`)
      traefik.http.routers.qdrant.entrypoints: websecure
      traefik.http.routers.qdrant.tls: 'true'
      traefik.http.routers.qdrant.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.qdrant.loadbalancer.server.port: ${QDRANT_PORT:-6333}
