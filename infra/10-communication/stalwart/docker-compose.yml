x-tier-label: &tier-label
  hy-home.tier: communication

volumes:
  stalwart-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Must exist (empty) before the first start; Docker then copies the
      # image directory's owner (the image user, UID 2000) onto it.
      device: ${DEFAULT_COMMUNICATION_DIR}/stalwart/data

services:
  # Internal-only mail server: no host port. Containers on mail_net submit on
  # 25/587; the admin UI and JMAP are on 8080 behind Traefik. Listeners,
  # domain and relay policy live in the datastore and come from
  # config/plan.ndjson through stalwart-config.
  stalwart:
    profiles:
      - mail-server
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-med
    image: stalwartlabs/stalwart:v0.16.22
    container_name: stalwart
    # The image user (UID 2000) owns the datastore. The binary carries cap_net_bind_service for ports below 1024; with
    # no-new-privileges it cannot start unless that one capability is kept.
    cap_add:
      - NET_BIND_SERVICE
    entrypoint:
      - /bin/sh
      - /opt/hyhome/start.sh
    environment:
      # Same name as STALWART_USER in stalwart-config below.
      STALWART_ADMIN_USER: admin
    volumes:
      - stalwart-data:/var/lib/stalwart:rw
      - ./config/config.json:/etc/stalwart/config.json:ro
      - ./config/start.sh:/opt/hyhome/start.sh:ro
    secrets:
      - stalwart_password
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8080/healthz/live' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      edge_net: {}
      mail_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.stalwart-ui.rule: Host(`mail.${DEFAULT_URL}`)
      traefik.http.routers.stalwart-ui.entrypoints: websecure
      traefik.http.routers.stalwart-ui.tls: 'true'
      traefik.http.routers.stalwart-ui.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.stalwart-ui.loadbalancer.server.port: '8080'

  # Applies config/plan.ndjson (domain, listeners, no relaying) as the
  # recovery admin. Idempotent; listener changes take effect on the next
  # stalwart restart.
  stalwart-config:
    profiles:
      - mail-server
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    build:
      context: ./config
      dockerfile: Dockerfile
    image: hy-home/stalwart-config:0.16.22-cli1.0.12-local
    container_name: stalwart-config
    user: '1000:1000'
    entrypoint:
      - /bin/sh
      - /opt/hyhome/apply-plan.sh
    environment:
      # The CLI writes its state under HOME; the root is read-only.
      HOME: /tmp
      DEFAULT_URL: '${DEFAULT_URL}'
      STALWART_URL: http://stalwart:8080
      # Same name as STALWART_ADMIN_USER in stalwart above.
      STALWART_USER: admin
    volumes:
      - ./config/apply-plan.sh:/opt/hyhome/apply-plan.sh:ro
      - ./config/plan.ndjson:/opt/hyhome/plan.ndjson:ro
    secrets:
      - stalwart_password
    depends_on:
      stalwart:
        condition: service_healthy
    networks:
      mail_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'
