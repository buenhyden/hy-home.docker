# SPEC-0243 rollback overlay: recreate Traefik on the image it ran on 2026-10-14,
# with the OpenBao CA mount its Compose file declares. Only `image` changes.
# SEC01 accepted the Compose pin on 2026-10-15 (SPEC-0204 TSK-0009), so the
# pin is the normal path; use this solely as a second `-f` with `up -d
# --no-deps --no-build --pull never --force-recreate traefik` to roll back.
# Remove it once Traefik is stable on the pin.
x-hyhome-overlay:
  version: 1
  base: infra/01-gateway/traefik/docker-compose.yml

services:
  traefik:
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
