# dynamic/middleware.yml
http:
  serversTransports:
    # 'opensearch-transport'라는 이름의 규칙 생성
    opensearch-transport:
      serverName: "localhost" # [핵심] 인증서 검사 시 이 도메인으로 검증하라!
      rootCAs:
        - "/certs/rootCA.pem" # 검증에 사용할 신뢰하는 뿌리 인증서
    opensearch-dashboards-transport:
      serverName: "localhost" # [핵심] 인증서 검사 시 이 도메인으로 검증하라!
      rootCAs:
        - "/certs/rootCA.pem" # 검증에 사용할 신뢰하는 뿌리 인증서
  services:
    oauth2-proxy-svc:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"

  middlewares:
    # 1. 기존 SSO 인증 (앱 보호용)
    sso-auth:
      forwardAuth:
        # The proxy root (static upstream) decides per request: a browser gets
        # its 302 to Keycloak, an Accept: application/json client gets 401, and
        # a valid session gets 200 with the identity headers below.
        address: "http://oauth2-proxy:4180/"
        maxResponseBodySize: 65536
        trustForwardHeader: false
        # Identity only. Forwarding Authorization/access/ID tokens to every
        # upstream replayed the user's Keycloak token and collided with
        # upstream bearer schemes (SonarQube, Terrakube). A consumer that needs
        # a token gets its own middleware.
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Preferred-Username"

    sso-errors:
      errors:
        # Only a refused session gets the sign-in page. A 401 now reaches only
        # machine clients and must stay a 401, never a login page.
        status:
          - "403"
        service: oauth2-proxy-svc
        query: "/oauth2/sign_in?rd={url}"

    sso-protected-chain:
      chain:
        middlewares:
          - gateway-standard-chain
          - sso-errors
          - sso-auth

    # 2. 대시보드용 Basic Auth (Docker Secret 기반)
    dashboard-auth:
      basicAuth:
        usersFile: "/run/secrets/traefik_basicauth_password"

    # 3. OpenSearch API용 Basic Auth (인증 성공 시 Authorization 헤더를 백엔드로 전달)
    opensearch-auth:
      basicAuth:
        removeHeader: false
        usersFile: "/run/secrets/traefik_opensearch_basicauth_password"

    # 4. Prometheus HTTP API용 Basic Auth (k8s 클러스터 등 비대화형 client)
    prometheus-api-auth:
      basicAuth:
        usersFile: "/run/secrets/traefik_prometheus_api_htpasswd"

    large-body:
      buffering:
        maxRequestBodyBytes: 104857600  # 100MB

    # Per router and TCP peer. Excess over the bucket gets 429 at once
    # (maxDelay is 5 ms at 100/s). Burst 200 covers the observed 123-request
    # Open WebUI page load. Host and k3d clients arrive through docker-proxy
    # as the edge_net gateway, so they share one bucket per router.
    req-rate-limit:
      rateLimit:
        average: 100 # requests per second
        period: 1s
        burst: 200
        sourceCriterion:
          ipStrategy:
            depth: 0 # TCP peer; X-Forwarded-For is never trusted

    req-retry:
      retry:
        attempts: 2
        initialInterval: 100ms

    req-circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.30"

    gateway-standard-chain:
      chain:
        middlewares:
          - req-rate-limit
          - req-retry
          - req-circuit-breaker

    openclaw-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
