services:
  nginx:
    profiles:
      - nginx
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-low
    image: nginx:alpine
    container_name: nginx
    ports:
      - ${HOST_LAN_BIND_IP:-192.168.0.13}:${HTTP_HOST_PORT:-80}:${HTTP_PORT:-80}
      - ${HOST_LAN_BIND_IP:-192.168.0.13}:${HTTPS_HOST_PORT:-443}:${HTTPS_PORT:-443}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEFAULT_CERT_DIR}:/etc/nginx/certs:ro
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
    networks:
      edge_net: {}
      object_net: {}
    depends_on:
      seaweedfs-s3: { condition: service_healthy }
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${HTTP_PORT:-80}/ping || exit 1' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
