name: hy-home-common

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-labels-managed: &labels-managed
  hy-home.managed: "true"

# Secret files are 0640 owner:SECRETS_GID. A leaf that reads one declares
# group_add: ['${SECRETS_GID:-1000}'] itself; no template grants it.
x-security-base: &security-base
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-healthcheck-dev: &healthcheck-dev
  interval: 5s
  timeout: 5s
  retries: 3
  start_period: 5s

# pids_limit values are initial budgets (SPEC-0218): about four times the
# highest idle count measured in each tier on 2026-10-09, not load-tested optima.
# Reservations are the declared budget the promotion readiness check and
# `lab.py check` sum (SPEC-0263 section 5): the highest member peak of three or
# more `docker stats` samples times 1.5, rounded up to 0.05 CPU and 32 MiB and
# capped at the limit. An anchor with no running member reserves its limit
# until measured. Samples: SPEC-0263-TSK-0002 Measurements (2026-11-06).
# Docker does not enforce a CPU reservation; a memory reservation is soft.
x-resource-dev-tiny: &resource-dev-tiny
  cpus: "0.10"
  mem_limit: 64m
  pids_limit: 128
  deploy:
    resources:
      reservations:
        cpus: "0.10"
        memory: 64M

x-resource-dev-small: &resource-dev-small
  cpus: "0.20"
  mem_limit: 128m
  pids_limit: 128
  deploy:
    resources:
      reservations:
        cpus: "0.20"
        memory: 128M

x-restart-default: &restart-default
  restart: unless-stopped

x-service-defaults: &service-defaults
  <<: [*security-base, *restart-default]
  logging: *default-logging
  labels:
    <<: *labels-managed

x-service-readonly: &service-readonly
  <<: *service-defaults
  read_only: true
  tmpfs:
    - /tmp
    - /run

x-resource-low: &resource-low
  cpus: "0.50"
  mem_limit: 256m
  pids_limit: 256
  deploy:
    resources:
      reservations:
        cpus: "0.05"
        memory: 128M

x-resource-med: &resource-med
  cpus: "1.00"
  mem_limit: 512m
  pids_limit: 512
  deploy:
    resources:
      reservations:
        cpus: "0.05"
        memory: 192M

x-resource-obs-high: &resource-obs-high
  cpus: "1.50"
  mem_limit: 1g
  pids_limit: 1024
  deploy:
    resources:
      reservations:
        cpus: "1.50"
        memory: 1024M

x-resource-high: &resource-high
  cpus: "2.00"
  mem_limit: 2g
  pids_limit: 1024
  deploy:
    resources:
      reservations:
        cpus: "0.10"
        memory: 864M

x-resource-db: &resource-db
  cpus: "2.00"
  mem_limit: 2g
  pids_limit: 1024
  deploy:
    resources:
      reservations:
        cpus: "0.15"
        memory: 704M

services:
  base-security:
    <<: *security-base

  base-standard:
    <<: *service-defaults

  base-readonly:
    <<: *service-readonly

  template-infra-low:
    <<: [*service-defaults, *resource-low]

  template-infra-med:
    <<: [*service-defaults, *resource-med]

  template-infra-high:
    <<: [*service-defaults, *resource-high]

  template-infra-readonly-low:
    <<: [*service-readonly, *resource-low]

  template-infra-readonly-med:
    <<: [*service-readonly, *resource-med]

  template-infra-readonly-high:
    <<: [*service-readonly, *resource-high]

  template-stateful-low:
    <<: [*service-defaults, *resource-low]
    read_only: false

  template-stateful-med:
    <<: [*service-defaults, *resource-med]
    read_only: false

  template-stateful-high:
    <<: [*service-defaults, *resource-db]
    read_only: false

  template-stateful-ai-high:
    # GPU services keep the security base; an exact-image GPU run with it
    # loaded a model onto CUDA (SPEC-0218).
    <<: [*service-defaults]
    read_only: false

  template-job-low:
    <<: [*security-base, *resource-low]
    restart: "no"
    logging: *default-logging
    labels:
      <<: *labels-managed
    read_only: true
    tmpfs:
      - /tmp
      - /run

  template-job-med:
    <<: [*security-base, *resource-med]
    restart: "no"
    logging: *default-logging
    labels:
      <<: *labels-managed
    read_only: true
    tmpfs:
      - /tmp
      - /run

  template-host-observer-med:
    <<: [*service-defaults, *resource-med]

  template-host-observer-high:
    <<: [*service-defaults, *resource-obs-high]

  template-stateful-db-med:
    init: true
    restart: unless-stopped
    logging: *default-logging
    labels:
      hy-home.managed: "true"
    security_opt:
      - no-new-privileges:true
    # Entrypoints that re-own data and switch user add exactly the
    # capabilities they need at the leaf (SPEC-0218).
    cap_drop:
      - ALL
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 512
    deploy:
      resources:
        reservations:
          cpus: "0.15"
          memory: 128M
    read_only: false

  template-stateful-db-high:
    init: true
    restart: unless-stopped
    logging: *default-logging
    labels:
      hy-home.managed: "true"
    security_opt:
      - no-new-privileges:true
    # Entrypoints that re-own data and switch user add exactly the
    # capabilities they need at the leaf (SPEC-0218).
    cap_drop:
      - ALL
    cpus: "2.00"
    mem_limit: 2g
    pids_limit: 1024
    deploy:
      resources:
        reservations:
          cpus: "2.00"
          memory: 2048M
    read_only: false

  template-dev-tiny:
    <<: [*service-defaults, *resource-dev-tiny]
    healthcheck: *healthcheck-dev

  template-dev-small:
    <<: [*service-defaults, *resource-dev-small]
    healthcheck: *healthcheck-dev
