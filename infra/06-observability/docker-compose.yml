x-tier-label: &tier-label
  hy-home.tier: observability
# Refactored to use extends pattern for configuration inheritance

volumes:
  tempo-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/tempo
  loki-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/loki
  alertmanager-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/alertmanager
  prometheus-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/prometheus
  grafana-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/grafana
  pyroscope-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/pyroscope
  alloy-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_OBSERVABILITY_DIR}/alloy
  gatus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEFAULT_OBSERVABILITY_DIR}/gatus

services:
  prometheus:
    profiles:
      - obs
      - obs-core
      - dev
      - alerting
      - batch-metrics
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-high
    image: prom/prometheus:v3.14.0
    container_name: infra-prometheus
    tmpfs:
      - /tmp
      - /etc/prometheus:size=10M
    entrypoint:
      - '/bin/sh'
      - '-c'
    command: >
      "exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/usr/share/prometheus/console_libraries --web.console.templates=/usr/share/prometheus/consoles --web.enable-lifecycle --web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/config/${PROMETHEUS_CONFIG_FILE:-prometheus.dev.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/config/alert_rules:/etc/prometheus/alert_rules:ro
      - prometheus-data:/prometheus:rw
    secrets:
      - opensearch_exporter_password
      - openbao_token
      - qdrant_read_only_api_key
    healthcheck:
      test: [ 'CMD', 'wget', '-q', '--tries=1', '--spider', 'http://localhost:${PROMETHEUS_PORT:-9090}/-/healthy' ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 1m
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.prometheus.rule: Host(`prometheus.${DEFAULT_URL}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.tls: 'true'
      traefik.http.routers.prometheus.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      # HTTP API (remote write and queries) for machine clients such as the
      # hy-home.k8s cluster: Basic Auth instead of SSO. The UI stays behind SSO.
      # Only requests carrying Basic credentials take this route; the browser UI's
      # own /api/v1/ calls carry the SSO cookie and stay on the SSO router.
      traefik.http.routers.prometheus-api.rule: Host(`prometheus.${DEFAULT_URL}`) && PathPrefix(`/api/v1/`) && HeaderRegexp(`Authorization`, `^Basic `)
      traefik.http.routers.prometheus-api.entrypoints: websecure
      traefik.http.routers.prometheus-api.tls: 'true'
      traefik.http.routers.prometheus-api.middlewares: gateway-standard-chain@file,prometheus-api-auth@file
      traefik.http.routers.prometheus-api.service: prometheus
      traefik.http.services.prometheus.loadbalancer.server.port: ${PROMETHEUS_PORT:-9090}
    networks:
      edge_net: {}
      obs_net: {}

  loki:
    profiles:
      - obs
      - logs
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-high
    image: hy/loki:3.7.8-seaweedfs
    build:
      context: ./loki
      dockerfile: Dockerfile
    container_name: infra-loki
    user: '10001:10001'
    volumes:
      - ./loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki:rw
      # - ./loki/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    ports:
      - '${LOKI_HOST_PORT:-3100}:${LOKI_PORT:-3100}'
    environment:
      S3_ACCESS_KEY: loki
      S3_SECRET_KEY_FILE: /run/secrets/seaweedfs_s3_loki_secret_key
    secrets:
      - seaweedfs_s3_loki_secret_key
    depends_on:
      seaweedfs-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:${LOKI_PORT:-3100}/ready >/dev/null 2>&1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.loki.rule: Host(`loki.${DEFAULT_URL}`)
      traefik.http.routers.loki.entrypoints: websecure
      traefik.http.routers.loki.tls: 'true'
      traefik.http.routers.loki.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.loki.loadbalancer.server.port: ${LOKI_PORT:-3100}
    networks:
      edge_net: {}
      obs_net: {}
      object_net: {}

  tempo:
    profiles:
      - obs
      - tracing
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-high
    build:
      context: ./tempo
      dockerfile: Dockerfile
    image: hy/tempo:3.0.3-seaweedfs
    container_name: infra-tempo
    user: '10001:10001'
    volumes:
      - ./tempo/config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo:rw
      # - ./tempo/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    ports:
      - '${TEMPO_HOST_PORT:-3200}:${TEMPO_PORT:-3200}'
    environment:
      S3_ACCESS_KEY: tempo
      S3_SECRET_KEY_FILE: /run/secrets/seaweedfs_s3_tempo_secret_key
    secrets:
      - seaweedfs_s3_tempo_secret_key
    depends_on:
      seaweedfs-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:${TEMPO_PORT:-3200}/ready || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.tempo.rule: Host(`tempo.${DEFAULT_URL}`)
      traefik.http.routers.tempo.entrypoints: websecure
      traefik.http.routers.tempo.tls: 'true'
      traefik.http.routers.tempo.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.tempo.loadbalancer.server.port: ${TEMPO_PORT:-3200}
    networks:
      edge_net: {}
      obs_net: {}
      object_net: {}

  alloy:
    profiles:
      - obs
      - logs
      - tracing
      - profiling
    extends:
      file: ../common-optimizations.yml
      service: template-infra-med
    image: grafana/alloy:v1.19.2
    container_name: infra-alloy
    # The image runs as root, but its state directory (and the bind-backed
    # alloy-data volume) belongs to the image's alloy user (UID 473, mode 770).
    # With every capability dropped, root cannot write there, so run as alloy
    # and add the host docker group for the read-only Docker socket.
    user: '473:473'
    group_add:
      - '${DOCKER_GID:-989}'
    tmpfs:
      - /tmp
      - /run
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:${ALLOY_PORT:-12345}'
      # Overriding the image command drops its default storage path; keep
      # positions and remote-write WAL on the alloy-data volume.
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    volumes:
      - ./alloy/config/${ALLOY_CONFIG_FILE:-config.alloy}:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy:rw
    ports:
      - '${ALLOY_OTLP_GRPC_HOST_PORT:-4317}:${ALLOY_OTLP_GRPC_PORT:-4317}'
      - '${ALLOY_OTLP_HTTP_HOST_PORT:-4318}:${ALLOY_OTLP_HTTP_PORT:-4318}'
    depends_on:
      prometheus:
        condition: service_healthy
        required: false
      loki:
        condition: service_healthy
        required: false
      tempo:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ 'CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/localhost/12345; printf \"HEAD /-/healthy HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; timeout 2 head -1 <&3 | grep -q \"200\"'" ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.alloy.rule: Host(`alloy.${DEFAULT_URL}`)
      traefik.http.routers.alloy.entrypoints: websecure
      traefik.http.routers.alloy.tls: 'true'
      traefik.http.routers.alloy.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.alloy.loadbalancer.server.port: ${ALLOY_PORT:-12345}
    networks:
      edge_net: {}
      obs_net: {}

  grafana:
    profiles:
      - obs
      - obs-core
      - dev
      - logs
      - tracing
      - profiling
      - alerting
      - batch-metrics
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-med
    image: grafana/grafana:13.2.2
    container_name: infra-grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DEFAULT_URL}
      GF_SERVER_DOMAIN: grafana.${DEFAULT_URL}
      GF_AUTH_OAUTH_AUTO_LOGIN: 'true'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: 'Keycloak'
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: 'preferred_username'
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: 'email'
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: 'name'
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_PROXY_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: 'openid profile email offline_access groups'
      # Verify Keycloak with the local root CA (same trust as OAuth2 Proxy).
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: 'false'
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /etc/grafana/rootCA.pem
      GF_DATAPROXY_TIMEOUT: 300
      GF_DATAPROXY_KEEP_ALIVE_SECONDS: 300
      # 전체 서버 읽기 타임아웃
      GF_SERVER_READ_TIMEOUT: 5m
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: 'https://keycloak.${DEFAULT_URL}/realms/hy-home.realm/protocol/openid-connect/auth'
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: 'https://keycloak.${DEFAULT_URL}/realms/hy-home.realm/protocol/openid-connect/token'
      GF_AUTH_GENERIC_OAUTH_API_URL: 'https://keycloak.${DEFAULT_URL}/realms/hy-home.realm/protocol/openid-connect/userinfo'
      GF_AUTH_SIGNOUT_REDIRECT_URL: 'https://keycloak.${DEFAULT_URL}/realms/hy-home.realm/protocol/openid-connect/logout?post_logout_redirect_uri=https://grafana.${DEFAULT_URL}/login'

      # 권한 매핑 (Role Mapping) - 핵심
      # Keycloak의 'groups' 정보를 읽어서 Grafana 권한(Admin/Editor/Viewer)으로 변환
      # 로직: groups 배열에 '/admins'이 있으면 'Admin', 아니면 'Viewer' 부여
      # No catch-all role: with strict mode a realm user outside these groups is
      # denied instead of silently becoming Viewer.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], '/admins') && 'Admin' || contains(groups[*], '/editors') && 'Editor' || contains(groups[*], '/viewers') && 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: 'true'
      # (옵션) '/admin' 그룹 유저에게 Grafana 전체 서버 관리자(Super Admin) 권한까지 부여하려면 true
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
      GF_AUTH_GENERIC_OAUTH_GRAFANA_ADMIN_ATTRIBUTE_PATH: contains(groups[*], '/admins')
      # [5] 기타 기능 설정
      GF_FEATURE_TOGGLES_ENABLE: 'traceqlEditor'
      # [추가] PKCE 활성화: Keycloak의 보안 요구 사항을 충족시킵니다.
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      # S256 방식을 명시적으로 지정 (필요 시)
      GF_AUTH_GENERIC_OAUTH_CODE_CHALLENGE_METHOD: 'S256'
      # Anonymous Viewer (formerly enabled for Kiali/internal API checks) let any
      # client that reached the route read every dashboard. /api/health needs no
      # session; a caller needing more (e.g. Kiali dashboard lookup) must use a
      # Grafana service-account token, not anonymous access.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana:rw
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/grafana/rootCA.pem:ro
    secrets:
      - grafana_admin_password
      - grafana_client_secret
    depends_on:
      prometheus:
        condition: service_healthy
        required: false
      loki:
        condition: service_healthy
        required: false
      tempo:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${GRAFANA_PORT:-3000}/api/health || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.grafana-static.rule: Host(`grafana.${DEFAULT_URL}`) && (Path(`/favicon.ico`) || Path(`/robots.txt`))
      traefik.http.routers.grafana-static.entrypoints: websecure
      traefik.http.routers.grafana-static.tls: true
      traefik.http.routers.grafana-static.priority: 200
      traefik.http.routers.grafana-static.service: grafana-svc

      traefik.http.routers.grafana.rule: Host(`grafana.${DEFAULT_URL}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls: 'true'
      traefik.http.routers.grafana.middlewares: gateway-standard-chain@file
      traefik.http.routers.grafana.service: grafana-svc
      traefik.http.services.grafana-svc.loadbalancer.server.port: ${GRAFANA_PORT:-3000}

    networks:
      edge_net: {}
      obs_net: {}

  node-exporter:
    profiles:
      - obs
      - obs-host
      - dev
    extends:
      file: ../common-optimizations.yml
      service: template-infra-readonly-low
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    pid: host
    command:
      - '--path.rootfs=/host/root'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=:9100'
      - '--no-collector.timex'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)'

    volumes:
      - '/:/host/root:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    expose:
      - '9100'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:9100/metrics >/dev/null 2>&1 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      obs_net: {}
    labels:
      <<: *tier-label

  cadvisor:
    profiles:
      - obs
      - obs-host
      - dev
    extends:
      file: ../common-optimizations.yml
      service: template-host-observer-med
    cpus: ${CADVISOR_CPUS:-1.50}
    mem_limit: ${CADVISOR_MEM_LIMIT:-1g}
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=35s'
      - '--event_storage_event_limit=default=0'
      - '--event_storage_age_limit=default=0'
    expose:
      - '${CADVISOR_PORT:-8080}'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${CADVISOR_PORT:-8080}/healthz || exit 1' ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.cadvisor.rule: Host(`cadvisor.${DEFAULT_URL}`)
      traefik.http.routers.cadvisor.entrypoints: websecure
      traefik.http.routers.cadvisor.tls: 'true'
      traefik.http.routers.cadvisor.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.cadvisor.loadbalancer.server.port: ${CADVISOR_PORT:-8080}
    networks:
      edge_net: {}
      obs_net: {}

  gatus:
    profiles:
      - obs
      - availability
      - dev
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-low
    build:
      context: ./gatus
      dockerfile: Dockerfile
    image: hy/gatus:local
    container_name: gatus
    user: '${GATUS_UID:-1000}:${GATUS_GID:-1000}'
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      GATUS_LOG_LEVEL: INFO
      DEFAULT_URL: '${DEFAULT_URL}'
      GATUS_OIDC_ALLOWED_SUBJECT: '${GATUS_OIDC_ALLOWED_SUBJECT}'
      GATUS_OIDC_CLIENT_SECRET_FILE: /run/secrets/gatus_oidc_client_secret
      PORT: '${GATUS_PORT}'
    volumes:
      - ./gatus/config/config.oidc.yaml:/config/config.yaml:ro
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/hy-home-rootCA.pem:ro
      - gatus-data:/data:rw
    secrets:
      - gatus_oidc_client_secret
    expose:
      - '${GATUS_PORT}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:${GATUS_PORT}/health >/dev/null 2>&1 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.gatus.rule: Host(`status.${DEFAULT_URL}`) && !PathPrefix(`/metrics`)
      traefik.http.routers.gatus.entrypoints: websecure
      traefik.http.routers.gatus.tls: 'true'
      traefik.http.routers.gatus.middlewares: gateway-standard-chain@file
      traefik.http.services.gatus.loadbalancer.server.port: ${GATUS_PORT}
    networks:
      edge_net: {}
      mng_data_net: {}
      obs_net: {}

  pyroscope:
    profiles:
      - obs
      - profiling
    extends:
      file: ../common-optimizations.yml
      service: template-infra-med
    image: grafana/pyroscope:2.3.1
    container_name: infra-pyroscope
    command:
      - -config.file=/etc/pyroscope/pyroscope.yaml
      - -config.expand-env=true
      - -server.http-listen-port=${PYROSCOPE_PORT:-4040}
    volumes:
      - ./pyroscope/config/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro
      - pyroscope-data:/var/lib/pyroscope:rw
    ports:
      - '${PYROSCOPE_HOST_PORT:-4040}:${PYROSCOPE_PORT:-4040}'
    healthcheck:
      test: [ 'CMD', '/usr/bin/profilecli', 'ready', '--url=http://127.0.0.1:${PYROSCOPE_PORT:-4040}' ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.pyroscope.rule: Host(`pyroscope.${DEFAULT_URL}`)
      traefik.http.routers.pyroscope.entrypoints: websecure
      traefik.http.routers.pyroscope.tls: 'true'
      traefik.http.routers.pyroscope.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.pyroscope.loadbalancer.server.port: ${PYROSCOPE_PORT:-4040}
    networks:
      edge_net: {}
      obs_net: {}

  alertmanager:
    profiles:
      - obs
      - alerting
    extends:
      file: ../common-optimizations.yml
      service: template-stateful-low
    image: prom/alertmanager:v0.34.1
    container_name: infra-alertmanager
    tmpfs:
      - /tmp
      - /etc/alertmanager:size=1M
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "SMTP_USERNAME=$$(cat /run/secrets/smtp_username) && SMTP_PASSWORD=$$(cat /run/secrets/smtp_password) && SLACK_WEBHOOK_URL=$$(cat /run/secrets/slack_webhook) && sed -e \"s|__SMTP_USERNAME__|$$SMTP_USERNAME|g\" -e \"s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g\" -e \"s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g\" /etc/alertmanager/config.yml.template > /tmp/config.yml && exec /bin/alertmanager --config.file=/tmp/config.yml --storage.path=/alertmanager"
    volumes:
      - ./alertmanager/config/config.yml:/etc/alertmanager/config.yml.template:ro
      - alertmanager-data:/alertmanager:rw
    secrets:
      - smtp_username
      - smtp_password
      - slack_webhook
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${ALERTMANAGER_PORT:-9093}/-/ready || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.alertmanager.rule: Host(`alertmanager.${DEFAULT_URL}`)
      traefik.http.routers.alertmanager.entrypoints: websecure
      traefik.http.routers.alertmanager.tls: 'true'
      traefik.http.routers.alertmanager.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.alertmanager.loadbalancer.server.port: ${ALERTMANAGER_PORT:-9093}
    networks:
      edge_net: {}
      obs_net: {}

  pushgateway:
    profiles:
      - obs
      - batch-metrics
    extends:
      file: ../common-optimizations.yml
      service: template-infra-readonly-low
    image: prom/pushgateway:v1.11.3
    container_name: pushgateway
    expose:
      - '${PUSHGATEWAY_PORT:-9091}'
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${PUSHGATEWAY_PORT:-9091}/-/ready || exit 1' ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.pushgateway.rule: Host(`pushgateway.${DEFAULT_URL}`)
      traefik.http.routers.pushgateway.entrypoints: websecure
      traefik.http.routers.pushgateway.tls: 'true'
      traefik.http.routers.pushgateway.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.services.pushgateway.loadbalancer.server.port: ${PUSHGATEWAY_PORT:-9091}
    networks:
      edge_net: {}
      obs_net: {}

  dcgm-exporter:
    profiles:
      - obs-gpu

    extends:
      file: ../common-optimizations.yml
      service: template-host-observer-med

    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.8.4
    container_name: dcgm-exporter

    # SYS_ADMIN is needed only for DCP profiling fields, which consumer
    # Pascal GPUs do not support; keep the default capability set dropped.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    expose:
      - '${DCGM_EXPORTER_PORT:-9400}'

    networks:
      obs_net: {}

    labels:
      <<: *tier-label
