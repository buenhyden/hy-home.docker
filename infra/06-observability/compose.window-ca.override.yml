# SPEC-0243 rollback overlay: recreate Prometheus on the image it ran on 2026-10-14,
# with the OpenBao CA mount its Compose file declares. Only `image` changes.
# SEC01 accepted the Compose pin on 2026-10-15 (SPEC-0204 TSK-0009), so the
# pin is the normal path; use this solely as a second `-f` with `up -d
# --no-deps --no-build --pull never --force-recreate prometheus` to roll back.
# Remove it once Prometheus is stable on the pin.
x-hyhome-overlay:
  version: 1
  base: infra/06-observability/docker-compose.yml

services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
