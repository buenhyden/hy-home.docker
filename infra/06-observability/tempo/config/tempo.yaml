server:
  # Tempo HTTP API / query endpoint
  http_listen_port: 3200

  # Tempo gRPC server; OTLP gRPC port와는 별도
  grpc_listen_port: 9095


# ---------- OTLP trace 수신 ----------
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318


# ---------- Tempo → Prometheus metrics generation ----------
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: hy-home

  processor:
    span_metrics:
      dimensions:
        - service.name
        - http.status_code

    service_graphs:
      max_items: 2000

  storage:
    # metrics-generator WAL directory
    path: /var/tempo/generator/wal

    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true


# ---------- Trace 저장소: S3-compatible backend ----------
storage:
  trace:
    backend: s3

    # Ingest/write-ahead log. 반드시 persistent volume에 mount
    wal:
      path: /var/tempo/wal

    # Local temporary block/cache directory
    local:
      path: /var/tempo/blocks

    # MinIO / RustFS / SeaweedFS S3 API
    s3:
      bucket: tempo-bucket
      endpoint: minio:9000
      access_key: ${MINIO_APP_USERNAME}
      secret_key: ${MINIO_APP_USER_PASSWORD}

      # Docker 내부에서 MinIO를 HTTP로 연결할 때만 true
      insecure: true

      # self-hosted S3 endpoint에서는 path-style을 권장
      forcepathstyle: true


# ---------- 기본 tenant override ----------
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
