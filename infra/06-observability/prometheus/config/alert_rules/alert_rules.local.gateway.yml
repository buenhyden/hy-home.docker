groups:
  # ============================================================================
  # [9] Gateway & Load Balancers
  # ============================================================================
  - name: gateway_alerts
    rules:
      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 2m
        labels:
          severity: critical
          domain: gateway
        annotations:
          summary: 'Traefik 다운'
          description: 'Traefik 로드밸런서가 응답하지 않습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0013-traefik.md'

      - alert: TraefikHighHttp4xxErrorRateService
        expr: sum(rate(traefik_service_requests_total{code=~"4.*"}[3m])) by
          (service) / sum(rate(traefik_service_requests_total[3m])) by (service)
          * 100 > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Traefik 4xx 에러율 높음: {{ $labels.service }}'
          description: 'Traefik 서비스 {{ $labels.service }}의 4xx 에러율이 20%를
            초과했습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0013-traefik.md'

      - alert: TraefikHighHttp5xxErrorRateService
        expr: sum(rate(traefik_service_requests_total{code=~"5.*"}[3m])) by
          (service) / sum(rate(traefik_service_requests_total[3m])) by (service)
          * 100 > 5
        for: 5m
        labels:
          severity: critical
          domain: gateway
        annotations:
          summary: 'Traefik 5xx 에러율 높음: {{ $labels.service }}'
          description: 'Traefik 서비스 {{ $labels.service }}의 5xx 에러율이 5%를 초과했습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0013-traefik.md'
          dashboard_url: 'https://grafana.example.com/d/traefik'
