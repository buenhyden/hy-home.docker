groups:
  # ============================================================================
  # [11] Authentication (Keycloak)
  # ============================================================================
  - name: keycloak_alerts
    rules:
      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 2m
        labels:
          severity: critical
          domain: auth
        annotations:
          summary: 'Keycloak 다운'
          description: 'Keycloak 인증 서버가 응답하지 않습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0014-keycloak.md'
