groups:
  # ============================================================================
  # GPU (DCGM Exporter, opt-in `obs-gpu` profile)
  # ============================================================================
  # Every rule reads a DCGM metric, so the group stays silent while obs-gpu is
  # not selected. No per-target `up == 0` rule is added: the scrape job is
  # always configured and would alert whenever the opt-in profile is off.
  # Field availability depends on the GPU model; consumer GeForce cards may not
  # expose every field, so a silent rule is not proof of a healthy GPU.
  - name: gpu_alerts
    rules:
      # [What] GPU temperature sustained high / GPU 온도 지속 상승
      - alert: GpuTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 10m
        labels:
          severity: warning
          domain: gpu
        annotations:
          summary: 'GPU 온도 높음: GPU {{ $labels.gpu }}'
          description: "GPU {{ $labels.gpu }} ({{ $labels.modelName }}) 온도가 10분 이상 85°C를 넘었습니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0045-prometheus.md'

      # [What] GPU XID error reported / GPU XID 오류 발생
      - alert: GpuXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: critical
          domain: gpu
        annotations:
          summary: 'GPU XID 오류: GPU {{ $labels.gpu }}'
          description: "GPU {{ $labels.gpu }}가 XID {{ $value }}를 보고했습니다. 드라이버·하드웨어 상태를 확인하세요."
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0055-gpu-recovery.md'

      # [What] GPU framebuffer nearly full / GPU 메모리 부족
      - alert: GpuMemoryNearlyFull
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.95
        for: 15m
        labels:
          severity: warning
          domain: gpu
        annotations:
          summary: 'GPU 메모리 95% 초과: GPU {{ $labels.gpu }}'
          description: "GPU {{ $labels.gpu }} framebuffer 사용률이 15분 이상 95%를 넘었습니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0055-gpu-recovery.md'
