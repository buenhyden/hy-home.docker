groups:
  # ============================================================================
  # [1] Infrastructure (Container & cAdvisor)
  # ============================================================================
  - name: infrastructure_alerts
    rules:
      # [What] High CPU Usage / CPU 사용률 높음
      - alert: ContainerHighCpuUtilization
        expr: (sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name)
          /
          sum(container_spec_cpu_quota{name!=""}/container_spec_cpu_period{name!=""})
          by (name) * 100) > 90
        for: 15m
        labels:
          severity: warning
          domain: infrastructure
        annotations:
          summary: 'CPU 과부하 지속: {{ $labels.name }}'
          description: "{{ $labels.name }} 컨테이너가 CPU 90% 이상을 점유 중입니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0044-observability-optimization-hardening.md'

      # [What] High Memory Usage / 메모리 사용률 높음
      - alert: ContainerHighMemoryUsage
        expr: (sum(container_memory_working_set_bytes{name!=""}) BY (instance, name)
          / sum(container_spec_memory_limit_bytes > 0) BY (instance, name) *
          100) > 90
        for: 10m
        labels:
          severity: warning
          domain: infrastructure
        annotations:
          summary: '메모리 사용량 높음: {{ $labels.name }}'
          description: "{{ $labels.name }} 컨테이너가 메모리 리밋의 90% 이상을 사용 중입니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0044-observability-optimization-hardening.md'

      # [What] Container Memory Critical / 메모리 위험 수준
      - alert: ContainerMemoryCritical
        expr: (sum(container_memory_working_set_bytes{name!=""}) BY (instance, name)
          / sum(container_spec_memory_limit_bytes > 0) BY (instance, name) *
          100) > 95
        for: 10m
        labels:
          severity: critical
          domain: infrastructure
        annotations:
          summary: '메모리 부족 임박: {{ $labels.name }}'
          description: "{{ $labels.name }} 컨테이너가 메모리 리밋의 95% 이상을 사용 중입니다. OOM 위험이 있습니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0044-observability-optimization-hardening.md'

      # [What] Container Volume Usage High / 볼륨 사용량 높음
      - alert: ContainerVolumeUsage
        expr: (1 - (sum(container_fs_inodes_free{name!=""}) BY (instance) /
          sum(container_fs_inodes_total) BY (instance))) * 100 > 80
        for: 15m
        labels:
          severity: warning
          domain: infrastructure
        annotations:
          summary: '컨테이너 볼륨 사용량 높음: {{ $labels.instance }}'
          description: "컨테이너 볼륨 사용량이 80%를 초과했습니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0035-storage-exhaustion.md'

      # [What] Container CPU Throttled / CPU 쓰로틀링
      - alert: ContainerHighThrottleRate
        expr: |
          sum by (name) (increase(container_cpu_cfs_throttled_periods_total{name!=""}[5m]))
            / sum by (name) (increase(container_cpu_cfs_periods_total{name!=""}[5m])) > 0.25
        for: 10m
        labels:
          severity: warning
          domain: infrastructure
        annotations:
          summary: '컨테이너 CPU 쓰로틀링: {{ $labels.container }}'
          description: "컨테이너가 25% 이상 CPU 쓰로틀링되고 있습니다.\n  VALUE = {{ $value }}"
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0044-observability-optimization-hardening.md'

  # ============================================================================
  # [2] n8n Automation
  # ============================================================================
  - name: n8n_alerts
    rules:
      - alert: N8nLeaderMissing
        expr: max(n8n_instance_role_leader) < 1
        for: 5m
        labels:
          severity: critical
          domain: observability
        annotations:
          summary: 'n8n 리더 인스턴스 없음'
          description: 'n8n 리더가 감지되지 않습니다. (HA 구성/리더 선출/메트릭 노출 상태를 확인하세요.)'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0053-n8n.md'

  # ============================================================================
  # [3] Host backup and system disk (SPEC-0192)
  # ============================================================================
  - name: host_backup_alerts
    rules:
      # [What] No successful backup in 26 h / 26시간 동안 성공한 백업 없음
      # Only a run that exits 0 writes the timestamp, so a timeout, a preflight
      # stop or a timer that never fired all show up as staleness.
      - alert: HyhomeBackupStale
        expr: |
          time() - hyhome_backup_last_success_timestamp_seconds > 26 * 3600
            or absent(hyhome_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
          domain: backup
        annotations:
          summary: '26시간 넘게 성공한 야간 백업이 없음'
          description: 'hyhome-backup.service가 최근 26시간 동안 정상 종료하지 않았습니다. 타이머와 서비스 상태, journal의 상태 줄을 확인하세요.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0021-backup-and-restore.md'

      # [What] System disk under 25 GiB free / 시스템 디스크 여유 25GiB 미만
      # The backup refuses to start under 20 GiB free on this disk.
      - alert: HostSystemDiskLow
        expr: node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} < 25 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          domain: backup
        annotations:
          summary: '시스템 디스크 여유 공간 25GiB 미만'
          description: '/ 여유 공간이 {{ $value | humanize1024 }}B입니다. 20GiB 아래로 내려가면 야간 백업이 시작되지 않습니다. 쓰지 않는 Docker 이미지와 빌드 캐시를 먼저 확인하세요.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0021-backup-and-restore.md'
