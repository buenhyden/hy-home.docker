groups:
  # ============================================================================
  # [8] Search (OpenSearch)
  # ============================================================================
  # The OpenSearch prometheus-exporter plugin emits opensearch_* names; the
  # earlier rules used elasticsearch_exporter names and could never fire
  # (SPEC-0193). The series exist only while OpenSearch runs, so a stopped
  # on-demand cluster raises nothing.
  - name: OpenSearch_alerts
    rules:
      # opensearch_cluster_status: 0 green, 1 yellow, 2 red.
      - alert: OpenSearchHealthRed
        expr: max by (cluster) (opensearch_cluster_status{job="opensearch"}) == 2
        for: 3m
        labels:
          severity: critical
          domain: datastores
        annotations:
          summary: 'OpenSearch 클러스터 RED'
          description: '클러스터 {{ $labels.cluster }}의 primary shard 일부가 할당되지 않았습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0019-opensearch.md'

      - alert: OpenSearchClusterYellow
        expr: max by (cluster) (opensearch_cluster_status{job="opensearch"}) == 1
        for: 15m
        labels:
          severity: warning
          domain: datastores
        annotations:
          summary: 'OpenSearch 클러스터 YELLOW'
          description: '클러스터 {{ $labels.cluster }}의 replica shard 일부가 할당되지 않았습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0019-opensearch.md'

      - alert: OpenSearchHeapUsageHigh
        expr: |
          max by (node) (opensearch_jvm_mem_heap_used_bytes{job="opensearch"}
            / opensearch_jvm_mem_heap_committed_bytes{job="opensearch"}) > 0.9
        for: 5m
        labels:
          severity: critical
          domain: datastores
        annotations:
          summary: 'OpenSearch 힙 사용률 90% 초과'
          description: '노드 {{ $labels.node }}의 힙 사용률이 {{ $value | humanizePercentage }}입니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0019-opensearch.md'

      - alert: OpenSearchDiskSpaceLow
        expr: |
          min by (node) (opensearch_fs_path_free_bytes{job="opensearch"}
            / opensearch_fs_path_total_bytes{job="opensearch"}) < 0.2
        for: 15m
        labels:
          severity: warning
          domain: datastores
        annotations:
          summary: 'OpenSearch 데이터 디스크 여유 20% 미만'
          description: '노드 {{ $labels.node }}의 여유 공간이 {{ $value | humanizePercentage }}입니다. 10% 아래에서는 watermark로 쓰기가 막힐 수 있습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0019-opensearch.md'

      - alert: OpenSearchUnassignedShards
        expr: sum by (cluster) (opensearch_cluster_shards_number{job="opensearch", type="unassigned"}) > 0
        for: 15m
        labels:
          severity: critical
          domain: datastores
        annotations:
          summary: 'OpenSearch 미할당 shard 존재'
          description: '클러스터 {{ $labels.cluster }}에 할당되지 않은 shard가 {{ $value }}개 있습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0019-opensearch.md'
