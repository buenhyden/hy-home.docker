groups:
  - name: vault_rules
    rules:
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Vault sealed (instance {{ $labels.instance }})
          description:
            "Vault instance is sealed on {{ $labels.instance }}\n  VALUE = {{
            $value }}\n  LABELS = {{ $labels }}"
      - alert: VaultTooManyPendingTokens
        expr: avg(vault_token_create_count - vault_token_store_count) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary:
            Vault too many pending tokens (instance {{ $labels.instance }})
          description:
            "Too many pending tokens {{ $labels.instance }}: {{ $value | printf
            \"%.2f\"}}%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: VaultTooManyInfinityTokens
        expr: vault_token_count_by_ttl{creation_ttl="+Inf"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary:
            Vault too many infinity tokens (instance {{ $labels.instance }})
          description:
            "Too many infinity tokens {{ $labels.instance }}: {{ $value | printf
            \"%.2f\"}}%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: VaultClusterHealth
        expr: sum(vault_core_active) / count(vault_core_active) <= 0.5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Vault cluster health (instance {{ $labels.instance }})
          description:
            "Vault cluster is not healthy {{ $labels.instance }}: {{ $value |
            printf \"%.2f\"}}%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      # The scrape uses a finite-TTL metrics token (secrets/security/openbao_token.txt).
      # A lapsed token makes every OpenBao series vanish, so the alerts above go
      # silent; this one fires instead. Rotate the token (OpenBao runbook).
      # It also fires while OpenBao is sealed or down: the authenticated scrape
      # fails then too, so VaultSealed cannot fire and this is the seal signal.
      - alert: OpenBaoMetricsScrapeFailing
        expr: up{job="openbao"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: OpenBao metrics scrape failing (instance {{ $labels.instance }})
          description:
            "Prometheus cannot scrape OpenBao sys/metrics on {{ $labels.instance
            }}. Check that OpenBao is unsealed, then whether the metrics token
            expired; rotate it per the OpenBao runbook."
