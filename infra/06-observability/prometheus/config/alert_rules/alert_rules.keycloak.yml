# Keycloak 26 alert rules (SPEC-0193). User-event metrics come from
# KC_EVENT_METRICS_USER_ENABLED (keycloak_user_events_total{event, error});
# request latency from KC_HTTP_METRICS_HISTOGRAMS_ENABLED. The earlier rules
# used Keycloak 2x extension names that this version never emits.
groups:
  - name: keycloak_rules
    rules:
      # More than 5% of logins failing may be brute force or a broken client.
      - alert: KeycloakHighLoginFailureRate
        expr: |
          sum by (realm) (rate(keycloak_user_events_total{event="login", error!=""}[5m]))
            / sum by (realm) (rate(keycloak_user_events_total{event="login"}[5m])) > 0.05
          and sum by (realm) (rate(keycloak_user_events_total{event="login"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: 'Keycloak 로그인 실패율 5% 초과 (realm {{ $labels.realm }})'
          description: 'realm {{ $labels.realm }}의 로그인 중 {{ $value | humanizePercentage }}가 실패합니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0014-keycloak.md'

      - alert: KeycloakHighTokenRefreshErrorRate
        expr: |
          sum by (realm) (rate(keycloak_user_events_total{event="refresh_token", error!=""}[5m]))
            / sum by (realm) (rate(keycloak_user_events_total{event="refresh_token"}[5m])) > 0.1
          and sum by (realm) (rate(keycloak_user_events_total{event="refresh_token"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: 'Keycloak 토큰 갱신 오류율 10% 초과 (realm {{ $labels.realm }})'
          description: 'realm {{ $labels.realm }}의 토큰 갱신 중 {{ $value | humanizePercentage }}가 실패합니다. 세션 만료나 캐시 문제를 확인하세요.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0014-keycloak.md'

      - alert: KeycloakHighCodeToTokenErrorRate
        expr: |
          sum by (realm) (rate(keycloak_user_events_total{event="code_to_token", error!=""}[5m]))
            / sum by (realm) (rate(keycloak_user_events_total{event="code_to_token"}[5m])) > 0.1
          and sum by (realm) (rate(keycloak_user_events_total{event="code_to_token"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: 'Keycloak code-to-token 교환 오류율 10% 초과 (realm {{ $labels.realm }})'
          description: 'OIDC 클라이언트의 code 교환 중 {{ $value | humanizePercentage }}가 실패합니다. 클라이언트 secret과 redirect URI를 확인하세요.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0014-keycloak.md'

      - alert: KeycloakSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="keycloak"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
          domain: auth
        annotations:
          summary: 'Keycloak p95 응답 시간 2초 초과'
          description: 'Keycloak HTTP 요청의 p95가 {{ $value | humanizeDuration }}입니다. DB 연결과 캐시를 확인하세요.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/0014-keycloak.md'
