# Prometheus scrape and rule configuration (SPEC-0193).
# prometheus.yml and prometheus.dev.yml carry the same jobs; Compose selects
# one through PROMETHEUS_CONFIG_FILE. Every target carries cluster="hy-home"
# and namespace="hy-home" so upstream mixin dashboards select it unchanged.
# Each source is scraped by exactly one job. Jobs marked on-demand belong to
# OPTIONAL services; independent LAB projects are not joined to this network.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: dev
    stack: hy-homedocker

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert_rules/alert_rules.local.*.yml"
  - "/etc/prometheus/alert_rules/alert_rules.keycloak.yml"
  - "/etc/prometheus/alert_rules/alert_rules.openbao.yml"
  - "/etc/prometheus/alert_rules/recording_rules*.yml"

scrape_configs:

  # ============================================================================
  # HOST AND CONTAINERS
  # ============================================================================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "host"

  - job_name: "cadvisor"
    scrape_interval: 1m
    scrape_timeout: 50s
    metric_relabel_configs:
      - source_labels: [id]
        regex: "^/$"
        action: drop
      - action: labeldrop
        regex: "container_label_com_docker_compose_(config_hash|project_working_dir|project_config_files|replace|container_number|oneoff|version|depends_on)"
      - action: labeldrop
        regex: "container_label_desktop_docker_io_ports_scheme"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "host"

  - job_name: "dcgm-exporter"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "gpu"

  # ============================================================================
  # OBSERVABILITY
  # ============================================================================
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  # The Alloy mixin dashboards query native histograms; classic buckets stay for rules.
  - job_name: "alloy"
    scrape_native_histograms: true
    always_scrape_classic_histograms: true
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "pyroscope"
    static_configs:
      - targets: ["pyroscope:4040"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  - job_name: "gatus"
    metrics_path: /metrics
    static_configs:
      - targets: ["gatus:8080"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "observability"

  # ============================================================================
  # GATEWAY, AUTH AND SECURITY
  # ============================================================================
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "gateway"

  - job_name: "keycloak"
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "auth"
          container: "keycloak"

  - job_name: "oauth2-proxy"
    static_configs:
      - targets: ["oauth2-proxy:44180"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "auth"

  - job_name: "openbao"
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    bearer_token_file: /run/secrets/openbao_token
    static_configs:
      - targets: ["openbao:8200"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "security"

  # ============================================================================
  # DATASTORES
  # ============================================================================
  # db_scope separates the MNG and DEV servers and db_engine the engine; the
  # exporters' own metric names (pg_*, redis_*) are kept. The DEV targets are
  # rendered at start by prometheus/scripts/start.sh with expected_state from
  # PROMETHEUS_DEV_DATA_EXPECTED, so an intentional DEV stop is not an alert.
  - job_name: "manage-postgres"
    static_configs:
      - targets: ["mng-pg-exporter:9187"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"
          db_scope: "mng"
          db_engine: "postgresql"
          expected_state: "on"

  - job_name: "mng-valkey-exporter"
    static_configs:
      - targets: ["mng-valkey-exporter:9121"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"
          db_scope: "mng"
          db_engine: "valkey"
          expected_state: "on"

  - job_name: "dev-pg-exporter"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/dev-pg-exporter.yml"]

  - job_name: "dev-valkey-exporter"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/dev-valkey-exporter.yml"]

  - job_name: "qdrant"
    metrics_path: /metrics
    bearer_token_file: /run/secrets/qdrant_read_only_api_key
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "seaweedfs-s3"
    static_configs:
      - targets: ["seaweedfs-s3:9327"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "seaweedfs-master"
    static_configs:
      - targets: ["seaweedfs-master:9324"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "seaweedfs-volume"
    static_configs:
      - targets: ["seaweedfs-volume:9325"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "seaweedfs-filer"
    static_configs:
      - targets: ["seaweedfs-filer:9326"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "registry"
    static_configs:
      - targets: ["registry:5001"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "tooling"

  # ============================================================================
  # WORKFLOW AND AI
  # ============================================================================
  # Airflow statsd metrics; the former duplicate airflow-exporter job is removed.
  - job_name: "airflow-monitor"
    static_configs:
      - targets: ["airflow-statsd-exporter:9102"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "workflow"

  - job_name: "flower"
    static_configs:
      - targets: ["flower:5555"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "workflow"

  - job_name: "n8n-monitor"
    static_configs:
      - targets: ["n8n:5678"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "workflow"

  - job_name: "ollama-exporter"
    static_configs:
      - targets: ["ollama-exporter:8000"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "ai"

  # ============================================================================
  # ON-DEMAND (OPTIONAL services; down while stopped)
  # ============================================================================
  # Job names kafka-broker, kafka-connect and schema-registry match the Confluent dashboards.
  - job_name: "kafka-broker"
    static_configs:
      - targets: ["kafka-1:9404"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "messaging"
          env: "hy-home"

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "messaging"

  - job_name: "kafka-connect"
    static_configs:
      - targets: ["kafka-connect:9404"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "messaging"
          env: "hy-home"
          kafka_connect_cluster_id: "kafka-connect-cluster"

  - job_name: "schema-registry"
    static_configs:
      - targets: ["schema-registry:9404"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "messaging"
          env: "hy-home"

  - job_name: "airflow-valkey-exporter"
    static_configs:
      - targets: ["airflow-valkey-exporter:9121"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "n8n-valkey-exporter"
    static_configs:
      - targets: ["n8n-valkey-exporter:9121"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "oauth2-proxy-valkey-exporter"
    static_configs:
      - targets: ["oauth2-proxy-valkey-exporter:9121"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"

  - job_name: "opensearch"
    metrics_path: "/_prometheus/metrics"
    scheme: https
    basic_auth:
      username: "exporter"
      password_file: "/run/secrets/opensearch_exporter_password"
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["opensearch:9200"]
        labels:
          cluster: "hy-home"
          namespace: "hy-home"
          domain: "datastores"
