global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: dev
    stack: hy-homedocker

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert_rules/alert_rules.local.*.yml"
  - "/etc/prometheus/alert_rules/alert_rules.keycloak.yml"
  - "/etc/prometheus/alert_rules/alert_rules.vault.yml"
  - "/etc/prometheus/alert_rules/recording_rules.yml"

scrape_configs:
  # ============================================================================
  # CORE SERVICES
  # ============================================================================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm-exporter"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          domain: "gpu"

  - job_name: "gatus"
    metrics_path: /metrics
    static_configs:
      - targets: ["gatus:8080"]

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

  # ============================================================================
  # INFRASTRUCTURE & OBSERVABILITY
  # ============================================================================
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: "cadvisor"
    scrape_interval: 1m
    scrape_timeout: 50s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [id]
        regex: "^/$"
        action: drop
      - action: labeldrop
        regex: "container_label_com_docker_compose_(config_hash|project_working_dir|project_config_files|replace|container_number|oneoff|version|depends_on)"
      - action: labeldrop
        regex: "container_label_desktop_docker_io_ports_scheme"

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # ============================================================================
  # DATASTORES
  # ============================================================================

  - job_name: "manage-postgres"
    static_configs:
      - targets: ["mng-pg-exporter:9187"]
        labels:
          domain: "datastores"

  - job_name: "mng-valkey-exporter"
    static_configs:
      - targets: ["mng-valkey-exporter:9121"]
        labels:
          domain: "datastores"

  - job_name: "qdrant"
    metrics_path: /metrics
    bearer_token_file: /run/secrets/qdrant_read_only_api_key
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          domain: "datastores"

  - job_name: "seaweedfs-s3"
    static_configs:
      - targets: ["seaweedfs-s3:9327"]
        labels:
          domain: "datastores"

  - job_name: "opensearch"
    metrics_path: "/_prometheus/metrics"
    scheme: https
    static_configs:
      - targets: ["opensearch:9200"]
        labels:
          domain: "datastores"
    basic_auth:
      username: "exporter"
      password_file: "/run/secrets/opensearch_exporter_password"
    tls_config:
      insecure_skip_verify: true


  # ============================================================================
  # MESSAGING
  # ============================================================================
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-1:9404"]
        labels:
          domain: "messaging"

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          domain: "messaging"

  # ============================================================================
  # APPLICATIONS
  # ============================================================================
  - job_name: "keycloak"
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          domain: "auth"

  - job_name: "n8n-monitor"
    static_configs:
      - targets: ["n8n:5678"]
        labels:
          domain: "workflow"

  - job_name: "airflow-monitor"
    static_configs:
      - targets: ["airflow-statsd-exporter:9102"]
        labels:
          domain: "workflow"

  - job_name: "airflow-exporter"
    static_configs:
      - targets: ["airflow-statsd-exporter:9102"]
        labels:
          domain: "workflow"

  - job_name: "openbao"
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    scheme: http
    bearer_token_file: /run/secrets/openbao_token
    static_configs:
      - targets:
          - "openbao:8200"

  - job_name: "ollama-exporter"
    static_configs:
      - targets: ["ollama-exporter:8000"]
