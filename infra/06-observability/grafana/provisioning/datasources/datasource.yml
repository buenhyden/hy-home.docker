apiVersion: 1

# The Pyroscope datasource was first provisioned without a UID; Grafana cannot
# move an existing datasource to a new UID in place, so it is deleted by name
# and created again with the fixed UID (SPEC-0193).
deleteDatasources:
  - name: Pyroscope
    orgId: 1

# Datasource identities are fixed UIDs; dashboards reference these UIDs or a
# datasource variable (POL-0041). Cross-signal links (SPEC-0193):
#   metrics --exemplar traceID--> traces
#   logs    --trace ID field---> traces
#   traces  --service.name-----> logs, metrics (span metrics), profiles
# `$$` escapes Grafana's environment expansion in provisioning files.

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Equal to the scrape interval, so $__rate_interval covers four samples.
      timeInterval: 30s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
      cacheLevel: Medium
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      exemplarTraceIdDestinations:
        # Tempo's metrics generator attaches exemplars labelled traceID.
        - name: traceID
          datasourceUid: Tempo

  - name: Loki
    type: loki
    uid: Loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '(?:traceID|trace_id|traceId|TraceId)["=:\s]+"?([0-9a-fA-F]{16,32})'
          url: '$${__value.raw}'
          datasourceUid: Tempo
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: Tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: Loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        # Alloy labels container logs with service_name (the Compose service).
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: Prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[5m]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le)(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
      tracesToProfiles:
        datasourceUid: Pyroscope
        tags:
          - key: service.name
            value: service_name
        profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
      serviceMap:
        datasourceUid: Prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
      streamingEnabled:
        search: true
        metrics: true

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      # Prometheus rules only; Grafana-managed alerts are not used.
      handleGrafanaManagedAlerts: false

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: Pyroscope
    access: proxy
    url: http://pyroscope:4040
    jsonData:
      minStep: 15s

  # Read-only SQL datasources for the n8n and Airflow dashboards. The role is
  # created by grafana-db-provision with SELECT on named tables only, and
  # every session is read-only with a 30 s statement timeout.
  - name: n8n DB
    type: grafana-postgresql-datasource
    uid: n8n-db
    url: mng-pg:5432
    user: ${GRAFANA_DB_READER_USER}
    jsonData:
      database: n8n
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
    secureJsonData:
      password: $__file{/run/secrets/grafana_reader_password}

  - name: Airflow DB
    type: grafana-postgresql-datasource
    uid: airflow-db
    url: mng-pg:5432
    user: ${GRAFANA_DB_READER_USER}
    jsonData:
      database: airflow
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
    secureJsonData:
      password: $__file{/run/secrets/grafana_reader_password}
