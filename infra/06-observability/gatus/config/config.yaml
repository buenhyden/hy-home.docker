metrics: true

storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: Hy Home Status
  header: Hy Home Infrastructure

endpoints:
  - name: Prometheus
    group: observability
    url: http://infra-prometheus:9090/-/ready
    interval: 30s
    conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 1000'

  - name: Grafana
    group: observability
    url: http://infra-grafana:3000/api/health
    interval: 30s
    conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 1000'

  - name: Alloy
    group: observability
    url: http://infra-alloy:12345/-/healthy
    interval: 30s
    conditions:
      - '[STATUS] == 200'

  - name: Keycloak
    group: core
    url: http://keycloak:9000/health/ready
    interval: 30s
    conditions:
      - '[STATUS] == 200'

  - name: OAuth2 Proxy
    group: core
    url: http://oauth2-proxy:4180/ping
    interval: 30s
    conditions:
      - '[STATUS] == 200'

  - name: Management PostgreSQL
    group: data
    url: tcp://mng-pg:5432
    interval: 30s
    conditions:
      - '[CONNECTED] == true'

  - name: Management Valkey
    group: data
    url: tcp://mng-valkey:6379
    interval: 30s
    conditions:
      - '[CONNECTED] == true'