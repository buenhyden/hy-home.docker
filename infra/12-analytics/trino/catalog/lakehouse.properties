# Iceberg tables in the SeaweedFS REST catalog (`lakehouse` table bucket).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:LAKEHOUSE_CATALOG_URI}
iceberg.rest-catalog.warehouse=s3://lakehouse/
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.signing-name=s3
# SeaweedFS serves no Iceberg view endpoints; listing tables fails without this.
iceberg.rest-catalog.view-endpoints-enabled=false
fs.native-s3.enabled=true
s3.endpoint=${ENV:LAKEHOUSE_S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
