x-tier-label: &tier-label
  hy-home.tier: security

volumes:
  openbao-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_SECURITY_DIR}/openbao/data
  openbao-agent-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_SECURITY_DIR}/openbao/agent
  openbao-agent-out:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_SECURITY_DIR}/openbao/out

  openbao-audit:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_SECURITY_DIR}/openbao/audit

services:
  openbao:
    profiles:
      - security
      - secrets
      - core
      - local
      - dev
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    image: openbao/openbao:2.6.2
    container_name: openbao
    hostname: openbao
    # Writes a data directory owned by the host group (common-optimizations.exceptions.json).
    group_add:
      - '${SECRETS_GID:-1000}'
    restart: unless-stopped
    expose:
      - '${OPENBAO_PORT:-8200}'
      - '${OPENBAO_CLUSTER_PORT:-8201}'
    environment:
      BAO_ADDR: 'https://127.0.0.1:${OPENBAO_PORT:-8200}'
      BAO_API_ADDR: 'https://openbao:${OPENBAO_PORT:-8200}'
      BAO_CLUSTER_ADDR: 'https://openbao:${OPENBAO_CLUSTER_PORT:-8201}'
      BAO_CACERT: /openbao/tls/ca.pem
      BAO_TLS_SERVER_NAME: openbao
      OPENBAO_PORT: '${OPENBAO_PORT:-8200}'
      OPENBAO_CLUSTER_PORT: '${OPENBAO_CLUSTER_PORT:-8201}'
      BAO_LOCAL_CONFIG: >-
        {"ui":true,"disable_mlock":true, "storage":{"raft":{"path":"/openbao/data","node_id":"openbao-node1"}}, "listener":[{"tcp":{"address":"0.0.0.0:${OPENBAO_PORT:-8200}", "cluster_address":"0.0.0.0:${OPENBAO_CLUSTER_PORT:-8201}","tls_disable":false,"disable_unauthed_rekey_endpoints":true,"disable_unauthed_generate_root_endpoints":true,"tls_min_version":"tls12","tls_cert_file":"/openbao/tls/server.pem","tls_key_file":"/openbao/tls/server-key.pem"}}], "api_addr":"https://openbao:${OPENBAO_PORT:-8200}", "cluster_addr":"https://openbao:${OPENBAO_CLUSTER_PORT:-8201}", "unsafe_allow_api_audit_creation":false,"audit":[{"type":"file","path":"p01-file","options":{"file_path":"/openbao/audit/audit.json","mode":"0600","log_raw":"false","hmac_accessor":"true"}}], "telemetry":{"disable_hostname":true,"prometheus_retention_time":"24h"}}
    volumes:
      - openbao-data:/openbao/data:rw
      - openbao-audit:/openbao/audit:rw
      - ./scripts:/openbao/scripts:ro
      # Bootstrap material comes from external custody, never this OpenBao.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/tls/ca.pem
        target: /openbao/tls/ca.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/tls/server.pem
        target: /openbao/tls/server.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/tls/server-key.pem
        target: /openbao/tls/server-key.pem
        read_only: true
        bind: {create_host_path: false}
    entrypoint: ['/bin/sh', '/openbao/scripts/start-server.sh']
    command:
      - server
    networks:
      edge_net: {}
      secrets_net: {}
      obs_net: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'bao status >/dev/null 2>&1' ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.openbao.rule: Host(`openbao.${DEFAULT_URL}`)
      traefik.http.routers.openbao.entrypoints: websecure
      traefik.http.routers.openbao.tls: 'true'
      traefik.http.routers.openbao.middlewares: gateway-standard-chain@file
      traefik.http.services.openbao.loadbalancer.server.scheme: https
      traefik.http.services.openbao.loadbalancer.serverstransport: openbao-tls@file
      traefik.http.services.openbao.loadbalancer.server.port: ${OPENBAO_PORT:-8200}

  openbao-agent:
    profiles:
      - security
      - secrets
      - core
      - local
      - dev
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    image: openbao/openbao:2.6.2
    container_name: openbao-agent
    hostname: openbao-agent
    # Writes a data directory owned by the host group (common-optimizations.exceptions.json).
    group_add:
      - '${SECRETS_GID:-1000}'
    restart: unless-stopped
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: 'https://openbao:${OPENBAO_PORT:-8200}'
      VAULT_ADDR: 'https://openbao:${OPENBAO_PORT:-8200}'
      BAO_CACERT: /openbao/tls/ca.pem
      VAULT_CACERT: /openbao/tls/ca.pem
    volumes:
      - ./scripts:/openbao/scripts:ro
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/tls/ca.pem
        target: /openbao/tls/ca.pem
        read_only: true
        bind: {create_host_path: false}
      - ./config/agent.hcl:/openbao/config/agent.hcl:ro
      - ./config/templates:/openbao/config/templates:ro
      - openbao-agent-data:/openbao/agent:rw
      - openbao-agent-out:/openbao/out:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    entrypoint: ['/bin/sh', '/openbao/scripts/start-agent.sh']
    healthcheck:
      test: [ 'CMD', '/bin/sh', '/openbao/scripts/health-agent.sh' ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 20s
    networks:
      secrets_net: {}
    labels:
      <<: *tier-label
