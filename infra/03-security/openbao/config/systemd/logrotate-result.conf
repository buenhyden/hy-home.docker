# SPEC-0204 TSK-0006 W6: drop-in for the host's logrotate.service, installed by
# the owner as /etc/systemd/system/logrotate.service.d/result.conf (root 0644).
# ExecStopPost runs after every run, success or failure, and writes the outcome
# into the node-exporter textfile directory. A failing rule, such as the OpenBao
# audit postrotate HUP, makes logrotate exit non-zero and the run "exit-code".
# systemd reads $$ as $ and %% as %; the file is replaced atomically.
[Service]
ExecStopPost=/bin/sh -c 'ok=0; [ "$$SERVICE_RESULT" = success ] && ok=1; d=/home/hyunyoun/backups/metrics; t="$$d/.hyhome_logrotate.prom.$$$$"; printf "hyhome_logrotate_last_run_success %%s\nhyhome_logrotate_last_run_timestamp_seconds %%s\n" "$$ok" "$$(date +%%s)" > "$$t" && chmod 0644 "$$t" && mv -f "$$t" "$$d/hyhome_logrotate.prom"'
