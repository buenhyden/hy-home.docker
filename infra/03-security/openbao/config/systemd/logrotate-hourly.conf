# SPEC-0243 W6: drop-in for the host's existing logrotate.timer, installed by
# the owner as /etc/systemd/system/logrotate.timer.d/hourly.conf (root 0644).
# It only changes when the one logrotate.service runs, so every rule keeps the
# shared /etc/logrotate.conf, state file and unit lock; `daily` rules still
# rotate once a day, while the OpenBao audit `maxsize` is checked every hour.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=5m
