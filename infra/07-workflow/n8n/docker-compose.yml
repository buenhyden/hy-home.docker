x-tier-label: &tier-label
  hy-home.tier: workflow

x-n8n-common-env: &n8n-common-env
  GENERIC_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Seoul}
  TZ: ${DEFAULT_TIMEZONE:-Asia/Seoul}
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: ${POSTGRES_MNG_HOSTNAME}
  DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${N8N_DB_USER}
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
  EXECUTIONS_MODE: queue
  # Smaller than n8n's 16 MiB default; bounds Zod array parsing (GHSA-mrhx-c7xc-m3w5).
  N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-4}
  N8N_VALKEY_HOST: ${N8N_VALKEY_HOST:-mng-valkey}
  N8N_VALKEY_USERNAME: ${N8N_VALKEY_USERNAME:-}
  N8N_VALKEY_SECRET: ${N8N_VALKEY_SECRET:-mng_valkey_password}
  N8N_VALKEY_DB: ${N8N_VALKEY_DB:-0}
  QUEUE_BULL_REDIS_HOST: ${N8N_VALKEY_HOST:-mng-valkey}
  QUEUE_BULL_REDIS_USERNAME: ${N8N_VALKEY_USERNAME:-}
  QUEUE_BULL_REDIS_PORT: ${VALKEY_PORT:-6379}
  QUEUE_BULL_REDIS_DB: ${N8N_VALKEY_DB:-0}
  QUEUE_BULL_PREFIX: n8n
  N8N_REDIS_KEY_PREFIX: n8n
  QUEUE_BULL_REDIS_PASSWORD_FILE: /run/secrets/${N8N_VALKEY_SECRET:-mng_valkey_password}

  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  # The alias must move the listener, not only the URI, expose and healthcheck.
  N8N_RUNNERS_BROKER_PORT: ${N8N_BROKER_PORT:-5679}
  N8N_NATIVE_PYTHON_RUNNER: true
  N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runner_auth_token
  N8N_RUNNERS_TASK_TIMEOUT: 300
  # A cold runner start here took ~40 s, past the 30 s default grant.
  N8N_RUNNERS_GRANT_TOKEN_TTL: ${N8N_RUNNERS_GRANT_TOKEN_TTL:-120}

  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
  N8N_BLOCK_ENV_ACCESS_IN_NODE: true
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: true

volumes:
  n8n-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n
  n8n-valkey-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n-valkey
  # Detached rollback/data identities. The read-only runners no longer mount
  # these paths; keeping the declarations does not delete existing host data.
  n8n-task-runner-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n-task-runner
  n8n-task-runner-worker-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n-task-runner-worker

services:
  n8n:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    build:
      context: .
      dockerfile: ${N8N_DOCKERFILE:-dev.Dockerfile}
      args:
        N8N_VERSION: 2.43.6
    image: hyhome/n8n:2.43.6-local
    container_name: n8n
    hostname: n8n
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    expose:
      - ${N8N_PORT:-5678}
      - ${N8N_BROKER_PORT:-5679}
    secrets:
      - ${N8N_VALKEY_SECRET:-mng_valkey_password}
      - n8n_db_password
      - n8n_encryption_key
      - n8n_runner_auth_token
    volumes:
      - n8n-data:/home/node/.n8n:rw
      - ./custom:/home/node/.n8n/custom:ro
    environment:
      <<: *n8n-common-env
      N8N_PROXY_HOPS: 1
      N8N_PROTOCOL: https
      N8N_HOST: n8n.${DEFAULT_URL}
      N8N_PORT: ${N8N_PORT:-5678}
      WEBHOOK_URL: https://n8n.${DEFAULT_URL}/
      N8N_PUSH_BACKEND: websocket
      N8N_PUBLIC_API_DISABLED: false
      N8N_API_KEY_GENERATED_ENABLED: true
      N8N_EDITOR_BASE_URL: https://n8n.${DEFAULT_URL}
      N8N_PUBLIC_API_BASE_URL: https://n8n.${DEFAULT_URL}
      N8N_METRICS: true
      N8N_METRICS_PREFIX: n8n_
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: true
      N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: true
      N8N_METRICS_INCLUDE_QUEUE_METRICS: true
      QUEUE_HEALTH_CHECK_ACTIVE: true
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.n8n.rule: Host(`n8n.${DEFAULT_URL}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
      traefik.http.routers.n8n.tls: 'true'
      traefik.http.routers.n8n.service: n8n
      traefik.http.services.n8n.loadbalancer.server.port: ${N8N_PORT:-5678}
    networks:
      edge_net: {}
      n8n_net: {}
      n8n_main_runner_net: {}
      mng_data_net: {}
      obs_net: {}
    healthcheck:
      # Readiness fails while the database connection is lost; /healthz stayed
      # green through six hours of 503s on 2026-09-29 (SPEC-0192).
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${N8N_PORT:-5678}/healthz/readiness || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Startup took about 5.5 minutes under host load on 2026-10-27.
      start_period: 300s

  n8n-worker:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    build:
      context: .
      dockerfile: ${N8N_DOCKERFILE:-dev.Dockerfile}
      args:
        N8N_VERSION: 2.43.6
    image: hyhome/n8n:2.43.6-local
    container_name: n8n-worker
    hostname: n8n-worker
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    expose:
      - ${N8N_PORT:-5678}
      - ${N8N_BROKER_PORT:-5679}
    depends_on:
      n8n: { condition: service_healthy }
      n8n-valkey: { condition: service_healthy, required: false }
    volumes:
      - n8n-data:/home/node/.n8n:rw
      - ./custom:/home/node/.n8n/custom:ro
    environment:
      <<: *n8n-common-env
    secrets:
      - ${N8N_VALKEY_SECRET:-mng_valkey_password}
      - n8n_db_password
      - n8n_encryption_key
      - n8n_runner_auth_token
    networks:
      n8n_net: {}
      n8n_worker_runner_net: {}
      mng_data_net: {}
      # Production webhook executions run here; the only Gateway peer.
      n8n_blog_ingest_net: {}
    command: worker
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://127.0.0.1:${N8N_BROKER_PORT:-5679}/healthz || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    labels:
      <<: *tier-label

  n8n-task-runner:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    image: n8nio/runners:2.43.6@sha256:3168a82b29b3a8ec9acbe876d9e654b3333dfd630b257f6cc2bc81fc5f93b2bf
    container_name: n8n-task-runner
    hostname: n8n-task-runner
    user: '1000:1000'
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: true
    depends_on:
      n8n: { condition: service_healthy }
      n8n-valkey: { condition: service_healthy, required: false }
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:${N8N_BROKER_PORT:-5679}
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_RUNNERS_MAX_CONCURRENCY: 1
      # Keep the runner up after its first task; a daily run would otherwise start cold.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 0
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: ${N8N_TASK_RUNNER_PORT:-5680}
    entrypoint: [tini, --, /bin/sh, -ec]
    command:
      - |
        [ -s /run/secrets/n8n_runner_auth_token ] || { echo 'n8n runner token missing' >&2; exit 1; }
        N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/n8n_runner_auth_token)"
        [ -n "$$N8N_RUNNERS_AUTH_TOKEN" ] || { echo 'n8n runner token empty' >&2; exit 1; }
        export N8N_RUNNERS_AUTH_TOKEN
        exec /usr/local/bin/task-runner-launcher javascript python
    expose:
      - ${N8N_TASK_RUNNER_PORT:-5680}
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=1000,gid=1000
    networks:
      n8n_main_runner_net: {}
    secrets:
      - n8n_runner_auth_token
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${N8N_TASK_RUNNER_PORT:-5680}/healthz || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      <<: *tier-label

  n8n-task-runner-worker:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    image: n8nio/runners:2.43.6@sha256:3168a82b29b3a8ec9acbe876d9e654b3333dfd630b257f6cc2bc81fc5f93b2bf
    container_name: n8n-task-runner-worker
    hostname: n8n-task-runner-worker
    user: '1000:1000'
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: true
    depends_on:
      n8n-worker: { condition: service_healthy }
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:${N8N_BROKER_PORT:-5679}
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_RUNNERS_MAX_CONCURRENCY: 1
      # Keep the runner up after its first task; a daily run would otherwise start cold.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 0
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: ${N8N_TASK_RUNNER_PORT:-5680}
    entrypoint: [tini, --, /bin/sh, -ec]
    command:
      - |
        [ -s /run/secrets/n8n_runner_auth_token ] || { echo 'n8n runner token missing' >&2; exit 1; }
        N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/n8n_runner_auth_token)"
        [ -n "$$N8N_RUNNERS_AUTH_TOKEN" ] || { echo 'n8n runner token empty' >&2; exit 1; }
        export N8N_RUNNERS_AUTH_TOKEN
        exec /usr/local/bin/task-runner-launcher javascript python
    networks:
      n8n_worker_runner_net: {}
    expose:
      - ${N8N_TASK_RUNNER_PORT:-5680}
    secrets:
      - n8n_runner_auth_token
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=1000,gid=1000
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${N8N_TASK_RUNNER_PORT:-5680}/healthz || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      <<: *tier-label

  n8n-valkey:
    profiles:
      - dedicated-valkey
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    image: valkey/valkey:9.1.2-alpine
    container_name: n8n-valkey
    hostname: n8n-valkey
    group_add:
      - '${SECRETS_GID:-1000}'
    user: '999:999'
    networks:
      n8n_net: {}
    secrets:
      - n8n_valkey_password
    environment:
      VALKEY_PORT: '${VALKEY_PORT:-6379}'
    restart: unless-stopped
    volumes:
      - n8n-valkey-data:/data:rw
      - ../../04-data/mng-db/valkey/scripts/start-dedicated.sh:/usr/local/lib/hy-home/valkey/start-dedicated.sh:ro
      - ../../04-data/mng-db/valkey/scripts/render-monitor-acl.sh:/usr/local/lib/hy-home/valkey/render-monitor-acl.sh:ro
    tmpfs:
      - /run/valkey:rw,noexec,nosuid,nodev,mode=0700,uid=999,gid=999
    command:
      - /bin/sh
      - /usr/local/lib/hy-home/valkey/start-dedicated.sh
      - /run/secrets/n8n_valkey_password
      - /run/valkey/users.acl
    expose:
      - '${VALKEY_PORT:-6379}'
    healthcheck:
      test: [ 'CMD-SHELL', 'REDISCLI_AUTH=$$(cat /run/secrets/n8n_valkey_password); export REDISCLI_AUTH; valkey-cli --no-auth-warning -h 127.0.0.1 -p "$${VALKEY_PORT}" ping | grep -qx PONG' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label

  n8n-valkey-exporter:
    profiles:
      - dedicated-valkey
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-low
    image: oliver006/redis_exporter:v1.93.0-alpine@sha256:93831cd4d5d67687de67c9d5221b14312fea580af8d157583ed9d4459bf2dd70
    container_name: n8n-valkey-exporter
    hostname: n8n-valkey-exporter
    group_add:
      - '${SECRETS_GID:-1000}'
    healthcheck:
      test: [ 'CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9121/metrics' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    networks:
      n8n_net: {}
      obs_net: {}
    tmpfs:
      - /tmp
    expose:
      - '${VALKEY_EXPORTER_PORT:-9121}'
    restart: unless-stopped
    secrets:
      - n8n_valkey_password
    environment:
      VALKEY_PORT: '${VALKEY_PORT:-6379}'
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        port=$${VALKEY_PORT}
        case "$$port" in ''|*[!0-9]*) exit 1 ;; esac
        [ "$${#port}" -le 5 ] && [ "$$port" -ge 1 ] && [ "$$port" -le 65535 ] || exit 1
        REDIS_PASSWORD=$$(cat /run/secrets/n8n_valkey_password)
        [ -n "$$REDIS_PASSWORD" ] || exit 1
        export REDIS_PASSWORD
        exec /redis_exporter \
          -redis.addr="redis://n8n-valkey:$$port" \
          -web.listen-address=:${VALKEY_EXPORTER_PORT:-9121}
    depends_on:
      n8n-valkey: { condition: service_healthy, required: false }
    labels:
      <<: *tier-label

  # Blog-data ingestion Gateway (SPEC-0204-TSK-0022). Blog-data owns the code,
  # image recipe and contract; this host only runs an image built locally from
  # the reviewed Blog-data dev commit in the tag. Its own profile keeps it out
  # of every existing selection; n8n-worker (ingest) and Traefik (exact-path
  # export and attestation routes) are its only peers.
  blog-ingestion:
    profiles:
      - blog-ingestion
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-med
    image: hy-home/blog-ingestion:bcefdc0c0bc4fced9c47d0624d6ca815ddbcaf48
    pull_policy: never
    container_name: blog-ingestion
    # Own reservation: peak 0.117 CPU / 66 MiB, above its template's other members;
    # peak x 1.5 with the 0.05 / 32M floor (owner decision, 2026-11-06).
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 128M
    hostname: blog-ingestion
    user: '10001:10001'
    pids_limit: 64
    stop_grace_period: 20s
    command: [serve, --config, /run/config.json]
    expose:
      - '8787'
    volumes:
      # SQLite receipts stay on local disk, never on SMB/NFS.
      - type: bind
        source: ${DEFAULT_WORKFLOW_DIR}/blog-ingestion/data
        target: /data
        bind:
          create_host_path: false
      # Token SHA-256 digests only; 0600 and owned by 10001, outside Git.
      - type: bind
        source: ${DEFAULT_WORKFLOW_DIR}/blog-ingestion/config.json
        target: /run/config.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      n8n_blog_ingest_net: {}
      blog_export_net: {}
    healthcheck:
      # An unauthenticated summary request proves the listener answers: 401.
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/v1/summary').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      <<: *tier-label
