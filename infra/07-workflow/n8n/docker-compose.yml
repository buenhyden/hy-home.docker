x-tier-label: &tier-label
  hy-home.tier: workflow

x-n8n-common-env: &n8n-common-env
  GENERIC_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Seoul}
  TZ: ${DEFAULT_TIMEZONE:-Asia/Seoul}
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: ${POSTGRES_MNG_HOSTNAME}
  DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${N8N_DB_USER}
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
  EXECUTIONS_MODE: queue
  # Smaller than n8n's 16 MiB default; bounds Zod array parsing (GHSA-mrhx-c7xc-m3w5).
  N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-4}
  N8N_VALKEY_HOST: ${N8N_VALKEY_HOST:-mng-valkey}
  N8N_VALKEY_USERNAME: ${N8N_VALKEY_USERNAME:-}
  N8N_VALKEY_SECRET: ${N8N_VALKEY_SECRET:-mng_valkey_password}
  N8N_VALKEY_DB: ${N8N_VALKEY_DB:-0}
  QUEUE_BULL_REDIS_HOST: ${N8N_VALKEY_HOST:-mng-valkey}
  QUEUE_BULL_REDIS_USERNAME: ${N8N_VALKEY_USERNAME:-}
  QUEUE_BULL_REDIS_PORT: ${VALKEY_PORT:-6379}
  QUEUE_BULL_REDIS_DB: ${N8N_VALKEY_DB:-0}
  QUEUE_BULL_PREFIX: n8n
  N8N_REDIS_KEY_PREFIX: n8n
  QUEUE_BULL_REDIS_PASSWORD_FILE: /run/secrets/${N8N_VALKEY_SECRET:-mng_valkey_password}

  N8N_RUNNERS_MODE: external
  # The alias must move the listener, not only the URI, expose and healthcheck.
  N8N_RUNNERS_BROKER_PORT: ${N8N_BROKER_PORT:-5679}
  N8N_NATIVE_PYTHON_RUNNER: true
  N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runner_auth_token
  N8N_RUNNERS_TASK_TIMEOUT: 300
  # A cold runner start here took ~40 s, past the 30 s default grant.
  N8N_RUNNERS_GRANT_TOKEN_TTL: ${N8N_RUNNERS_GRANT_TOKEN_TTL:-120}

  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
  N8N_BLOCK_ENV_ACCESS_IN_NODE: true
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: true

  # Workflow tracing to Alloy's OTLP/HTTP receiver, then Tempo. Main and worker
  # each export their own spans, so both get the same endpoint; the service
  # name is set per service. Other N8N_OTEL_* options keep their n8n defaults
  # (production executions only, sample rate 1.0, no start-marker spans).
  N8N_OTEL_ENABLED: true
  N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:${ALLOY_OTLP_HTTP_PORT:-4318}

volumes:
  n8n-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n
  # Detached rollback/data identities. The read-only runners no longer mount
  # these paths; keeping the declarations does not delete existing host data.
  n8n-task-runner-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n-task-runner
  n8n-task-runner-worker-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/n8n-task-runner-worker
  # mTLS material between the sandbox API and its runner, written once by
  # n8n-sandbox-certs. The CA key is deleted after signing.
  n8n-sandbox-tls:
  # The runner's own Docker data root (sandbox image and sandboxes). Never the
  # host Docker socket or /var/lib/docker.
  n8n-sandbox-docker:

# The n8n Assistant's web search runs on SearXNG. n8n main reaches it on
# n8n_search_net, an internal network with no other member. SearXNG's only way
# out is n8n_search_outbound_net, a plain bridge that only it joins; it needs the
# public internet to query search engines and has no inbound path.
networks:
  n8n_search_net:
    name: n8n_search_net
    driver: bridge
    internal: true
  n8n_search_outbound_net:
    name: n8n_search_outbound_net
    driver: bridge
  # n8n Assistant code sandbox (owner decision 2026-11-09: privileged DinD runner).
  # n8n reaches only the API, on n8n_sandbox_net. The runner never joins a
  # network with n8n: the API reaches it on n8n_sandbox_runner_net, and its only
  # way out is n8n_sandbox_outbound_net, which only the runner joins.
  n8n_sandbox_net:
    name: n8n_sandbox_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.210.0/24
  n8n_sandbox_runner_net:
    name: n8n_sandbox_runner_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.211.0/24
  n8n_sandbox_outbound_net:
    name: n8n_sandbox_outbound_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.212.0/24

services:
  n8n:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    build:
      context: .
      dockerfile: ${N8N_DOCKERFILE:-dev.Dockerfile}
      args:
        N8N_VERSION: 2.46.6
    image: hyhome/n8n:2.46.6-local
    container_name: n8n
    hostname: n8n
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    expose:
      - ${N8N_PORT:-5678}
      - ${N8N_BROKER_PORT:-5679}
    secrets:
      - ${N8N_VALKEY_SECRET:-mng_valkey_password}
      - n8n_db_password
      - n8n_encryption_key
      - n8n_runner_auth_token
      - n8n_sandbox_api_key
    volumes:
      - n8n-data:/home/node/.n8n:rw
      - ./custom:/home/node/.n8n/custom:ro
    environment:
      <<: *n8n-common-env
      N8N_OTEL_EXPORTER_SERVICE_NAME: n8n
      N8N_PROXY_HOPS: 1
      # n8n Assistant: model only; the Anthropic key is a provider connection set in the UI.
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
      # Code sandbox through the n8n sandbox service (profile n8n-sandbox); the key is read from the secret file.
      N8N_INSTANCE_AI_SANDBOX_ENABLED: true
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://n8n-sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY_FILE: /run/secrets/n8n_sandbox_api_key
      N8N_PROTOCOL: https
      N8N_HOST: n8n.${DEFAULT_URL}
      N8N_PORT: ${N8N_PORT:-5678}
      WEBHOOK_URL: https://n8n.${DEFAULT_URL}/
      N8N_PUSH_BACKEND: websocket
      N8N_PUBLIC_API_DISABLED: false
      N8N_API_KEY_GENERATED_ENABLED: true
      N8N_EDITOR_BASE_URL: https://n8n.${DEFAULT_URL}
      N8N_PUBLIC_API_BASE_URL: https://n8n.${DEFAULT_URL}
      N8N_METRICS: true
      N8N_METRICS_PREFIX: n8n_
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: true
      N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: true
      N8N_METRICS_INCLUDE_QUEUE_METRICS: true
      QUEUE_HEALTH_CHECK_ACTIVE: true
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.n8n.rule: Host(`n8n.${DEFAULT_URL}`) && !PathRegexp(`(?i)^/metrics`) && !PathRegexp(`(?i)^/webhook(-test)?/hermes-blog-ingestion`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.middlewares: gateway-standard-chain@file
      traefik.http.routers.n8n.tls: 'true'
      traefik.http.routers.n8n.service: n8n
      traefik.http.services.n8n.loadbalancer.server.port: ${N8N_PORT:-5678}
    networks:
      edge_net: {}
      n8n_net: {}
      mng_data_net: {}
      obs_net: {}
      n8n_search_net: {}
      n8n_sandbox_net: {}
    healthcheck:
      # Readiness fails while the database connection is lost; /healthz stayed
      # green through six hours of 503s on 2026-09-29 (SPEC-0192).
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${N8N_PORT:-5678}/healthz/readiness || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Startup took about 5.5 minutes under host load on 2026-10-27.
      start_period: 300s

  n8n-worker:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    build:
      context: .
      dockerfile: ${N8N_DOCKERFILE:-dev.Dockerfile}
      args:
        N8N_VERSION: 2.46.6
    image: hyhome/n8n:2.46.6-local
    container_name: n8n-worker
    hostname: n8n-worker
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    expose:
      - ${N8N_PORT:-5678}
      - ${N8N_BROKER_PORT:-5679}
    depends_on:
      n8n: { condition: service_healthy }
    volumes:
      - n8n-data:/home/node/.n8n:rw
      - ./custom:/home/node/.n8n/custom:ro
    environment:
      <<: *n8n-common-env
      # The broker listens on n8n_worker_runner_net only (SPEC-0267).
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 10.250.23.2
      N8N_OTEL_EXPORTER_SERVICE_NAME: n8n-worker
    secrets:
      - ${N8N_VALKEY_SECRET:-mng_valkey_password}
      - n8n_db_password
      - n8n_encryption_key
      - n8n_runner_auth_token
    networks:
      n8n_net: {}
      n8n_worker_runner_net:
        ipv4_address: 10.250.23.2
      mng_data_net: {}
      # Internal path to Ollama for the Local Node; Main and runners stay off it.
      n8n_ollama_net: {}
      # Manifest-outbox notifier: dev-pg outbox reads and mailpit capture.
      dev_data_net: {}
      opsflow_capture_net: {}
      # Production webhook executions run here; the only Gateway peer.
      n8n_blog_ingest_net: {}
      # Reaches Alloy's OTLP receiver for the worker's workflow and node spans.
      obs_net: {}
    command: worker
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://10.250.23.2:${N8N_BROKER_PORT:-5679}/healthz || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    labels:
      <<: *tier-label

  n8n-task-runner-worker:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    image: n8nio/runners:2.46.6@sha256:b1fe87a59b712a03e5a4fbb46a18ea5ca9487add602f8749941a69f4ab322612
    container_name: n8n-task-runner-worker
    hostname: n8n-task-runner-worker
    user: '1000:1000'
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: true
    depends_on:
      n8n-worker: { condition: service_healthy }
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:${N8N_BROKER_PORT:-5679}
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_RUNNERS_MAX_CONCURRENCY: 1
      # Keep the runner up after its first task; a daily run would otherwise start cold.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 0
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: ${N8N_TASK_RUNNER_PORT:-5680}
    entrypoint: [tini, --, /bin/sh, -ec]
    command:
      - |
        [ -s /run/secrets/n8n_runner_auth_token ] || { echo 'n8n runner token missing' >&2; exit 1; }
        N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/n8n_runner_auth_token)"
        [ -n "$$N8N_RUNNERS_AUTH_TOKEN" ] || { echo 'n8n runner token empty' >&2; exit 1; }
        export N8N_RUNNERS_AUTH_TOKEN
        exec /usr/local/bin/task-runner-launcher javascript python
    networks:
      n8n_worker_runner_net: {}
    expose:
      - ${N8N_TASK_RUNNER_PORT:-5680}
    secrets:
      - n8n_runner_auth_token
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=1000,gid=1000
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:${N8N_TASK_RUNNER_PORT:-5680}/healthz || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      <<: *tier-label

  # Blog-data ingestion Gateway (SPEC-0204-TSK-0022). Blog-data owns the code,
  # image recipe and contract; this host only runs an image built locally from
  # the reviewed Blog-data dev commit in the tag. Its own profile keeps it out
  # of every existing selection; n8n-worker (ingest) and Traefik (exact-path
  # export and attestation routes) are its only peers.
  # Web search for the n8n Assistant (N8N_INSTANCE_AI_SEARXNG_URL). Internal
  # only: no host port, no Traefik route. The secret key is random per start
  # because nothing here keeps sessions or signed links.
  searxng:
    profiles:
      - workflow
      - workflow-n8n
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-med
    image: searxng/searxng:2026.11.9-57ff753ad@sha256:287af61f1a13e86d02974fcde91a3413a9945788de38b61ffbc491d81a19bcc2
    container_name: searxng
    hostname: searxng
    user: '977:977'
    entrypoint:
      - /bin/sh
      - -ec
      - |
        SEARXNG_SECRET="$$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
        export SEARXNG_SECRET
        exec /usr/local/searxng/entrypoint.sh
    environment:
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: '8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp
      - /run
      - /var/cache/searxng:uid=977,gid=977,mode=0700
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', '/usr/local/searxng/.venv/bin/python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      n8n_search_net: {}
      n8n_search_outbound_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  # --- n8n Assistant code sandbox (profile n8n-sandbox, opt-in) -------------
  # Owner decision 2026-11-09: the runner is the privileged Docker-in-Docker
  # image of the n8n reference stack (sandbox service 1.8.1). It is the only
  # privileged service in this file (infra/common-optimizations.exceptions.json,
  # Conftest and the p02 contract test). No host port, no Traefik route, no host
  # Docker socket. Nothing but the runner joins n8n_sandbox_outbound_net.
  n8n-sandbox-certs:
    profiles:
      - n8n-sandbox
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    image: n8nio/n8n-sandbox-service-api:1.8.1@sha256:3ac19681cae36f3d1fb879cc572d3488088d03c45c4c96b6ff4f0bbdd2d00e7e
    container_name: n8n-sandbox-certs
    hostname: n8n-sandbox-certs
    user: '0:0'
    # chown of the API's key files to the API user; nothing else.
    cap_add:
      - CHOWN
    network_mode: none
    entrypoint: ['sh', '-c']
    command:
      - >
        trap 'rm -f /tls/ca.key' EXIT;
        bootstrap-mtls.sh --out-dir /tls --api-san n8n-sandbox-api
        --control-san-prefix n8n-sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - n8n-sandbox-tls:/tls
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  n8n-sandbox-api:
    profiles:
      - n8n-sandbox
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-low
    image: n8nio/n8n-sandbox-service-api:1.8.1@sha256:3ac19681cae36f3d1fb879cc572d3488088d03c45c4c96b6ff4f0bbdd2d00e7e
    container_name: n8n-sandbox-api
    hostname: n8n-sandbox-api
    group_add:
      - '${SECRETS_GID:-1000}'
    depends_on:
      n8n-sandbox-certs:
        condition: service_completed_successfully
    secrets:
      - n8n_sandbox_api_key
      - n8n_sandbox_runner_registration_token
      - n8n_sandbox_runner_api_key
    # The image reads these three only from the environment, so the wrapper
    # loads them from the secret files and execs the image's own command.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        SANDBOX_API_KEYS="$$(cat /run/secrets/n8n_sandbox_api_key)"
        SANDBOX_API_RUNNER_REGISTRATION_TOKEN="$$(cat /run/secrets/n8n_sandbox_runner_registration_token)"
        SANDBOX_API_RUNNER_API_KEY="$$(cat /run/secrets/n8n_sandbox_runner_api_key)"
        [ -n "$$SANDBOX_API_KEYS" ] && [ -n "$$SANDBOX_API_RUNNER_REGISTRATION_TOKEN" ] && [ -n "$$SANDBOX_API_RUNNER_API_KEY" ] || { echo 'n8n-sandbox-api: a secret file is empty' >&2; exit 64; }
        export SANDBOX_API_KEYS SANDBOX_API_RUNNER_REGISTRATION_TOKEN SANDBOX_API_RUNNER_API_KEY
        exec /sbin/tini -- /usr/local/bin/sandbox-api
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: n8n-sandbox-runner-1
    volumes:
      - type: volume
        source: n8n-sandbox-tls
        target: /tls/api
        read_only: true
        volume:
          subpath: api
    tmpfs:
      - /tmp
      - /run
      - /home/sandbox-api:uid=100,gid=101,mode=0700
      - /var/lib/n8n-sandbox-api:uid=100,gid=101,mode=0700
    expose:
      - '8080'
      - '9090'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      n8n_sandbox_net: {}
      n8n_sandbox_runner_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  n8n-sandbox-runner-1:
    profiles:
      - n8n-sandbox
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-high
    image: n8nio/n8n-sandbox-service-runner-dind:1.8.1@sha256:b744471997bbaf1bf75b5ca667d0931352bdb4d59ecc7935ceab7e742829a117
    container_name: n8n-sandbox-runner-1
    hostname: n8n-sandbox-runner-1
    # Exception: infra/common-optimizations.exceptions.json (owner, 2026-11-09).
    privileged: true
    group_add:
      - '${SECRETS_GID:-1000}'
    # Whole-runner budget; every sandbox shares it through the outer cgroup.
    cpus: '3.00'
    mem_limit: 4g
    pids_limit: 4096
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 512M
    stop_grace_period: 30s
    depends_on:
      n8n-sandbox-api:
        condition: service_healthy
    secrets:
      - n8n_sandbox_runner_registration_token
      - n8n_sandbox_runner_api_key
    entrypoint:
      - /bin/sh
      - -ec
      - |
        SANDBOX_RUNNER_REGISTRATION_TOKEN="$$(cat /run/secrets/n8n_sandbox_runner_registration_token)"
        SANDBOX_RUNNER_API_KEYS="$$(cat /run/secrets/n8n_sandbox_runner_api_key)"
        [ -n "$$SANDBOX_RUNNER_REGISTRATION_TOKEN" ] && [ -n "$$SANDBOX_RUNNER_API_KEYS" ] || { echo 'n8n-sandbox-runner: a secret file is empty' >&2; exit 64; }
        export SANDBOX_RUNNER_REGISTRATION_TOKEN SANDBOX_RUNNER_API_KEYS
        exec /sbin/tini -- /usr/local/bin/start-runner.sh
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: n8n-sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://n8n-sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: n8n-sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      # Pulled by the inner dockerd from Docker Hub on first use.
      # The host kernel has overlay.redirect_dir off, so npm cannot rename image-layer
      # directories (EXDEV) and the workspace install times out; vfs has no such layer.
      SANDBOX_RUNNER_DOCKER_STORAGE_DRIVER: vfs
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: n8nio/n8n-sandbox-service-sandbox:1.8.1@sha256:b397f4b51c75faf83cdd9f7aaf8a415a96e6462478cd7694a2b795f664ba1233
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: n8n-sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - type: volume
        source: n8n-sandbox-tls
        target: /tls/runner
        read_only: true
        volume:
          subpath: runner
      - n8n-sandbox-docker:/var/lib/docker
    expose:
      - '8080'
      - '9091'
    healthcheck:
      test: ['CMD-SHELL', 'docker info >/dev/null 2>&1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      n8n_sandbox_runner_net: {}
      n8n_sandbox_outbound_net: {}
    labels:
      <<: *tier-label
      traefik.enable: 'false'

  blog-ingestion:
    profiles:
      - blog-ingestion
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-readonly-med
    image: hy-home/blog-ingestion:bcefdc0c0bc4fced9c47d0624d6ca815ddbcaf48
    pull_policy: never
    container_name: blog-ingestion
    # Own reservation: peak 0.117 CPU / 66 MiB, above its template's other members;
    # peak x 1.5 with the 0.05 / 32M floor (owner decision, 2026-11-06).
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 128M
    hostname: blog-ingestion
    user: '10001:10001'
    pids_limit: 64
    stop_grace_period: 20s
    command: [serve, --config, /run/config.json]
    expose:
      - '8787'
    volumes:
      # SQLite receipts stay on local disk, never on SMB/NFS.
      - type: bind
        source: ${DEFAULT_WORKFLOW_DIR}/blog-ingestion/data
        target: /data
        bind:
          create_host_path: false
      # Token SHA-256 digests only; 0600 and owned by 10001, outside Git.
      - type: bind
        source: ${DEFAULT_WORKFLOW_DIR}/blog-ingestion/config.json
        target: /run/config.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      n8n_blog_ingest_net: {}
      blog_export_net: {}
    healthcheck:
      # An unauthenticated summary request proves the listener answers: 401.
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/v1/summary').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      <<: *tier-label
