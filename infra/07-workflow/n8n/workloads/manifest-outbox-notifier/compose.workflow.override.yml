# Reviewed root model plus this optional workload overlay.
# The internal network bounds capture peers; it is not native denial evidence.
x-hyhome-overlay:
  version: 1
  base: docker-compose.yml

services:
  n8n-worker:
    networks:
      dev_data_net: {}
      opsflow_capture_net: {}
  mailpit:
    networks:
      opsflow_capture_net: {}

networks:
  opsflow_capture_net:
    internal: true
