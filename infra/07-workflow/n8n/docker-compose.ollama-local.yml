# 이 오버레이는 선언된 base의 common-optimizations.yml 설정을 상속합니다.
x-hyhome-overlay:
  version: 1
  base: docker-compose.yml

# Adds the queue worker path; existing Ollama edge/AI peers retain their access.
services:
  n8n-worker:
    networks:
      n8n_ollama_net: {}
  ollama:
    networks:
      n8n_ollama_net: {}

networks:
  n8n_ollama_net:
    internal: true
