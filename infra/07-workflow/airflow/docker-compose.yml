x-tier-label: &tier-label
  hy-home.tier: workflow

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CORE__AUTH_MANAGER: >-
    airflow.providers.keycloak.auth_manager.keycloak_auth_manager.KeycloakAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
    python3 /opt/airflow/bin/connection_uri.py metadata
  AIRFLOW__CELERY__RESULT_BACKEND_CMD: >-
    python3 /opt/airflow/bin/connection_uri.py result
  AIRFLOW__CELERY__BROKER_URL_CMD: >-
    python3 /opt/airflow/bin/connection_uri.py broker
  AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/secrets/airflow_fernet_key
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:${AIRFLOW_PORT:-8080}/execution/'
  AIRFLOW__API__PORT: '${AIRFLOW_PORT:-8080}'
  POSTGRES_PORT: '${POSTGRES_PORT:-5432}'
  VALKEY_PORT: '${VALKEY_PORT:-6379}'
  AIRFLOW_VALKEY_HOST: '${AIRFLOW_VALKEY_HOST:-mng-valkey}'
  AIRFLOW_VALKEY_SECRET: '${AIRFLOW_VALKEY_SECRET:-mng_valkey_password}'
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  AIRFLOW__API__BASE_URL: 'https://airflow.${DEFAULT_URL}'
  AIRFLOW__METRICS__STATSD_ON: 'true'
  AIRFLOW__METRICS__STATSD_HOST: 'airflow-statsd-exporter'
  AIRFLOW__METRICS__STATSD_PORT: '${STATSD_AIRFLOW_PORT:-9125}'
  AIRFLOW__METRICS__STATSD_PREFIX: 'airflow'
  # No OTel tracing: on Airflow 3.3.1 it hangs every forking process (the
  # scheduler health server, DAG file processors, the Celery prefork pool;
  # SPEC-0193, RUN-0050). Retest on the scheduler after an upgrade.
  AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/airflow_api_jwt_secret
  AIRFLOW__API_AUTH__JWT_ISSUER: airflow

x-airflow-common: &airflow-common
  profiles:
    - workflow
    - workflow-airflow
  build:
    context: ../../..
    dockerfile: infra/07-workflow/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: '3.3.2'
      PYTHON_VERSION: '3.13'
      KEYCLOAK_PROVIDER_VERSION: '0.11.0'
      COMMON_COMPAT_PROVIDER_VERSION: '1.20.0'
      CELERY_PROVIDER_VERSION: '3.24.1'
  image: hy-home/airflow:3.3.2-keycloak
  environment: *airflow-common-env
  volumes:
    - airflow-dags:/opt/airflow/dags
    - airflow-plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
    - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/hy-home-rootCA.pem:ro
  user: '${AIRFLOW_UID:-50000}:0'
  secrets:
    - airflow_db_password
    - airflow_fernet_key
    - mng_valkey_password
    - airflow_api_jwt_secret
    - airflow_keycloak_client_secret

volumes:
  airflow-dags:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/airflow/dags
  airflow-logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/airflow/logs
  airflow-config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/airflow/config
  airflow-plugins:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_WORKFLOW_DIR}/airflow/plugins

services:
  airflow-apiserver:
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    <<: *airflow-common
    container_name: airflow-apiserver
    hostname: airflow-apiserver
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    # Only the API server reads the Keycloak client secret, so only it binds the
    # OpenBao Agent copy; the other services keep the common volumes.
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
      - airflow-config:/opt/airflow/config
      - ${DEFAULT_CERT_DIR}/rootCA.pem:/etc/ssl/certs/hy-home-rootCA.pem:ro
      # P06: the OpenBao Agent's airflow output, read when the client secret file
      # variable points under /run/openbao/airflow. A missing directory stops it.
      - type: bind
        source: ${DEFAULT_SECURITY_DIR}/openbao/out/airflow
        target: /run/openbao/airflow
        read_only: true
        bind: {create_host_path: false}
    environment:
      <<: *airflow-common-env

      AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_ID: ${AIRFLOW_KEYCLOAK_CLIENT_ID:-home-airflow}

      # P06: set AIRFLOW_CLIENT_SECRET_FILE under /run/openbao/airflow; unset rolls back.
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_SECRET_CMD: >-
        cat ${AIRFLOW_CLIENT_SECRET_FILE:-/run/secrets/airflow_keycloak_client_secret}

      AIRFLOW__KEYCLOAK_AUTH_MANAGER__REALM: ${KEYCLOAK_REALM:-hy-home.realm}

      AIRFLOW__KEYCLOAK_AUTH_MANAGER__SERVER_URL: ${KEYCLOAK_URL}

      AIRFLOW__KEYCLOAK_AUTH_MANAGER__REQUESTS_POOL_SIZE: '10'
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__REQUESTS_RETRIES: '3'

      # Traefik 고정 주소: edge_net 10.250.1.2 (SPEC-0180 S05)
      FORWARDED_ALLOW_IPS: '10.250.1.2'

      # 아래 command에서 생성
      REQUESTS_CA_BUNDLE: /tmp/hy-home-ca-bundle.pem
      SSL_CERT_FILE: /tmp/hy-home-ca-bundle.pem
    command:
      - bash
      - -ec
      - |
        CERTIFI_BUNDLE="$$(python -c 'import certifi; print(certifi.where())')"

        cat \
          "$${CERTIFI_BUNDLE}" \
          /etc/ssl/certs/hy-home-rootCA.pem \
          > /tmp/hy-home-ca-bundle.pem

        exec airflow api-server --proxy-headers --port "$${AIRFLOW__API__PORT}"
    networks:
      edge_net: {}
      airflow_net: {}
      mng_data_net: {}
    healthcheck:
      test: [ 'CMD', 'curl', '--fail', 'http://localhost:${AIRFLOW_PORT:-8080}/api/v2/monitor/health' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.airflow.rule: Host(`airflow.${DEFAULT_URL}`)
      traefik.http.routers.airflow.entrypoints: websecure
      traefik.http.routers.airflow.tls: 'true'
      traefik.http.routers.airflow.middlewares: gateway-standard-chain@file
      traefik.http.services.airflow.loadbalancer.server.port: ${AIRFLOW_PORT:-8080}
  airflow-scheduler:
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    command: scheduler
    networks:
      airflow_net: {}
      mng_data_net: {}
    healthcheck:
      test: [ 'CMD', 'curl', '--fail', 'http://localhost:8974/health' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-dag-processor:
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    <<: *airflow-common
    container_name: airflow-dag-processor
    hostname: airflow-dag-processor
    # Its own reservation: DAG parsing peaked at 1.65 CPU and 329 MiB, far
    # above the other x-resource-db members (owner decision, 2026-11-06).
    deploy:
      resources:
        reservations:
          cpus: "2.00"
          memory: 512M
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    command: dag-processor
    networks:
      airflow_net: {}
      mng_data_net: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
      # `airflow jobs check` costs about 6 CPU-seconds per run.
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-worker:
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-high
    <<: *airflow-common
    container_name: airflow-worker
    hostname: airflow-worker
    group_add:
      - '${SECRETS_GID:-1000}'
    read_only: false
    command: celery worker
    networks:
      airflow_net: {}
      mng_data_net: {}
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: '0'
    healthcheck:
      test: [ 'CMD-SHELL', 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
  airflow-triggerer:
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    <<: *airflow-common
    container_name: airflow-triggerer
    hostname: airflow-triggerer
    group_add:
      - '${SECRETS_GID:-1000}'
    mem_limit: 384m
    # Reservation (measured; capped at the limit; SPEC-0263-TSK-0002 Measurements).
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 384M
    read_only: false
    command: triggerer
    networks:
      airflow_net: {}
      mng_data_net: {}
    healthcheck:
      test: [ 'CMD-SHELL', 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      # `airflow jobs check` costs about 6 CPU-seconds per run.
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    profiles:
      - workflow
      - workflow-airflow
    container_name: airflow-init
    hostname: airflow-init
    group_add:
      - '${SECRETS_GID:-1000}'
    extends:
      file: ../../common-optimizations.yml
      service: template-job-low
    restart: 'no'
    <<: *airflow-common
    read_only: false
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      # init 시 package/version mutation 방지
    user: '0:0'
    networks:
      airflow_net: {}
      mng_data_net: {}
  # airflow-cli:
  #   extends:
  #     file: ../../common-optimizations.yml
  #     service: template-infra-med
  #   <<: *airflow-common
  #   container_name: airflow-cli
  #   profiles:
  #     - workflow
  #   read_only: false
  #   environment:
  #     <<: *airflow-common-env
  #     CONNECTION_CHECK_MAX_COUNT: '0'
  #   # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
  #   command:
  #     - bash
  #     - -c
  #     - airflow
  #   networks:
  #     airflow_net: {}
  flower:
    profiles:
      - workflow
      - workflow-airflow
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-low
    <<: *airflow-common
    container_name: flower
    hostname: flower
    group_add:
      - '${SECRETS_GID:-1000}'
    mem_limit: 384m
    # Reservation (measured; SPEC-0263-TSK-0002 Measurements).
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 64M
    read_only: false
    command: celery flower
    networks:
      flower_ingress_net: {}
      obs_net: {}
      airflow_net: {}
      mng_data_net: {}
    healthcheck:
      test: [ 'CMD', 'curl', '--fail', 'http://localhost:${FLOWER_PORT:-5555}/' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    labels:
      <<: *tier-label
      traefik.docker.network: flower_ingress_net
      traefik.enable: 'true'
      traefik.http.routers.flower.rule: Host(`flower.${DEFAULT_URL}`)
      traefik.http.routers.flower.entrypoints: websecure
      traefik.http.routers.flower.tls: 'true'
      traefik.http.services.flower.loadbalancer.server.port: ${FLOWER_PORT:-5555}
      traefik.http.routers.flower.middlewares: gateway-standard-chain@file,sso-errors@file,sso-auth@file
  airflow-statsd-exporter:
    profiles:
      - workflow
      - workflow-airflow
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-low
    image: prom/statsd-exporter:v0.31.0@sha256:1d5d341c4eb7abdd3445a3f85c3d498402b676ad29b4cf0421f5d280943871ab
    container_name: airflow-statsd-exporter
    hostname: airflow-statsd-exporter
    healthcheck:
      test: [ 'CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9102/metrics' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    command: '--statsd.listen-udp=:${STATSD_AIRFLOW_PORT:-9125} --web.listen-address=:${STATSD_PROMETHEUS_PORT:-9102} --statsd.mapping-config=/tmp/mappings.yml'
    volumes:
      - ./config/statsd_mapping.yml:/tmp/mappings.yml:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      airflow_net: {}
      obs_net: {}
    expose:
      - '${STATSD_PROMETHEUS_PORT:-9102}'
      - '${STATSD_AIRFLOW_PORT:-9125}'
