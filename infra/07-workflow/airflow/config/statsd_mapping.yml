# Airflow 3 statsd -> Prometheus mapping (SPEC-0193).
# Names that embed a DAG, task, pool or file become labels, so the metric
# name set stays fixed and matches the Grafana Airflow mixin dashboard
# (airflow_dagrun_*, airflow_pool_*, airflow_ti_*, airflow_task_finish_total).
# Rules are tried in order; the catch-alls keep up to three static segments
# (written ${N}: in $1_$2 the exporter reads a variable named "1_")
# and anything longer that no rule names is dropped rather than turned into
# one metric per DAG file.
mappings:
  - match: airflow.dagrun.duration.success.*
    name: airflow_dagrun_duration_success
    labels:
      dag_id: $1
  - match: airflow.dagrun.duration.failed.*
    name: airflow_dagrun_duration_failed
    labels:
      dag_id: $1
  - match: airflow.dagrun.schedule_delay.*
    name: airflow_dagrun_schedule_delay
    labels:
      dag_id: $1
  - match: airflow.dagrun.*.first_task_scheduling_delay
    name: airflow_dagrun_first_task_scheduling_delay
    labels:
      dag_id: $1
  - match: airflow.dagrun.dependency-check.*
    name: airflow_dagrun_dependency_check
    labels:
      dag_id: $1

  - match: airflow.dag.*.*.duration
    name: airflow_dag_task_duration
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.dag.*.*.queued_duration
    name: airflow_dag_task_queued_duration
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.dag.*.*.scheduled_duration
    name: airflow_dag_task_scheduled_duration
    labels:
      dag_id: $1
      task_id: $2

  - match: airflow.ti.finish.*.*.*
    name: airflow_task_finish_total
    labels:
      dag_id: $1
      task_id: $2
      state: $3
  - match: airflow.ti.start.*.*
    name: airflow_task_start_total
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.ti_failures
    name: airflow_ti_failures
  - match: airflow.ti_successes
    name: airflow_ti_successes

  - match: airflow.pool.open_slots.*
    name: airflow_pool_open_slots
    labels:
      pool_name: $1
  - match: airflow.pool.queued_slots.*
    name: airflow_pool_queued_slots
    labels:
      pool_name: $1
  - match: airflow.pool.running_slots.*
    name: airflow_pool_running_slots
    labels:
      pool_name: $1
  - match: airflow.pool.deferred_slots.*
    name: airflow_pool_deferred_slots
    labels:
      pool_name: $1
  - match: airflow.pool.scheduled_slots.*
    name: airflow_pool_scheduled_slots
    labels:
      pool_name: $1
  - match: airflow.pool.starving_tasks.*
    name: airflow_pool_starving_tasks
    labels:
      pool_name: $1

  - match: airflow.dag_processing.last_duration.*.*
    name: airflow_dag_processing_last_duration
    labels:
      bundle: $1
      dag_file: $2
  - match: airflow.dag_processing.last_run.seconds_ago.*
    name: airflow_dag_processing_last_run_seconds_ago
    labels:
      dag_file: $1
  - match: airflow.dag_processing.last_num_of_db_queries.*
    name: airflow_dag_processing_last_num_of_db_queries
    labels:
      dag_file: $1

  - match: airflow.triggerer.capacity_left.*
    name: airflow_triggerer_capacity_left
    labels:
      hostname: $1
  - match: airflow.triggers.running.*
    name: airflow_triggers_running
    labels:
      hostname: $1

  # Static names: one, two or three segments.
  - match: airflow.*
    name: airflow_${1}
  - match: airflow.*.*
    name: airflow_${1}_${2}
  - match: airflow.*.*.*
    name: airflow_${1}_${2}_${3}

  # Longer names no rule above covers embed identifiers; drop them.
  - match: .
    match_type: regex
    action: drop
    name: dropped
