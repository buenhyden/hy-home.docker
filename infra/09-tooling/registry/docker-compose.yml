x-tier-label: &tier-label
  hy-home.tier: tooling


volumes:
  registry-data-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_REGISTRY_DIR}

services:
  registry:
    profiles:
      - 'tooling'
      - registry
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    image: registry:3
    container_name: registry
    # Owner of ${DEFAULT_REGISTRY_DIR}; root without capabilities cannot write it.
    user: '1000:1000'
    restart: unless-stopped
    read_only: false
    ports:
      - '127.0.0.1:${REGISTRY_PORT:-5000}:5000'
    environment:
      # Debug listener with Prometheus metrics for job registry (SPEC-0193);
      # reachable only on obs_net, never published.
      REGISTRY_HTTP_DEBUG_ADDR: ':5001'
      REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED: 'true'
      REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH: /metrics
    volumes:
      - registry-data-volume:/var/lib/registry:rw
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5000/v2/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
    # Prometheus job registry scrapes the debug listener over obs_net.
    networks:
      obs_net: {}
