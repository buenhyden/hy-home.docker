x-tier-label: &tier-label
  hy-home.tier: tooling


volumes:
  registry-data-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_REGISTRY_DIR}

services:
  registry:
    profiles:
      - 'tooling'
      - registry
    extends:
      file: ../../common-optimizations.yml
      service: template-stateful-med
    image: registry:3
    container_name: registry
    # Owner of ${DEFAULT_REGISTRY_DIR}; root without capabilities cannot write it.
    user: '1000:1000'
    restart: unless-stopped
    read_only: false
    ports:
      - '127.0.0.1:${REGISTRY_PORT:-5000}:5000'
    volumes:
      - registry-data-volume:/var/lib/registry:rw
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5000/v2/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      infra_net:
        ipv4_address: 172.19.0.7
    labels:
      <<: *tier-label
