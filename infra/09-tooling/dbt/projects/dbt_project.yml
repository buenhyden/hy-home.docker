name: hyhome_analytics
version: '1.0.0'

profile: hyhome

model-paths:
  - models

# The project mount is read-only; every generated artifact goes to the job's
# /tmp tmpfs and disappears with the container.
target-path: /tmp/dbt/target
log-path: /tmp/dbt/logs
packages-install-path: /tmp/dbt/packages

clean-targets:
  - /tmp/dbt/target
  - /tmp/dbt/packages

models:
  hyhome_analytics:
    +materialized: view
