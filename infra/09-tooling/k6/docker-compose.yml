x-tier-label: &tier-label
  hy-home.tier: tooling


volumes:
  k6-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DEFAULT_TOOLING_DIR}/k6

services:
  k6:
    # k6 runs a scenario and exits, so it declares only the load-test role
    # profile. Selecting the whole `tooling` domain must not fire a load test.
    profiles:
      - testing
    extends:
      file: ../../common-optimizations.yml
      service: template-infra-med
    build: .
    # The template restarts unless stopped, which would replay the load test
    # forever for a one-shot job.
    restart: 'no'
    read_only: false
    labels:
      <<: *tier-label
    volumes:
      - k6-data:/scripts:ro
    networks:
      - infra_net
    environment:
      # The Grafana dashboard reads k6 metrics from Prometheus remote write.
      # `obs` must already be selected; k6 declares no depends_on because
      # prometheus does not declare `testing`.
      K6_PROMETHEUS_RW_SERVER_URL: 'http://${K6_PROMETHEUS_HOST:-prometheus}:${K6_PROMETHEUS_PORT:-9090}/api/v1/write'
      # The dashboard queries min, max, p95 and p99; k6 emits only p(99) by
      # default, so the panels stay empty unless all four are requested.
      K6_PROMETHEUS_RW_TREND_STATS: '${K6_TREND_STATS:-min,max,p(95),p(99)}'
    command:
      - run
      - --out
      - experimental-prometheus-rw
      - --tag
      - testid=${K6_TESTID:-local}
      - ${K6_SCRIPT:-/scripts/smoke.js}
    extra_hosts:
      - '${DEFAULT_URL:-localhost}:host-gateway'
