name: hy-home-lab-postgresql-ha
x-tier-label: &tier-label
  hy-home.tier: data

x-pg-common-env: &pg-common-env
  SCOPE: 'pg-ha'
  PATRONI_NAMESPACE: /service/
  ETCD3_HOSTS: >-
    etcd-1:${LAB_PG_ETCD_CLIENT_PORT:-2379}, etcd-2:${LAB_PG_ETCD_CLIENT_PORT:-2379}, etcd-3:${LAB_PG_ETCD_CLIENT_PORT:-2379}
  PATRONI_SUPERUSER_USERNAME: ${LAB_PG_SUPERUSER_USERNAME:-postgres}
  PATRONI_REPLICATION_USERNAME: ${LAB_PG_REPLICATION_USERNAME:-replicator}
  PATRONI_EXPORTER_USERNAME: ${LAB_PG_EXPORTER_USERNAME:-exporter}
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432

volumes:
  pg0-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/pg0-data
  pg1-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/pg1-data
  pg2-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/pg2-data
  etcd1-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/etcd1-data
  etcd2-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/etcd2-data
  etcd3-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/postgresql-ha/etcd3-data

services:
  etcd-1:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-low
    image: quay.io/coreos/etcd:v3.7.1
    container_name: lab-pg-etcd-1
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-1:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-peer-urls=http://0.0.0.0:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-client-urls=http://0.0.0.0:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://etcd-1:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --initial-cluster=etcd-1=http://etcd-1:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-2=http://etcd-2:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-3=http://etcd-3:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-etcd
    volumes:
      - etcd1-data:/etcd-data:rw
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}
    labels:
      <<: *tier-label

  etcd-2:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-low
    image: quay.io/coreos/etcd:v3.7.1
    container_name: lab-pg-etcd-2
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-2:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-peer-urls=http://0.0.0.0:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-client-urls=http://0.0.0.0:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://etcd-2:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --initial-cluster=etcd-1=http://etcd-1:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-2=http://etcd-2:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-3=http://etcd-3:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-etcd
    volumes:
      - etcd2-data:/etcd-data:rw
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}
    labels:
      <<: *tier-label

  etcd-3:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-low
    image: quay.io/coreos/etcd:v3.7.1
    container_name: lab-pg-etcd-3
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-3:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-peer-urls=http://0.0.0.0:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --listen-client-urls=http://0.0.0.0:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://etcd-3:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      - --initial-cluster=etcd-1=http://etcd-1:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-2=http://etcd-2:${LAB_PG_ETCD_PEER_PORT:-2380},etcd-3=http://etcd-3:${LAB_PG_ETCD_PEER_PORT:-2380}
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-etcd
    volumes:
      - etcd3-data:/etcd-data:rw
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:${LAB_PG_ETCD_CLIENT_PORT:-2379}
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}

  pg-router:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    image: haproxy:3.4.4
    container_name: lab-pg-pg-router
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../infra/04-data/postgresql-cluster/config/haproxy.cfg.tpl:/tmp/haproxy.cfg.tpl:ro
    secrets:
      - lab_pg_haproxy_stats_password
    ports:
      - '${LAB_HOST_BIND_IP:-127.0.0.1}:${LAB_PG_WRITE_HOST_PORT:-35432}:15432'
      - '${LAB_HOST_BIND_IP:-127.0.0.1}:${LAB_PG_READ_HOST_PORT:-35433}:15433'
    expose:
      - '8404'
    command:
      - /bin/sh
      - -ec
      - |
        HAPROXY_STATS_PASSWORD="$$(cat /run/secrets/lab_pg_haproxy_stats_password)"
        case "$$HAPROXY_STATS_PASSWORD" in
          ''|*[!A-Za-z0-9_+./=:@#%-]*) echo "Invalid LAB HAProxy stats password" >&2; exit 1 ;;
        esac
        umask 077
        printf 's|$${HAPROXY_STATS_PASSWORD}|%s|g\n' "$$HAPROXY_STATS_PASSWORD" > /tmp/haproxy-secret.sed
        sed -f /tmp/haproxy-secret.sed /tmp/haproxy.cfg.tpl > /tmp/haproxy.cfg
        rm -f /tmp/haproxy-secret.sed
        unset HAPROXY_STATS_PASSWORD
        exec haproxy -W -db -f /tmp/haproxy.cfg
    depends_on:
      pg-0:
        condition: service_healthy
      pg-1:
        condition: service_healthy
      pg-2:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - haproxy
        - -c
        - -f
        - /tmp/haproxy.cfg
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
      traefik.enable: 'true'
      traefik.http.routers.haproxy-stats.rule: Host(`pg-haproxy.${LAB_BASE_DOMAIN}`)
      traefik.http.routers.haproxy-stats.entrypoints: websecure
      traefik.http.routers.haproxy-stats.tls: 'true'
      traefik.http.services.haproxy-stats.loadbalancer.server.port: 7000
      traefik.http.routers.haproxy-stats.middlewares: gateway-standard-chain@file
    networks:
      lab_pg_edge_net: {}
      lab_pg_core_net: {}
      lab_pg_obs_net: {}

  pg-cluster-init:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-job-low
    restart: 'no'
    image: postgres:18.6-alpine
    container_name: lab-pg-pg-cluster-init
    environment:
      POSTGRES_ROUTER_HOSTNAME: pg-router
      POSTGRES_WRITE_PORT: 15432
      POSTGRES_READ_PORT: 15433
      POSTGRES_USER: ${LAB_PG_SUPERUSER_USERNAME:-postgres}
      POSTGRES_DB: ${LAB_PG_DEFAULT_DB}
      PATRONI_EXPORTER_USERNAME: ${LAB_PG_EXPORTER_USERNAME:-exporter}
      SERVICE_POSTGRES_USERNAME: ${LAB_PG_FIXTURE_USERNAME:-app_user}
      SERVICE_POSTGRES_DB: ${LAB_PG_FIXTURE_DB:-app_db}
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready -h "$$POSTGRES_ROUTER_HOSTNAME" -p "$$POSTGRES_WRITE_PORT" -U "$$POSTGRES_USER"; do
          sleep 2
        done
        export PGPASSWORD="$(cat /run/secrets/lab_pg_superuser_password | tr -d '\n')"
        for secret in lab_pg_exporter_password lab_pg_service_password; do
          [ -s "/run/secrets/$$secret" ] || { echo "Missing LAB PostgreSQL secret: $$secret" >&2; exit 1; }
        done
        umask 077
        printf '%s\n' \
          '\set patroni_exporter_password `cat /run/secrets/lab_pg_exporter_password`' \
          '\set service_postgres_password `cat /run/secrets/lab_pg_service_password`' \
          > /tmp/lab-secret-vars.sql
        psql \
          -h "$$POSTGRES_ROUTER_HOSTNAME" \
          -p "$$POSTGRES_WRITE_PORT" \
          -U "$$POSTGRES_USER" \
          -d "$$POSTGRES_DB" \
          -v patroni_exporter_username="$$PATRONI_EXPORTER_USERNAME" \
          -v service_postgres_username="$$SERVICE_POSTGRES_USERNAME" \
          -v service_postgres_db="$$SERVICE_POSTGRES_DB" \
          -f /tmp/lab-secret-vars.sql \
          -f /work/init_users_dbs.sql
    volumes:
      - ../infra/04-data/postgresql-cluster/init-scripts/init_users_dbs.sql:/work/init_users_dbs.sql:ro
    depends_on:
      pg-router:
        condition: service_started
    secrets:
      - lab_pg_superuser_password
      - lab_pg_exporter_password
      - lab_pg_service_password
    networks:
      lab_pg_core_net: {}
    labels:
      <<: *tier-label

  pg-0:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-db-high
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: lab-pg-pg-0
    hostname: pg-0
    entrypoint: [ '/bin/sh', '/usr/local/bin/spilo-entrypoint-with-secrets.sh' ]
    environment:
      <<: *pg-common-env
      PATRONI_NAME: pg-0
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-0:5432
    volumes:
      - pg0-data:/home/postgres/pgdata:rw
      - ../infra/04-data/postgresql-cluster/scripts/spilo-entrypoint-with-secrets.sh:/usr/local/bin/spilo-entrypoint-with-secrets.sh:ro
    secrets:
      - lab_pg_superuser_password
      - lab_pg_replication_password
      - lab_pg_exporter_password
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${PATRONI_SUPERUSER_USERNAME:-postgres} -h 127.0.0.1 -p 5432'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}

  pg-1:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-db-high
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: lab-pg-pg-1
    hostname: pg-1
    entrypoint: [ '/bin/sh', '/usr/local/bin/spilo-entrypoint-with-secrets.sh' ]
    environment:
      <<: *pg-common-env
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    volumes:
      - pg1-data:/home/postgres/pgdata:rw
      - ../infra/04-data/postgresql-cluster/scripts/spilo-entrypoint-with-secrets.sh:/usr/local/bin/spilo-entrypoint-with-secrets.sh:ro
    secrets:
      - lab_pg_superuser_password
      - lab_pg_replication_password
      - lab_pg_exporter_password
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${PATRONI_SUPERUSER_USERNAME:-postgres} -h 127.0.0.1 -p 5432'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}

  pg-2:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-db-high
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: lab-pg-pg-2
    hostname: pg-2
    entrypoint: [ '/bin/sh', '/usr/local/bin/spilo-entrypoint-with-secrets.sh' ]
    environment:
      <<: *pg-common-env
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    volumes:
      - pg2-data:/home/postgres/pgdata:rw
      - ../infra/04-data/postgresql-cluster/scripts/spilo-entrypoint-with-secrets.sh:/usr/local/bin/spilo-entrypoint-with-secrets.sh:ro
    secrets:
      - lab_pg_superuser_password
      - lab_pg_replication_password
      - lab_pg_exporter_password
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${PATRONI_SUPERUSER_USERNAME:-postgres} -h 127.0.0.1 -p 5432'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}

  pg-0-exporter:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: lab-pg-pg-0-exporter
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - '9187'
    secrets:
      - lab_pg_exporter_password
    environment:
      DATA_SOURCE_URI: "pg-0:5432/postgres?sslmode=require"
      DATA_SOURCE_USER: ${LAB_PG_EXPORTER_USERNAME:-exporter}
      DATA_SOURCE_PASS_FILE: /run/secrets/lab_pg_exporter_password
    command: [ '--collector.postmaster' ]
    depends_on:
      pg-0:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:9187/metrics > /dev/null 2>&1 || exit 1' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}

  pg-1-exporter:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: lab-pg-pg-1-exporter
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - '9187'
    secrets:
      - lab_pg_exporter_password
    environment:
      DATA_SOURCE_URI: "pg-1:5432/postgres?sslmode=require"
      DATA_SOURCE_USER: ${LAB_PG_EXPORTER_USERNAME:-exporter}
      DATA_SOURCE_PASS_FILE: /run/secrets/lab_pg_exporter_password
    command: [ '--collector.postmaster' ]
    depends_on:
      pg-1:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:9187/metrics > /dev/null 2>&1 || exit 1' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}

  pg-2-exporter:
    profiles:
      - postgres-ha
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: lab-pg-pg-2-exporter
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - '9187'
    secrets:
      - lab_pg_exporter_password
    environment:
      DATA_SOURCE_URI: "pg-2:5432/postgres?sslmode=require"
      DATA_SOURCE_USER: ${LAB_PG_EXPORTER_USERNAME:-exporter}
      DATA_SOURCE_PASS_FILE: /run/secrets/lab_pg_exporter_password
    command: [ '--collector.postmaster' ]
    depends_on:
      pg-2:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:9187/metrics > /dev/null 2>&1 || exit 1' ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label
    networks:
      lab_pg_core_net: {}
      lab_pg_obs_net: {}

networks:
  lab_pg_core_net:
    name: ${LAB_PG_CORE_NETWORK_NAME:-hy-home-lab-pg-core}
    internal: true
  lab_pg_edge_net:
    name: ${LAB_PG_EDGE_NETWORK_NAME:-hy-home-lab-pg-edge}
  lab_pg_obs_net:
    name: ${LAB_PG_OBS_NETWORK_NAME:-hy-home-lab-pg-obs}
    internal: true
secrets:
  lab_pg_haproxy_stats_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/postgresql-ha/haproxy_stats_password.txt
  lab_pg_superuser_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/postgresql-ha/superuser_password.txt
  lab_pg_replication_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/postgresql-ha/replication_password.txt
  lab_pg_exporter_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/postgresql-ha/exporter_password.txt
  lab_pg_service_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/postgresql-ha/service_password.txt
