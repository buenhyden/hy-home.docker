name: hy-home-lab-supabase

x-tier-label: &tier-label
  hy-home.tier: lab

volumes:
  db-config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/config

networks:
  supabase_net:
    name: hy-home-lab-supabase-core

secrets:
  smtp_password:
    file: ../secrets/communication/smtp/smtp_password.txt
  supabase_db_password:
    file: ../secrets/db/mng-pg/supabase_password.txt
  supabase_jwt_secret:
    file: ../secrets/data/supabase/supabase_jwt_secret.txt
  supabase_anon_key:
    file: ../secrets/data/supabase/supabase_anon_key.txt
  supabase_service_key:
    file: ../secrets/data/supabase/supabase_service_key.txt
  supabase_dashboard_password:
    file: ../secrets/data/supabase/supabase_dashboard_password.txt
  supabase_secret_key_base:
    file: ../secrets/data/supabase/supabase_secret_key_base.txt
  supabase_vault_enc_key:
    file: ../secrets/data/supabase/supabase_vault_enc_key.txt
  supabase_pg_meta_crypto_key:
    file: ../secrets/data/supabase/supabase_pg_meta_crypto_key.txt
  supabase_openai_api_key:
    file: ../secrets/data/supabase/supabase_openai_api_key.txt
  supabase_logflare_private_token:
    file: ../secrets/data/supabase/supabase_logflare_private_token.txt

services:
  studio:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-studio
    hostname: studio
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/studio:2026.09.14-sha-4dd8a95
    restart: unless-stopped
    depends_on:
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - supabase_anon_key
      - supabase_service_key
      - supabase_pg_meta_crypto_key
      - supabase_openai_api_key
      - supabase_logflare_private_token
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/supabase_db_password
      AUTH_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      SUPABASE_ANON_KEY_FILE: /run/secrets/supabase_anon_key
      SUPABASE_SERVICE_KEY_FILE: /run/secrets/supabase_service_key
      PG_META_CRYPTO_KEY_FILE: /run/secrets/supabase_pg_meta_crypto_key
      OPENAI_API_KEY_FILE: /run/secrets/supabase_openai_api_key
      LOGFLARE_PRIVATE_ACCESS_TOKEN_FILE: /run/secrets/supabase_logflare_private_token
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kong:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-kong
    hostname: kong
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: kong:3.9.3
    tmpfs:
      - /tmp
      - /var/run/kong
    restart: unless-stopped
    ports:
      - 127.0.0.1:${LAB_SUPABASE_KONG_HTTP_HOST_PORT:-8000}:8000/tcp
      - 127.0.0.1:${LAB_SUPABASE_KONG_HTTPS_HOST_PORT:-8443}:8443/tcp
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/api/kong.yml
        target: /home/kong/temp.yml
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - supabase_anon_key
      - supabase_service_key
      - supabase_dashboard_password
    environment:
      SUPABASE_ANON_KEY_FILE: /run/secrets/supabase_anon_key
      SUPABASE_SERVICE_KEY_FILE: /run/secrets/supabase_service_key
      DASHBOARD_USERNAME: ${LAB_SUPABASE_DASHBOARD_USERNAME:-supabase_admin}
      DASHBOARD_PASSWORD_FILE: /run/secrets/supabase_dashboard_password
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  auth:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-auth
    hostname: auth
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/gotrue:v2.197.0
    # GoTrue reads GOTRUE_SMTP_PASS; this wrapper owns the _FILE interface.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        fail() { echo 'SMTP secret input rejected' >&2; exit 1; }
        [ "$${GOTRUE_SMTP_PASS+x}" != x ] || fail
        [ -n "$${GOTRUE_SMTP_PASS_FILE:-}" ] || fail
        [ -f "$$GOTRUE_SMTP_PASS_FILE" ] && [ -r "$$GOTRUE_SMTP_PASS_FILE" ] && [ -s "$$GOTRUE_SMTP_PASS_FILE" ] || fail
        GOTRUE_SMTP_PASS="$$(cat "$$GOTRUE_SMTP_PASS_FILE" 2>/dev/null)" || fail
        [ -n "$$GOTRUE_SMTP_PASS" ] || fail
        export GOTRUE_SMTP_PASS
        [ "$$#" -gt 0 ] || fail
        exec "$$@"
      - --
    command: [ 'auth' ]
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - source: smtp_password
        target: supabase_smtp_password
    environment:
      GOTRUE_DB_PASSWORD_FILE: /run/secrets/supabase_db_password
      GOTRUE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      GOTRUE_SMTP_PASS_FILE: /run/secrets/supabase_smtp_password
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  rest:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    container_name: supabase-rest
    hostname: rest
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: postgrest/postgrest:v16.3
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
    environment:
      PGRST_DB_PASSWORD_FILE: /run/secrets/supabase_db_password
      PGRST_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  realtime:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: realtime-dev.supabase-realtime
    hostname: realtime
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/realtime:v2.138.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - supabase_secret_key_base
    environment:
      DB_PASSWORD_FILE: /run/secrets/supabase_db_password
      API_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      METRICS_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      SECRET_KEY_BASE_FILE: /run/secrets/supabase_secret_key_base
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  storage:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-storage
    hostname: storage
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/storage-api:v1.79.4
    restart: unless-stopped
    read_only: false
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/storage
        target: /var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - supabase_anon_key
      - supabase_service_key
    environment:
      ANON_KEY_FILE: /run/secrets/supabase_anon_key
      SERVICE_KEY_FILE: /run/secrets/supabase_service_key
      AUTH_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      DATABASE_PASSWORD_FILE: /run/secrets/supabase_db_password
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  imgproxy:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    container_name: supabase-imgproxy
    hostname: imgproxy
    image: darthsim/imgproxy:v4.0.17@sha256:db0b4b9cd690c8b3590203dea300fb759a18c4ec2af7b37424f0bdef23ce317d
    tmpfs:
      - /tmp
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/storage
        target: /var/lib/storage
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  meta:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-low
    container_name: supabase-meta
    hostname: meta
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_pg_meta_crypto_key
    environment:
      PG_META_DB_PASSWORD_FILE: /run/secrets/supabase_db_password
      CRYPTO_KEY_FILE: /run/secrets/supabase_pg_meta_crypto_key
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  functions:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-high
    container_name: supabase-edge-functions
    hostname: functions
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/functions
        target: /home/deno/functions
    depends_on:
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - supabase_anon_key
      - supabase_service_key
    environment:
      JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      SUPABASE_ANON_KEY_FILE: /run/secrets/supabase_anon_key
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_key
      SUPABASE_DB_PASSWORD_FILE: /run/secrets/supabase_db_password
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  analytics:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-high
    container_name: supabase-analytics
    hostname: analytics
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/logflare:1.50.15
    restart: unless-stopped
    ports:
      - 127.0.0.1:${LAB_SUPABASE_ANALYTICS_HOST_PORT:-4000}:4000
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_logflare_private_token
    environment:
      DB_PASSWORD_FILE: /run/secrets/supabase_db_password
      LOGFLARE_PRIVATE_ACCESS_TOKEN_FILE: /run/secrets/supabase_logflare_private_token
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-high
    container_name: supabase-db
    hostname: db
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/postgres:17.6.1.173
    restart: unless-stopped
    read_only: false
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        read_only: true
        bind:
          create_host_path: false
      - db-config:/etc/postgresql-custom
    depends_on:
      vector:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/supabase_db_password
      JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U postgres || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  vector:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-vector
    hostname: vector
    image: timberio/vector:0.58.0-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/logs/vector.yml
        target: /etc/vector/vector.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LAB_SUPABASE_DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    command: [ '--config', '/etc/vector/vector.yml' ]
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  supavisor:
    profiles:
      - supabase
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-med
    container_name: supabase-pooler
    hostname: supavisor
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    image: supabase/supavisor:2.9.13
    restart: unless-stopped
    ports:
      - 127.0.0.1:${LAB_SUPABASE_POSTGRES_HOST_PORT:-5432}:5432
      - 127.0.0.1:${LAB_SUPABASE_POOLER_PROXY_PORT_TRANSACTION_HOST_PORT:-6543}:6543
    volumes:
      - type: bind
        source: ${LAB_DATA_DIR:?set isolated LAB data root}/supabase/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    secrets:
      - supabase_db_password
      - supabase_jwt_secret
      - supabase_secret_key_base
      - supabase_vault_enc_key
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/supabase_db_password
      API_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      METRICS_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      SECRET_KEY_BASE_FILE: /run/secrets/supabase_secret_key_base
      VAULT_ENC_KEY_FILE: /run/secrets/supabase_vault_enc_key
    networks:
      supabase_net: {}
    labels:
      <<: *tier-label
    healthcheck:
      test: [ 'CMD-SHELL', 'kill -0 1 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
