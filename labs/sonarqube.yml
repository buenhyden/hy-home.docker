# Independent SonarQube LAB entrypoint (SPEC-0262); never included by the root.
# It joins no HOME network and has no gateway route. The HOME mng-pg endpoint is
# a required LAB input; HOME mng-pg-init still provisions the sonarqube role.
name: hy-home-lab-sonarqube

x-tier-label: &tier-label
  hy-home.tier: lab
  traefik.enable: 'false'

volumes:
  sonarqube-data-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/sonarqube/data
  sonarqube-logs-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/sonarqube/logs

networks:
  lab_sonarqube_net:
    name: hy-home-lab-sonarqube

# LAB-only secrets under LAB_SECRET_DIR; no root value is shared. Each mounts
# at its original /run/secrets name, which the LAB scripts read.
secrets:
  lab_sonarqube_db_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/sonarqube/db_password.txt

services:
  sonarqube:
    profiles:
      - sast
    extends: { file: ../infra/common-optimizations.yml, service: template-stateful-high }
    image: sonarqube:26.10.0.133078-community@sha256:0b3408443fb6a311253de27941b10977c9b977fd53be2265947bfe14161308b8
    container_name: sonarqube
    hostname: sonarqube
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    read_only: false
    # No gateway route: the web UI is published on the LAB bind address only.
    ports:
      - '${LAB_HOST_BIND_IP:-127.0.0.1}:${LAB_SONARQUBE_HOST_PORT:-18094}:9000'
    healthcheck:
      {
        test:
          [
            'CMD-SHELL',
            'wget -q --spider http://localhost:9000/api/system/health || exit 1',
          ],
        interval: 15s,
        timeout: 30s,
        retries: 5,
        start_period: 15s,
      }
    volumes:
      - sonarqube-data-volume:/opt/sonarqube/data:rw
      - sonarqube-logs-volume:/opt/sonarqube/logs:rw
    networks:
      lab_sonarqube_net: {}
    secrets:
      - source: lab_sonarqube_db_password
        target: sonarqube_db_password
    # The image reads only SONAR_JDBC_PASSWORD, not a _FILE form
    # (infra/secret-file-support.json); export it from the secret and keep the
    # image entrypoint.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        SONAR_JDBC_PASSWORD="$$(cat /run/secrets/sonarqube_db_password)"
        [ -n "$$SONAR_JDBC_PASSWORD" ] || { echo 'sonarqube_db_password is empty' >&2; exit 1; }
        export SONAR_JDBC_PASSWORD
        exec /opt/sonarqube/docker/entrypoint.sh "$$@"
      - sonarqube
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://${LAB_SONARQUBE_DB_HOST:?set an approved mng-pg endpoint host}:${LAB_SONARQUBE_DB_PORT:-5432}/${LAB_SONARQUBE_DB_NAME:-sonarqube}
      - SONAR_JDBC_USERNAME=${LAB_SONARQUBE_DB_USER:-sonarqube}
      - SONAR_WEB_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_SEARCH_JAVAOPTS=-Xmx512m -Xms512m
    labels:
      <<: *tier-label
