# Independent JupyterLab LAB entrypoint (SPEC-0262); never included by the root.
# It joins no HOME network and has no gateway route. MLflow is an optional LAB
# input; HOME publishes no MLflow port to a LAB network by default.
name: hy-home-lab-jupyterlab

x-tier-label: &tier-label
  hy-home.tier: lab
  traefik.enable: 'false'

volumes:
  # Notebooks are user data. The directory must exist and be owned by UID 1000
  # before first start.
  jupyterlab-work:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/jupyterlab/work

networks:
  lab_jupyterlab_net:
    name: hy-home-lab-jupyterlab

# Secret files keep their canonical root paths; no value moves with the LAB.
secrets:
  jupyter_token:
    file: ../secrets/tools/jupyterlab/jupyter_token.txt

services:
  jupyterlab:
    profiles:
      - jupyterlab
    extends:
      file: ../infra/common-optimizations.yml
      service: template-stateful-high
    # The base tag is the Dockerfile ARG default, the single Renovate-owned pin.
    build:
      context: ./jupyterlab
      dockerfile: Dockerfile
    image: hy-home/jupyterlab:scipy-local
    container_name: jupyterlab
    hostname: jupyterlab
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    environment:
      # Empty means no tracking server; set an approved MLflow endpoint to use one.
      MLFLOW_TRACKING_URI: '${LAB_JUPYTERLAB_MLFLOW_TRACKING_URI:-}'
      JUPYTER_PORT: '8888'
    secrets:
      - jupyter_token
    # Jupyter Server reads JUPYTER_TOKEN; an empty token would leave kernels,
    # terminals and the REST API open to every client of the published port.
    command:
      - /bin/bash
      - -ec
      - |
        JUPYTER_TOKEN="$$(tr -d '\r\n' </run/secrets/jupyter_token)"
        [ "$${#JUPYTER_TOKEN}" -ge 16 ] || { echo 'jupyterlab: jupyter_token must be at least 16 characters' >&2; exit 64; }
        export JUPYTER_TOKEN
        exec start-notebook.py \
          --ServerApp.ip=0.0.0.0 \
          --ServerApp.port="$${JUPYTER_PORT}" \
          --ServerApp.root_dir=/home/jovyan/work
    volumes:
      - jupyterlab-work:/home/jovyan/work
    # No gateway route: the server is published on the LAB bind address only.
    ports:
      - '${LAB_HOST_BIND_IP:-127.0.0.1}:${LAB_JUPYTERLAB_HOST_PORT:-18888}:8888'
    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -qO-
          http://127.0.0.1:8888/api
          >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      lab_jupyterlab_net: {}
    labels:
      <<: *tier-label
