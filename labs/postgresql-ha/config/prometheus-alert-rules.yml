# LAB-only alert rules for postgresql-ha. HOME Prometheus does not load this
# file: only the LAB has replicas, and HOME does not scrape pg-*-exporter.
# A LAB Prometheus reads it once a LAB observability contract is approved.
groups:
  - name: postgresql_ha_lab
    rules:
      - alert: PostgresqlReplicationLag
        expr: |
          pg_replication_lag_seconds > 30 and on (instance) pg_replication_is_replica == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL 복제 지연: {{ $labels.instance }}'
          description: 'PostgreSQL 복제 지연이 30초를 초과했습니다.'
          runbook_url: 'https://github.com/buenhyden/hy-home.docker/blob/main/docs/05.operations/runbooks/15-labs/0031-postgresql-cluster.md'
