# Independent Stalwart mail server LAB entrypoint (SPEC-0262); never included
# by the root. It joins no HOME network: no HOME container submits mail to it,
# and HOME mail capture stays on Mailpit.
name: hy-home-lab-stalwart

x-tier-label: &tier-label
  hy-home.tier: lab
  traefik.enable: 'false'

volumes:
  stalwart-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Must exist (empty) before the first start; Docker then copies the
      # image directory's owner (the image user, UID 2000) onto it.
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/stalwart/data

networks:
  lab_stalwart_net:
    name: hy-home-lab-stalwart

# LAB-only secrets under LAB_SECRET_DIR; no root value is shared. Each mounts
# at its original /run/secrets name, which the LAB scripts read.
secrets:
  lab_stalwart_password:
    file: ${LAB_SECRET_DIR:-../secrets/labs}/stalwart/password.txt

services:
  # Mail server on the LAB network only. Containers on lab_stalwart_net submit
  # on 25/587; the admin UI and JMAP on 8080 are published on the LAB bind
  # address only. Listeners, domain and relay policy live in the datastore and
  # come from stalwart/config/plan.ndjson through stalwart-config.
  stalwart:
    profiles:
      - mail-server
    extends:
      file: ../infra/common-optimizations.yml
      service: template-infra-readonly-med
    image: stalwartlabs/stalwart:v0.16.27@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
    container_name: stalwart
    hostname: stalwart
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    # The image user (UID 2000) owns the datastore. The binary carries cap_net_bind_service for ports below 1024; with
    # no-new-privileges it cannot start unless that one capability is kept.
    cap_add:
      - NET_BIND_SERVICE
    entrypoint:
      - /bin/sh
      - /opt/hyhome/start.sh
    environment:
      # Same name as STALWART_USER in stalwart-config below.
      STALWART_ADMIN_USER: admin
    volumes:
      - stalwart-data:/var/lib/stalwart:rw
      - ./stalwart/config/config.json:/etc/stalwart/config.json:ro
      - ./stalwart/config/start.sh:/opt/hyhome/start.sh:ro
    secrets:
      - source: lab_stalwart_password
        target: stalwart_password
    ports:
      - '${LAB_HOST_BIND_IP:-127.0.0.1}:${LAB_STALWART_HOST_PORT:-18093}:8080'
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8080/healthz/live' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      lab_stalwart_net: {}
    labels:
      <<: *tier-label

  # Applies stalwart/config/plan.ndjson (domain, listeners, no relaying) as
  # the recovery admin. Idempotent; listener changes take effect on the next
  # stalwart restart.
  stalwart-config:
    profiles:
      - mail-server
    extends:
      file: ../infra/common-optimizations.yml
      service: template-job-low
    build:
      context: ./stalwart/config
      dockerfile: Dockerfile
    image: hy-home/stalwart-config:0.16.27-cli1.0.13-local
    container_name: stalwart-config
    hostname: stalwart-config
    group_add:
      - '${LAB_SECRETS_GID:-1000}'
    user: '1000:1000'
    entrypoint:
      - /bin/sh
      - /opt/hyhome/apply-plan.sh
    environment:
      # The CLI writes its state under HOME; the root is read-only.
      HOME: /tmp
      DEFAULT_URL: '${LAB_STALWART_DEFAULT_URL:?set the mail domain}'
      STALWART_URL: http://stalwart:8080
      # Same name as STALWART_ADMIN_USER in stalwart above.
      STALWART_USER: admin
    volumes:
      - ./stalwart/config/apply-plan.sh:/opt/hyhome/apply-plan.sh:ro
      - ./stalwart/config/plan.ndjson:/opt/hyhome/plan.ndjson:ro
    secrets:
      - source: lab_stalwart_password
        target: stalwart_password
    depends_on:
      stalwart:
        condition: service_healthy
    networks:
      lab_stalwart_net: {}
    labels:
      <<: *tier-label
