name: hy-home-lab-cassandra
x-tier-label: &tier-label
  hy-home.tier: lab

volumes:
  cassandra-node1-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${LAB_DATA_DIR:?set isolated LAB data root}/cassandra/node1

services:
  cassandra-node1:
    # Reservation: measured in the 2026-11-06 lease run (5 idle samples): peak 0.656 CPU / 1274.9 MiB; x 1.5 with the 0.05 / 32M floor, capped at the limit.
    deploy:
      resources:
        reservations:
          cpus: "1.00"
          memory: 1920M
    profiles:
      - cassandra
    extends:
      file: ../../infra/common-optimizations.yml
      service: template-stateful-db-high
    image: cassandra:5.0.9
    container_name: lab-cassandra-cassandra-node1
    # JVM thread pools; initial budget above the DB template's 1024.
    pids_limit: 2048
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    hostname: cassandra-node1
    read_only: false
    expose:
      - 7000
      - 9042
    networks:
      lab_cassandra_core_net: {}
    environment:
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_CLUSTER_NAME=hy-home-lab-cassandra
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    volumes:
      - cassandra-node1-volume:/var/lib/cassandra:rw
    healthcheck:
      test: [ 'CMD-SHELL', "nodetool status | grep -E '^UN' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      <<: *tier-label

networks:
  lab_cassandra_core_net:
    name: ${LAB_CASSANDRA_CORE_NETWORK_NAME:-hy-home-lab-cassandra-core}
    internal: true
