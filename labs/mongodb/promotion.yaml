# estimate. Secret destinations are a plan only and are never created here.
# kind undecided: the owner has not named a promotion target yet.
kind: undecided
integrations:
- kind: observability
  owner: infra/06-observability/
- kind: openbao
  owner: infra/03-security/openbao/
secrets:
- row: LAB-010
  destination: secrets/db/mongodb/root_password.txt
- row: LAB-011
  destination: secrets/db/mongodb/express_basicauth_password.txt
documents:
