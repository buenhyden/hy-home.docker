      cpus: 0.5
      memory_mib: 256
    mongo-key-generator:
      cpus: 0.5
      memory_mib: 256
    mongodb-arbiter:
      cpus: 1.0
      memory_mib: 512
    mongodb-rep1:
      cpus: 2.0
      memory_mib: 2048
    mongodb-rep2:
      cpus: 2.0
      memory_mib: 2048
  disk_gib:
    data: 20
