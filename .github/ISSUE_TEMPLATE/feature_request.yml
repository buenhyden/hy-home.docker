name: Feature Request
description: Propose a new feature using the spec-driven approach
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
        This Issue owns the request and its priority. Link the Spec contract and
        execution Task when they exist; do not copy their acceptance criteria,
        execution evidence or lifecycle here. Projects may show a filtered view.
  - type: input
    id: prd_link
    attributes:
      label: Requirement / Architecture Link
      description:
        Provide a link to the PRD (`docs/01.requirements`) or ARD (`docs/02.architecture/requirements`) for this feature.
    validations:
      required: false
  - type: input
    id: spec_link
    attributes:
      label: Spec Link
      description: Optional link to the contract under docs/03.specs.
    validations:
      required: false
  - type: input
    id: task_link
    attributes:
      label: Task Link
      description: Optional link to the execution and acceptance owner.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Requested Priority
      description: Maintainers triage priority independently of Task execution status.
      options:
        - low
        - normal
        - high
        - urgent
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user/business problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected Outcome
      description: What measurable outcome should improve after this feature?
      placeholder: "Example: Reduce onboarding completion time from 8m to < 5m"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description:
        A clear and concise description of what the feature is and what it aims
        to solve.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly state what this request does not include.
    validations:
      required: false
