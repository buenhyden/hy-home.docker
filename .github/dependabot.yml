# ============================================================================
# Dependabot Configuration for Hy-Home Infrastructure
# 의존성을 자동으로 최신 상태로 유지하며, 인프라 최적화 환경에 맞춰 관리합니다.
# ============================================================================
version: 2

updates:
  - package-ecosystem: npm
    directory: /projects/storybook/nextjs

    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Asia/Seoul

    open-pull-requests-limit: 5

    cooldown:
      default-days: 7

    commit-message:
      prefix: chore
      include: scope

    labels:
      - dependencies
      - npm
      - storybook

    groups:
      storybook-nextjs-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
