    command: 'output="$(bash scripts/validation/run-agent-output-eval-fixtures.sh --check-fixtures --check-regressions)"'
  - id: supply-chain-fixture-policy
    workflow: .github/workflows/ci-quality.yml
    job: supply-chain-fixture-policy
    command: python3 -m unittest tests.validation.test_compose_core_readiness tests.validation.test_postgres_logical_upgrade_rehearsal tests.validation.test_grype_db_seed tests.validation.test_supply_chain_policy tests.validation.test_sample_service_delivery_rehearsal -v
  - id: dependency-vulnerability-audit
    workflow: .github/workflows/ci-quality.yml
    job: dependency-vulnerability-audit
    command: npm audit --audit-level=high --prefix projects/storybook/nextjs
  - id: git-flow-contract
    workflow: .github/workflows/ci-quality.yml
    job: git-flow-contract
    command: 'if ! [[ "$PR_TITLE" =~ $title_re ]]; then'
  - id: compose-validation
    workflow: .github/workflows/ci-quality.yml
    job: compose-validation
    command: bash scripts/validation/validate-docker-compose.sh
  - id: compose-all-profiles-validation
    workflow: .github/workflows/ci-quality.yml
    job: compose-all-profiles-validation
    command: bash scripts/validation/validate-docker-compose.sh
  - id: infrastructure-hardening
    workflow: .github/workflows/ci-quality.yml
    job: infrastructure-hardening
    command: bash scripts/hardening/check-all-hardening.sh
  - id: template-security-baseline
    workflow: .github/workflows/ci-quality.yml
    job: template-security-baseline
    command: bash scripts/validation/check-template-security-baseline.sh
  - id: quickwin-baseline
    workflow: .github/workflows/ci-quality.yml
    job: quickwin-baseline
    command: bash scripts/validation/check-quickwin-baseline.sh
  - id: pre-commit
    workflow: .github/workflows/ci-quality.yml
    job: pre-commit
    command: bash scripts/validation/run-ci-precommit.sh
  - id: frontend-quality
    workflow: .github/workflows/ci-quality.yml
    job: frontend-quality
    command: npm run build-storybook --prefix projects/storybook/nextjs
  - id: storybook-coverage
    workflow: .github/workflows/ci-quality.yml
    job: storybook-coverage
    command: npm run coverage --prefix projects/storybook/nextjs
  - id: zizmor
    workflow: .github/workflows/ci-quality.yml
    job: zizmor
    command: uvx --from 'zizmor==1.28.0' zizmor . --format sarif . > results.sarif

