{
  "schema_version": 2,
  "workflows": {
    ".github/workflows/ci-quality.yml": {
      "name": "CI Quality Gates",
      "classification": "required-quality",
      "triggers": {
        "push": {
          "branches": [
            "main"
          ]
        },
        "pull_request": {
          "branches": [
            "main"
          ]
        },
        "workflow_dispatch": null
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "${{ github.workflow }}-${{ github.ref }}",
        "cancel-in-progress": true
      },
      "jobs": {
        "docs-traceability": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "docs-implementation-alignment": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "repo-contracts": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "agent-output-eval-fixture-gate": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "supply-chain-fixture-policy": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "dependency-vulnerability-audit": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "git-flow-contract": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "compose-validation": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "compose-all-profiles-validation": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "infrastructure-hardening": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "template-security-baseline": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "quickwin-baseline": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        },
        "pre-commit": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 20
        },
        "frontend-quality": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 20
        },
        "storybook-coverage": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 20
        },
        "zizmor": {
          "permissions": {
            "security-events": "write",
            "actions": "read",
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        }
      }
    },
    ".github/workflows/document-corpus-lifecycle.yml": {
      "name": "Document Corpus Lifecycle",
      "classification": "non-gating",
      "triggers": {
        "schedule": [
          {
            "cron": "17 17 * * 1"
          }
        ],
        "workflow_dispatch": null
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "document-corpus-lifecycle-${{ github.ref }}",
        "cancel-in-progress": true
      },
      "jobs": {
        "document-corpus-lifecycle": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 15
        }
      }
    },
    ".github/workflows/generate-changelog.yml": {
      "name": "Release Changelog Check",
      "classification": "non-gating",
      "triggers": {
        "push": {
          "tags": [
            "v*.*.*"
          ]
        }
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "${{ github.workflow }}-${{ github.ref }}",
        "cancel-in-progress": true
      },
      "jobs": {
        "changelog": {
          "permissions": null,
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        }
      }
    },
    ".github/workflows/greetings.yml": {
      "name": "Greeting",
      "classification": "non-gating",
      "triggers": {
        "pull_request": {
          "branches": [
            "main"
          ],
          "types": [
            "opened"
          ]
        },
        "issues": {
          "types": [
            "opened"
          ]
        }
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "issue-greeting": {
          "permissions": {
            "issues": "write",
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        },
        "pull-request-greeting": {
          "permissions": {
            "issues": "write",
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        }
      }
    },
    ".github/workflows/pr-labeler.yml": {
      "name": "Pull Request Labeler",
      "classification": "non-gating",
      "triggers": {
        "pull_request": {
          "branches": [
            "main"
          ],
          "types": [
            "opened",
            "synchronize",
            "reopened"
          ]
        }
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "triage": {
          "permissions": {
            "contents": "read",
            "pull-requests": "write"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        }
      }
    },
    ".github/workflows/stale.yml": {
      "name": "Close Stale Issues & PRs",
      "classification": "non-gating",
      "triggers": {
        "schedule": [
          {
            "cron": "30 1 * * *"
          }
        ]
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "stale": {
          "permissions": {
            "issues": "write",
            "pull-requests": "write",
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10
        }
      }
    },
    ".github/workflows/tech-stack-version-sync.yml": {
      "name": "Tech-Stack Version Sync",
      "classification": "non-gating",
      "triggers": {
        "pull_request": {
          "branches": [
            "main"
          ],
          "paths": [
            "docker-compose.yml",
            "infra/**/docker-compose*.yml",
            "infra/tech-stack.versions.json"
          ]
        }
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "tech-stack-version-sync-${{ github.ref }}",
        "cancel-in-progress": true
      },
      "jobs": {
        "drift-gate": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5
        }
      }
    }
  },
