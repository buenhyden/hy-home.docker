{
  "schema_version": 2,
  "workflows": {
    ".github/workflows/ci-quality.yml": {
      "name": "CI Quality Gates",
      "classification": "required-quality",
      "triggers": {
        "push": {
          "branches": [
            "main"
          ]
        },
        "pull_request": {
          "branches": [
            "main"
          ],
          "types": [
            "opened",
            "synchronize",
            "reopened"
          ]
        }
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}",
        "cancel-in-progress": true
      },
      "jobs": {
        "candidate-quality": {
          "permissions": {
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 30,
          "condition": "github.event_name == 'pull_request'",
          "needs": [],
          "environment": {
            "EVENT_NAME": "pull_request",
            "PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD_SHA": "${{ github.event.pull_request.head.sha }}"
          }
        },
        "main-security": {
          "permissions": {
            "contents": "read",
            "security-events": "write"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 15,
          "condition": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
          "needs": [],
          "environment": null
        }
      }
    },
    ".github/workflows/generate-changelog.yml": {
      "name": "Publish SemVer Release",
      "classification": "non-gating",
      "triggers": {
        "workflow_dispatch": {
          "inputs": {
            "version": {
              "description": "Prepared SemVer version without v prefix (for example 1.2.3 or 1.2.3-rc.1)",
              "required": true,
              "type": "string"
            }
          }
        }
      },
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "release-${{ inputs.version }}",
        "cancel-in-progress": false
      },
      "jobs": {
        "release": {
          "permissions": {
            "contents": "write"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10,
          "condition": "github.ref == 'refs/heads/main'",
          "needs": [],
          "environment": null
        }
      }
    },
    ".github/workflows/greetings.yml": {
      "name": "Greeting",
      "classification": "non-gating",
      "triggers": {
        "pull_request": {
          "branches": [
            "main"
          ],
          "types": [
            "opened"
          ]
        },
        "issues": {
          "types": [
            "opened"
          ]
        }
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "issue-greeting": {
          "permissions": {
            "issues": "write",
            "contents": "read",
            "pull-requests": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5,
          "condition": "github.event_name == 'issues'",
          "needs": [],
          "environment": null
        },
        "pull-request-greeting": {
          "permissions": {
            "issues": "read",
            "contents": "read",
            "pull-requests": "write"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5,
          "condition": "github.event_name == 'pull_request'",
          "needs": [],
          "environment": null
        }
      }
    },
    ".github/workflows/pr-labeler.yml": {
      "name": "Pull Request Labeler",
      "classification": "non-gating",
      "triggers": {
        "pull_request": {
          "branches": [
            "main"
          ],
          "types": [
            "opened",
            "synchronize",
            "reopened"
          ]
        }
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "triage": {
          "permissions": {
            "contents": "read",
            "pull-requests": "write"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 5,
          "condition": null,
          "needs": [],
          "environment": null
        }
      }
    },
    ".github/workflows/stale.yml": {
      "name": "Close Stale Issues & PRs",
      "classification": "non-gating",
      "triggers": {
        "schedule": [
          {
            "cron": "30 1 * * *"
          }
        ]
      },
      "permissions": {},
      "concurrency": null,
      "jobs": {
        "stale": {
          "permissions": {
            "issues": "write",
            "pull-requests": "write",
            "contents": "read"
          },
          "runs_on": "ubuntu-latest",
          "timeout_minutes": 10,
          "condition": null,
          "needs": [],
          "environment": null
        }
      }
    }
  },
