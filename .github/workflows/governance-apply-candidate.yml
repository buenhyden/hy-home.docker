name: Temporary candidate verification
'on':
  push:
    branches:
    - codex/governance-qa-convergence
    paths:
    - .github/workflows/governance-apply-candidate.yml
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout isolated feature branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: projects/storybook/nextjs/package-lock.json
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
    - name: Install existing validation dependencies
      run: python3 -m pip install -r scripts/requirements.txt -r scripts/requirements-pre-commit.txt
    - name: Reconstruct candidate, preserve upstream, and upload immutable content
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -I - <<'PYCODE'
        import base64, hashlib, json, lzma, os, subprocess, urllib.request, urllib.error
        from pathlib import Path
        TOKEN=os.environ.pop('GH_TOKEN')
        PREFIX='https://api.github.com/repos/buenhyden/hy-home.docker/'
        TEMP=Path(os.environ['RUNNER_TEMP'])
        INCOMING=os.environ['GITHUB_SHA']
        EXPECTED='72eb9b1528501e639c06524a9a2bfefb2af0f924'
        def api(path, body=None):
            req=urllib.request.Request(PREFIX+path,
                data=None if body is None else json.dumps(body).encode(),
                headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json',
                    'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
            try:
                with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
            except urllib.error.HTTPError as error:
                detail=json.loads(error.read())
                raise RuntimeError(str(error.code)+' '+str(detail.get('message','request failed'))) from None
        def read_blob(sha):
            value=base64.b64decode(api('git/blobs/'+sha)['content'])
            if hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()!=sha:
                raise RuntimeError('blob identity mismatch')
            return value
        parts=['113a1b0b3997744fc67d35a21d239ee775729d58','c1e8c89dfa865146034f1806d93918e1f6839d41',
               '2116852b70a99c52cdc91b03ec987e1b60db873b','c3cbe3f15b410043e48f85db6be6d935aa8c9864']
        compressed=b''.join(read_blob(sha) for sha in parts)
        if hashlib.sha256(compressed).hexdigest()!='b969c4bbe2b35773d2d12d4e3ca163954f0ddb22ed87495d377cb33fb29f8890':
            raise RuntimeError('compressed candidate mismatch')
        raw=lzma.decompress(compressed)
        if hashlib.sha256(raw).hexdigest()!='d897fe9c04a5b5986b6a847c09201181f87c0f031641875d03b4cb88fb3f89bc':
            raise RuntimeError('candidate payload mismatch')
        payload=json.loads(raw)
        helper={'__name__':'reviewed_candidate_helper'}
        exec(compile(read_blob('134770c3200cac74d54bed821bc154fec8888bfd'),'<reviewed-helper>','exec'),helper)
        git=helper['git']
        subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
        subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
        extras=('.github/workflows/governance-audit-tools.yml','.github/workflows/governance-apply-candidate.yml')
        rows=helper['apply'](payload,extras)
        commits=helper['commit_rows'](rows,extras)
        if git('rev-parse','HEAD^{tree}')!=EXPECTED or git('status','--porcelain'):
            raise RuntimeError('candidate reconstruction mismatch')
        ledger={'incoming':INCOMING,'baseline':payload['baseline'],'input_tree':EXPECTED,
                'commits':commits,'refs_updated':False,'tree':EXPECTED}
        (TEMP/'candidate-result.json').write_text(json.dumps(ledger,indent=2))
        # Preserve all newly merged upstream work; never move or write the remote main ref.
        merger={'__name__':'reviewed_merge_helper'}
        exec(compile(read_blob('56f10129d55ba9a4cba947ac4aa3e4fb7b15f0d2'),'<reviewed-merge>','exec'),merger)
        upstream=merger['integrate'](git)
        if git('rev-parse','HEAD')!=commits[-1]['sha']:
            commits.append({'sha':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),
                            'message':git('show','-s','--format=%B','HEAD')})
        ledger.update({'tree':git('rev-parse','HEAD^{tree}'),'upstream':upstream,'commits':commits})
        (TEMP/'candidate-result.json').write_text(json.dumps(ledger,indent=2))
        # Only immutable content blobs are uploaded here. The connected GitHub app owns
        # workflow-tree creation, logical commits, and the eventual non-force ref update.
        uploaded=set()
        for row in commits:
            sha=row['sha']
            row['parents']=git('show','-s','--format=%P',sha).split()
            diff=subprocess.check_output(['git','diff-tree','--no-commit-id','--no-renames',
                '-r','-z','--raw',sha+'^',sha]).split(b'\0')
            entries=[]
            for i in range(0,len(diff)-1,2):
                before,after,old,new,status=diff[i].decode().split()
                path=diff[i+1].decode()
                if status=='D': entries.append({'path':path,'mode':before[1:],'type':'blob','sha':None})
                else:
                    if new not in uploaded:
                        data=subprocess.check_output(['git','cat-file','blob',new])
                        value=api('git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
                        if value['sha']!=new: raise RuntimeError('uploaded content identity mismatch')
                        uploaded.add(new)
                    entries.append({'path':path,'mode':after,'type':'blob','sha':new})
            row['tree_elements']=entries
            (TEMP/'candidate-result.json').write_text(json.dumps(ledger,indent=2))
        ledger['objects_ready']=True
        (TEMP/'candidate-result.json').write_text(json.dumps(ledger,indent=2))
        print('Verified tree:',ledger['tree'],'; logical units:',len(commits),'; remote refs unchanged')
        PYCODE
    - name: Store prepared object ledger
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: governance-prepared-objects
        path: ${{ runner.temp }}/candidate-result.json
        retention-days: 1
        if-no-files-found: error
    - name: Run actual Hosted full QA
      id: full
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/run-ci-gate.py --profile full
    - name: Preserve bounded candidate and QA evidence
      if: always()
      env:
        QA_OUTCOME: ${{ steps.full.outcome }}
      shell: bash
      run: |
        python3 -I - <<'PYCODE'
        import json, os, subprocess
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        path=root/'candidate-result.json'
        result=json.loads(path.read_text()) if path.exists() else {'objects_ready':False}
        result['hosted_full_outcome']=os.environ['QA_OUTCOME']
        result['run_id']=os.environ['GITHUB_RUN_ID']
        result['worktree_status']=subprocess.check_output(['git','status','--porcelain']).decode()
        path.write_text(json.dumps(result,indent=2))
        (root/'candidate-format.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
        subprocess.run(['git','bundle','create',str(root/'candidate-source.bundle'),'--all'],check=True)
        PYCODE
    - name: Store evidence and source recovery input
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: governance-candidate-result
        path: |
          ${{ runner.temp }}/candidate-result.json
          ${{ runner.temp }}/candidate-format.patch
          ${{ runner.temp }}/candidate-source.bundle
        retention-days: 1
        if-no-files-found: error
