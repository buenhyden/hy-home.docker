name: Temporary governance audit snapshot

on:
  push:
    branches: [codex/governance-qa-convergence]
    paths: [.github/workflows/governance-audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read committed repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export committed objects for isolated local verification
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/governance-audit.bundle" --all
          git bundle verify "$RUNNER_TEMP/governance-audit.bundle"
          sha256sum "$RUNNER_TEMP/governance-audit.bundle"
      - name: Store temporary audit input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-audit-source
          path: ${{ runner.temp }}/governance-audit.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
