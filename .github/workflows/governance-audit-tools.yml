name: Temporary portable QA tools

on:
  push:
    branches: [codex/governance-qa-convergence]
    paths: [.github/workflows/governance-audit-tools.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect public verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-tools/wheels" "$RUNNER_TEMP/qa-tools/bin"
          python3 -m pip download --only-binary=:all: --no-deps \
            'html5lib==1.1' 'markdown-it-py==3.0.0' 'ruff==0.15.12' \
            --dest "$RUNNER_TEMP/qa-tools/wheels"
          cp "$(command -v docker)" "$RUNNER_TEMP/qa-tools/bin/docker"
          compose_path="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          test -f "$compose_path"
          cp "$compose_path" "$RUNNER_TEMP/qa-tools/bin/docker-compose"
          (cd "$RUNNER_TEMP/qa-tools" && sha256sum wheels/* bin/* > SHA256SUMS)
      - name: Store short-lived verification tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-audit-tools
          path: ${{ runner.temp }}/qa-tools/
          retention-days: 1
          if-no-files-found: error
