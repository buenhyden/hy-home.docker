name: Publish SemVer Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prepared SemVer version without v prefix (for example 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish prepared main release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout prepared main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create draft, attach complete assets and publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/operations/release.py publish \
            --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
