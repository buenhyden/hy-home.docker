name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-quality:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Capture trusted pull request context
        id: trusted-context
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          git_path="$(type -P git)"
          python_path="$(type -P python3)"
          test -n "$git_path" && test -x "$git_path"
          test -n "$python_path" && test -x "$python_path"
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$("$git_path" rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          mapfile -t parents < <("$git_path" cat-file commit "$GITHUB_SHA" | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p')
          test "${#parents[@]}" -eq 2
          {
            printf 'event-name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'merge-sha=%s\n' "$GITHUB_SHA"
            printf 'base-sha=%s\n' "${parents[0]}"
            printf 'head-sha=%s\n' "${parents[1]}"
            printf 'git-path=%s\n' "$git_path"
            printf 'python-path=%s\n' "$python_path"
          } >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Install validation controller dependencies
        env:
          TRUSTED_PYTHON_PATH: ${{ steps.trusted-context.outputs.python-path }}
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: '"$TRUSTED_PYTHON_PATH" -m pip install -r scripts/requirements.txt -r scripts/requirements-pre-commit.txt'
      - name: Select candidate prerequisites
        id: prerequisites
        env:
          TRUSTED_EVENT_NAME: ${{ steps.trusted-context.outputs.event-name }}
          TRUSTED_MERGE_SHA: ${{ steps.trusted-context.outputs.merge-sha }}
          TRUSTED_BASE_SHA: ${{ steps.trusted-context.outputs.base-sha }}
          TRUSTED_HEAD_SHA: ${{ steps.trusted-context.outputs.head-sha }}
          TRUSTED_GIT_PATH: ${{ steps.trusted-context.outputs.git-path }}
          TRUSTED_PYTHON_PATH: ${{ steps.trusted-context.outputs.python-path }}
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: '"$TRUSTED_PYTHON_PATH" scripts/validation/run-ci-gate.py --profile changed --requirements >> "$GITHUB_OUTPUT"'
      - name: Set up Node.js
        if: steps.prerequisites.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify selected Docker prerequisite
        if: steps.prerequisites.outputs.docker == 'true'
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: docker version
      - name: Run changed candidate validation
        env:
          TRUSTED_EVENT_NAME: ${{ steps.trusted-context.outputs.event-name }}
          TRUSTED_MERGE_SHA: ${{ steps.trusted-context.outputs.merge-sha }}
          TRUSTED_BASE_SHA: ${{ steps.trusted-context.outputs.base-sha }}
          TRUSTED_HEAD_SHA: ${{ steps.trusted-context.outputs.head-sha }}
          TRUSTED_GIT_PATH: ${{ steps.trusted-context.outputs.git-path }}
          TRUSTED_PYTHON_PATH: ${{ steps.trusted-context.outputs.python-path }}
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: '"$TRUSTED_PYTHON_PATH" scripts/validation/run-ci-gate.py --profile changed'

  main-security:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Audit merged workflow revision
        run: python3 scripts/lib/gate/ci_gate_adapters.py run-zizmor-sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
          category: zizmor
