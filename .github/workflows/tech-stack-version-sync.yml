name: Tech-Stack Version Sync

# Guard infra/tech-stack.versions.json (a curated drift gate, downstream of the
# Docker Compose image declarations) when a PR changes compose image tags.
#
# Repository security governance forbids contents: write in workflows, so this
# job does NOT auto-commit. It runs the sync script in read-only --check mode and
# fails the PR with an actionable message when the registry drifts from compose
# (for example after a Dependabot docker-compose bump). The fix is one command:
#   bash scripts/operations/sync-tech-stack-versions.sh
# committed to the PR branch by the author/maintainer.
#
# This is not the only place that command runs, and it is not the gate that
# blocks a merge. `leaf.local-tech-stack-version-drift` invokes the same
# entrypoint with the same argument as a root of `repository-integrity`, the
# declared changed-profile fallback, so the required `validation-changed` job
# already runs this check on every pull request to main. This workflow narrows
# the same command to the paths that can cause the drift, which gives a
# path-scoped signal that does not wait on the full quality job. Because the two
# are deliberately the same command, a registered test in
# tests/validation/test_tech_stack_version_contract.py pins them to each other:
# change the command here without changing the gate leaf and that test fails.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'infra/**/docker-compose*.yml'
      - 'infra/tech-stack.versions.json'

permissions:
  contents: read

concurrency:
  group: tech-stack-version-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check tech-stack registry is synced to compose tags
        run: bash scripts/operations/sync-tech-stack-versions.sh --check
