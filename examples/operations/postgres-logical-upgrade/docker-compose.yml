services:
  source:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    pull_policy: never
    environment:
      POSTGRES_DB: rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: ${IOR_POSTGRES_PASSWORD:?process-local synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - /var/lib/postgresql/data

  target:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    pull_policy: never
    environment:
      POSTGRES_DB: rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: ${IOR_POSTGRES_PASSWORD:?process-local synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - /var/lib/postgresql
