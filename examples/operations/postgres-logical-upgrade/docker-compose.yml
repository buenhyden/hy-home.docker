services:
  source:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    pull_policy: never
    environment:
      POSTGRES_DB: rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: ${IOR_POSTGRES_PASSWORD:?process-local synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - /var/lib/postgresql/data

  target:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    pull_policy: never
    environment:
      POSTGRES_DB: rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: ${IOR_POSTGRES_PASSWORD:?process-local synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - /var/lib/postgresql
