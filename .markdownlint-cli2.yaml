config:
  MD013: false
  MD025: false
  MD028: false
  MD036: false
  MD060: false
  MD033:
    allowed_elements:
      - div
      - br
      - p
      - feature-or-system
      - system-or-domain
      - feature-id
      - short-title
      - feature
      - topic
      - policy
      - domain
      - related-decision
      - policy-or-standard
      - system-or-domain-name
      - feature-or-stream
      - incident-title
      - subdomain
  MD024: false
# Shared markdownlint-cli2 rules for docs and root markdown files.
#
# Every entry below names something that exists in this repository today. An
# ignore for a deleted path is worse than useless: it reads as a standing
# exemption for content nobody can inspect.
ignores:
  # Untracked local tooling and build output. markdownlint-cli2 walks the
  # working tree directly, so Git ignoring these is not enough.
  - ".git/"
  - ".history/"
  - ".mypy_cache/"
  - ".vscode/"
  - "node_modules/"
  - "dist/"
  - "coverage/"
  - "storybook-static/"

  # Regenerated by `graphify`, never hand-edited. GRAPH_REPORT.md alone reports
  # 1464 findings, and satisfying them would mean editing a generated artifact.
  - "graphify-out/"

  # Claude Code fixes this file's shape as frontmatter followed by prose, so
  # MD041 cannot be satisfied without breaking the runtime contract. The rest
  # of the `.claude/` projection is linted, exactly like its `.agents/` twin.
  - ".claude/output-styles/"

# Markdown auto-fix remains the canonical document formatter in pre-commit.
fix: true
