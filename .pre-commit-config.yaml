minimum_pre_commit_version: '3.7.0'
default_install_hook_types: [pre-commit, pre-push, commit-msg]

# Generated knowledge-graph snapshots are regenerated by `graphify`, not edited
# by hand. Exclude them from file-passing hooks so formatters never rewrite a
# generated artifact mid-commit. See docs/00.agent-governance/roles/qa.md
# (Generated-Artifact Freshness) for the commit workflow that avoids the
# pre-commit intermediate-stash vs. live-watcher race.
exclude: '^graphify-out/'

repos:
  # --- 1. Basic Format & File System ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: end-of-file-fixer
      - id: check-json
      - id: mixed-line-ending
      - id: trailing-whitespace

  # --- 2. Linting (YAML, Markdown, Shell) ---
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        require_serial: true
        files: \.md$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: \.sh$

  # --- 3. Actions & CI Configuration ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-dependabot
        files: ^\.github/dependabot\.yml$

  # --- 4. Infrastructure & Docker ---
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        files: (^|/)(Dockerfile|Dockerfile\.[^/]+)$

  # --- 5. Security ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # --- 6. Local Project Specific ---
  - repo: local
    hooks:
      - id: public-validation-changed
        name: Public validation suites (changed)
        entry: python3 scripts/validation/run-ci-gate.py --profile changed
        language: system
        files: ^(AGENTS\.md|CLAUDE\.md|README\.md|docker-compose\.yml|\.env\.example|\.agents/.*|\.claude/.*|\.codex/.*|infra/.*|docs/.*|examples/.*|projects/.*|scripts/.*|secrets/.*|tests/.*|\.github/.*|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit]

      - id: public-validation-full
        name: Public validation suites (full)
        entry: python3 scripts/validation/run-ci-gate.py --profile full
        language: system
        files: ^(AGENTS\.md|CLAUDE\.md|README\.md|docker-compose\.yml|\.env\.example|\.agents/.*|\.claude/.*|\.codex/.*|infra/.*|docs/.*|examples/.*|projects/.*|scripts/.*|secrets/.*|tests/.*|\.github/.*|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

  # --- 7. 커밋 및 메시지 (Release) ---
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
        args: [--allow-abort, --message-length-limit=75, --commit-msg-file]
